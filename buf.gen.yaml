version: v2
# Empty the `out` directories before generating, so a generated file orphaned by
# a deleted proto disappears instead of lingering. Set here rather than as a
# `--clean` flag on one call site: every `buf generate` — `task gen` locally and
# the drift check in CI — has to behave the same, or the CI failure would ask for
# a regeneration that cannot fix it. Both directories hold nothing but buf
# output, so there is nothing else to lose.
clean: true
# Remote plugin versions are pinned so `buf generate` is reproducible: without a
# pin, buf resolves the latest plugin at run time, so the same proto produces a
# different stamp depending on who ran `task gen` and when. A pin must not be
# newer than the runtime library the generated code is compiled against. The org
# Renovate preset raises each pin once the Buf Schema Registry publishes the
# plugin, in the same PR as that library when the registry already serves it.
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: server/internal/proto/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v2.0.0
    out: server/internal/proto/gen
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.16.0
    out: packages/api-client/src/gen
    opt: target=ts
