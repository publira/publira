version: "3"

vars:
  BIN_DIR: bin
  GO_SOURCES:
    - ./**/*.go
    - ./go.mod
    - ./go.sum

tasks:
  # Public tasks are alphabetized; internal tasks are at the bottom.
  build:
    desc: Build all server command binaries
    cmds:
      - go build -o {{.BIN_DIR}}/ ./cmd/...
    sources:
      - "{{.GO_SOURCES}}"
    generates:
      - "{{.BIN_DIR}}/*"

  clean:
    desc: Remove compiled server binaries
    cmds:
      - rm -rf {{.BIN_DIR}}

  deps:
    desc: Install and update server dependencies
    cmds:
      - task: tidy

  dev:
    desc: Run all server development APIs together
    cmds:
      - task: storage-init
      - task: dev-servers

  dev-admin-api:
    desc: Run the admin API server in development mode
    cmds: [{ task: run, vars: { NAME: admin-api-server } }]

  dev-admin-image-server:
    desc: Run the admin image server in development mode
    cmds: [{ task: run, vars: { NAME: admin-image-server } }]

  dev-api:
    desc: Run the public API server in development mode
    cmds: [{ task: run, vars: { NAME: api-server } }]

  dev-image-server:
    desc: Run the image server in development mode
    cmds: [{ task: run, vars: { NAME: image-server } }]

  dev-platform-api:
    desc: Run the platform API server in development mode
    cmds: [{ task: run, vars: { NAME: platform-api-server } }]

  lint:
    desc: Run golangci-lint over the server module
    cmds:
      - golangci-lint run ./...

  run:
    desc: Run a specific server command by name
    cmds:
      - go run ./cmd/{{.NAME}}
    requires:
      vars: [NAME]

  setup:
    desc: Prepare server dependency setup
    cmds:
      - task: deps
      - task: storage-init

  storage-init:
    desc: Initialize storage backend (create S3 bucket or local directory)
    cmds:
      - bash scripts/storage-init.sh

  test:
    desc: Run all Go tests in the server module (includes Testcontainers DB integration tests; requires Docker)
    cmds:
      - go test ./...

  test-short:
    desc: Run Go tests excluding Testcontainers-backed integration tests
    cmds:
      - go test -short ./...

  tidy:
    desc: Sync and clean up Go module dependencies
    cmds:
      - go mod tidy

  dev-servers:
    desc: Run server development APIs concurrently
    internal: true
    deps:
      - task: dev-api
      - task: dev-admin-api
      - task: dev-admin-image-server
      - task: dev-image-server
      - task: dev-platform-api
