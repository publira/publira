# Tests commit fake credentials on purpose. A real one here would go
# unreported, so tests take real credentials from the environment only.
paths-ignore:
  # Test files
  - "**/*_test.go"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/*_test.dart"
  # Fixtures, test data, snapshots
  - "**/fixtures/**"
  - "**/testdata/**"
  - "**/__snapshots__/**"
  # Test trees
  - "e2e/**"
  - "mobile/test/**"
  - "mobile/integration_test/**"
  # Go test-helper packages
  - "server/**/*test/**"
  - "server/internal/testutil/**"
