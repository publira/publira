name: Weekly scan

# The vulnerability scans of CI, run on `main` every week with no base, so an
# advisory published after its dependency merged reaches an Issue instead of
# waiting for the next pull request that touches the same lock file. The
# scans are scan.yml's, the same steps against the same ignore files as
# `Scan / Go` and `Scan / Dependencies`; Report keeps one Issue for what
# they find, as .github/workflows/README.md describes.

on:
  schedule:
    # Mondays, away from CI's nightly run at 03:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: {}

# Two runs at once would both see no Issue and each open one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan
    permissions:
      contents: read
    uses: ./.github/workflows/scan.yml
    with:
      report: true

  report:
    name: Report
    needs: scan
    # A failed scan is what this job reads; a run started on another branch
    # scans that branch, and is no news about `main`.
    if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            scripts

      - name: Setup / Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      # A job that did not get as far as its upload leaves no artifact, which
      # scripts/scan-report.ts reads as a scan that did not finish.
      - name: Report / Download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scan-report-*
          path: ${{ runner.temp }}/scan-report

      - name: Report / Build
        env:
          COMMIT: ${{ github.sha }}
          REPORT_DIR: ${{ runner.temp }}/scan-report
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/scan-report.ts "${REPORT_DIR}" --commit "${COMMIT}" --run "${RUN_URL}" > "${RUNNER_TEMP}/report.json"

      - name: Report / Issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT: ${{ runner.temp }}/report.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('node:fs');
            const { state, body } = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
            const { owner, repo } = context.repo;
            const runUrl = process.env.RUN_URL;
            const TITLE = 'Known vulnerabilities on main';
            const LABEL = 'security';
            const MARKER = '<!-- publira-weekly-scan ';
            const firstLine = (text) => (text ?? '').split(/\r?\n/, 1)[0];

            // The Issue is the open one whose body starts with the marker,
            // whatever its title has been edited to since.
            const open = (
              await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'open',
                labels: LABEL,
                per_page: 100,
              })
            )
              .filter((issue) => !issue.pull_request && (issue.body ?? '').startsWith(MARKER))
              .sort((a, b) => a.number - b.number);
            const [issue] = open;
            if (open.length > 1) {
              core.warning(`More than one open Issue carries the marker; updating #${issue.number}`);
            }

            if (state === 'incomplete') {
              core.setFailed('A scan did not finish, so the Issue is left as it is.');
              return;
            }

            if (state === 'clean') {
              if (issue === undefined) {
                core.info('Nothing found, and no Issue is open.');
                return;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `[This run](${runUrl}) found nothing, so the Issue is closed.`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed #${issue.number}.`);
              return;
            }

            if (issue === undefined) {
              const { data: created } = await github.rest.issues.create({
                owner,
                repo,
                title: TITLE,
                body,
                labels: [LABEL],
              });
              core.info(`Opened #${created.number}.`);
              return;
            }

            // The first line carries the fingerprint of the findings, so a
            // comment, which notifies, is posted only when they changed; the
            // body is rewritten every run to name the commit it scanned.
            const changed = firstLine(issue.body) !== firstLine(body);
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              body,
            });
            if (changed) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `[This run](${runUrl}) found something different; the description now lists it.`,
              });
            }
            core.info(`Updated #${issue.number}${changed ? ', with a comment' : ''}.`);
