name: CI

env:
  # renovate: datasource=github-releases depName=go-task/task versioning=semver-coerced
  TASK_VERSION: 3.49.1
  # renovate: datasource=github-releases depName=sqlc-dev/sqlc versioning=semver-coerced
  SQLC_VERSION: 1.30.0
  # renovate: datasource=github-releases depName=bufbuild/buf versioning=semver-coerced
  BUF_VERSION: 1.67.0
  # renovate: datasource=github-releases depName=golang-migrate/migrate versioning=semver-coerced
  MIGRATE_VERSION: 4.19.1
  # renovate: datasource=flutter-version depName=flutter
  FLUTTER_VERSION: 3.41.6

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly Docker full matrix (UTC) — catches cross-service drift missed by path filters
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      docker_mode:
        description: "Docker images: verify = role representatives; full = all documented images"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - full

# Branch ruleset should require only the final job display name: "Summary"
# (see job `summary` below). Intermediate jobs may be skipped by path filters.

# Repo default is read-only GITHUB_TOKEN; paths-filter needs PR file list on pull_request.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubicloud-standard-2
    outputs:
      check: ${{ steps.plan.outputs.check }}
      test_go: ${{ steps.plan.outputs.test_go }}
      test_ts: ${{ steps.plan.outputs.test_ts }}
      test_mobile: ${{ steps.plan.outputs.test_mobile }}
      build: ${{ steps.plan.outputs.build }}
      docker_any: ${{ steps.plan.outputs.docker_any }}
      docker_matrix: ${{ steps.plan.outputs.docker_matrix }}
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Path filter
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            check:
              - 'apps/**'
              - 'packages/**'
              - 'server/**'
              - 'db/**'
              - 'proto/**'
              - 'sqlc.yaml'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'oxlint.config.ts'
              - 'oxfmt.config.ts'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            test_go:
              - 'server/**'
              - 'db/**'
              - 'proto/**'
              - 'sqlc.yaml'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            test_ts:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            test_mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            build:
              - 'apps/**'
              - 'packages/**'
              - 'server/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            docker_web:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'infra/docker/web/**'
              - 'infra/docker/Taskfile.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            docker_api:
              - 'server/**'
              - 'infra/docker/api/**'
              - 'infra/docker/Taskfile.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            docker_batch:
              - 'server/**'
              - 'infra/docker/batch/**'
              - 'infra/docker/Taskfile.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            docker_core:
              - 'infra/docker/web/**'
              - 'infra/docker/api/**'
              - 'infra/docker/batch/**'
              - 'infra/docker/Taskfile.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'

      - name: Plan jobs
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          DOCKER_MODE_INPUT: ${{ inputs.docker_mode }}
          FILTER_CHECK: ${{ steps.filter.outputs.check }}
          FILTER_TEST_GO: ${{ steps.filter.outputs.test_go }}
          FILTER_TEST_TS: ${{ steps.filter.outputs.test_ts }}
          FILTER_TEST_MOBILE: ${{ steps.filter.outputs.test_mobile }}
          FILTER_BUILD: ${{ steps.filter.outputs.build }}
          FILTER_DOCKER_WEB: ${{ steps.filter.outputs.docker_web }}
          FILTER_DOCKER_API: ${{ steps.filter.outputs.docker_api }}
          FILTER_DOCKER_BATCH: ${{ steps.filter.outputs.docker_batch }}
          FILTER_DOCKER_CORE: ${{ steps.filter.outputs.docker_core }}
        run: bash scripts/ci-plan-jobs.sh

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubicloud-standard-2
    services:
      postgres:
        image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: publira
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d publira" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Setup / Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: server/go.sum

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup / pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup / Install sqlc
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      - name: Setup / Install buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}

      - name: Setup / Install migrate
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) migrate_arch="amd64" ;;
            arm64) migrate_arch="arm64" ;;
            *) echo "Unsupported architecture: $arch"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/migrate.linux-${migrate_arch}.tar.gz" -o /tmp/migrate.tgz
          tar -xzf /tmp/migrate.tgz -C /tmp migrate
          sudo install -m 0755 /tmp/migrate /usr/local/bin/migrate
          rm -f /tmp/migrate /tmp/migrate.tgz

      - name: Dependencies / Install
        run: task deps

      - name: Validate / DB Migrations
        run: |
          migrate -path db/migrations -database "postgres://postgres:password@localhost:5432/publira?sslmode=disable" up

      - name: Validate / sqlc Generated Diff
        run: sqlc diff

      - name: Build / Packages
        run: pnpm build --filter "./packages/*"

      - name: Build / Typegen
        run: pnpm typegen

      - name: Validate / Lint and Format
        run: pnpm check

      - name: Validate / Typecheck
        run: pnpm typecheck

  test-go:
    name: Test / Go
    needs: changes
    if: needs.changes.outputs.test_go == 'true'
    runs-on: ubicloud-standard-2
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: server/go.sum

      - name: Validate / Go Tests
        working-directory: server
        run: go test ./...

  test-ts:
    name: Test / TypeScript
    needs: changes
    if: needs.changes.outputs.test_ts == 'true'
    runs-on: ubicloud-standard-2
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Setup / pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Dependencies / Install
        run: pnpm install

      - name: Build / Packages
        run: pnpm build --filter "./packages/*"

      - name: Validate / TypeScript Tests
        run: pnpm test

  test-mobile:
    name: Test / Mobile
    needs: changes
    if: needs.changes.outputs.test_mobile == 'true'
    runs-on: ubicloud-standard-2
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cache: true would pull unpinned actions/cache@v5 inside flutter-action,
      # which violates the repo's required full-length SHA pin policy.
      - name: Setup / Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Dependencies / Install
        run: task mobile:deps

      - name: Validate / Format, Analyze, and Tests
        run: task mobile:check

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubicloud-standard-2
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Setup / Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: server/go.sum

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup / pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Dependencies / Install
        run: task deps

      - name: Build / Web
        run: pnpm build

      - name: Build / Server
        run: task server:build

  docker:
    name: Docker / ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.docker_any == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.docker_matrix) }}
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: ${{ env.TASK_VERSION }}

      # Use the default docker driver so `docker build -t …` loads into the local
      # image store (docker-container Buildx does not, and smoke needs docker run).
      - name: Build image
        env:
          DOCKER_TASK: ${{ matrix.task }}
          DOCKER_ARG: ${{ matrix.arg }}
          DOCKER_EXTRA: ${{ matrix.extra }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKER_EXTRA}" ]; then
            task "${DOCKER_TASK}" "${DOCKER_ARG}" "${DOCKER_EXTRA}"
          else
            task "${DOCKER_TASK}" "${DOCKER_ARG}"
          fi

      - name: Smoke / Web /healthz
        if: matrix.role == 'web'
        env:
          APP_NAME: ${{ matrix.target }}
          PORT: ${{ matrix.port }}
        run: task docker:smoke:web "APP_NAME=${APP_NAME}" "PORT=${PORT}"

  # Single required status check for the branch ruleset (shown as "CI / Summary").
  # Intermediate jobs may be skipped when their paths did not change.
  summary:
    name: Summary
    if: always()
    needs:
      - changes
      - check
      - test-go
      - test-ts
      - test-mobile
      - build
      - docker
    runs-on: ubicloud-standard-2
    steps:
      - name: Aggregate results
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
          TEST_GO: ${{ needs.test-go.result }}
          TEST_TS: ${{ needs.test-ts.result }}
          TEST_MOBILE: ${{ needs.test-mobile.result }}
          BUILD: ${{ needs.build.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "Detect changes=${CHANGES}" \
            "Check=${CHECK}" \
            "Test / Go=${TEST_GO}" \
            "Test / TypeScript=${TEST_TS}" \
            "Test / Mobile=${TEST_MOBILE}" \
            "Build=${BUILD}" \
            "Docker=${DOCKER}"
          do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "${name}: ${result}"
            case "${result}" in
              success|skipped)
                ;;
              *)
                echo "::error::Job failed: ${name} (${result})"
                failed=1
                ;;
            esac
          done
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "All jobs succeeded or were skipped."
