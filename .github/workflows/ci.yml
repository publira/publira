name: CI

env:
  # renovate: datasource=github-releases depName=go-task/task versioning=semver-coerced
  TASK_VERSION: 3.52.0
  # renovate: datasource=github-releases depName=sqlc-dev/sqlc versioning=semver-coerced
  SQLC_VERSION: 1.31.1
  # renovate: datasource=github-releases depName=bufbuild/buf versioning=semver-coerced
  BUF_VERSION: 1.72.0
  # renovate: datasource=github-releases depName=golang-migrate/migrate versioning=semver-coerced
  MIGRATE_VERSION: 4.19.1
  # renovate: datasource=github-releases depName=golangci/golangci-lint versioning=semver-coerced
  GOLANGCI_LINT_VERSION: 2.12.2
  # renovate: datasource=flutter-version depName=flutter
  FLUTTER_VERSION: 3.44.9

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly Docker full matrix (UTC) — catches cross-service drift missed by path filters
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      docker_mode:
        description: "Docker images: verify = role representatives; full = all documented images"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - full

# Branch ruleset should require only the final job display name: "Summary"
# (see job `summary` below). Intermediate jobs may be skipped by path filters.

# Repo default is read-only GITHUB_TOKEN; paths-filter needs PR file list on pull_request.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubicloud-standard-2
    outputs:
      check: ${{ steps.plan.outputs.check }}
      lint_go: ${{ steps.plan.outputs.lint_go }}
      test_go: ${{ steps.plan.outputs.test_go }}
      test_ts: ${{ steps.plan.outputs.test_ts }}
      test_db_migrations: ${{ steps.plan.outputs.test_db_migrations }}
      test_mobile: ${{ steps.plan.outputs.test_mobile }}
      test_e2e: ${{ steps.plan.outputs.test_e2e }}
      test_bootstrap: ${{ steps.plan.outputs.test_bootstrap }}
      build: ${{ steps.plan.outputs.build }}
      docker_any: ${{ steps.plan.outputs.docker_any }}
      docker_matrix: ${{ steps.plan.outputs.docker_matrix }}
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `push` has no API file list, so paths-filter diffs `github.event.before`..HEAD
          # locally: the base commit must be present already, because
          # `persist-credentials: false` leaves no credentials for a fallback `git fetch`.
          # Other events need no history — `pull_request` uses the API file list, and
          # `schedule` / `workflow_dispatch` skip the filter step entirely.
          # Keep `'0'` quoted: a bare 0 is falsy and the `&&`/`||` chain would yield 1.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          persist-credentials: false

      - name: Path filter
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # 'some-with-excludes': a file matches a filter when it matches at least one
          # positive pattern and no negated one. The default 'some' would treat
          # '!**/*.md' as just another alternative and never exclude anything.
          # Applies to every filter below; all other patterns are positive, so their
          # behaviour is unchanged.
          predicate-quantifier: "some-with-excludes"
          filters: |
            # Documentation-only changes must not start any job (#656). Referenced by
            # every filter via the YAML anchor so the list stays in one place; as a
            # filter of its own it is negation-only and therefore always false.
            docs_excluded: &docs_excluded
              - '!**/*.md'
            check:
              - *docs_excluded
              - 'apps/**'
              - 'packages/**'
              - 'e2e/**'
              - 'server/**'
              - 'db/**'
              - 'proto/**'
              - 'sqlc.yaml'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'oxlint.config.ts'
              - 'oxfmt.config.ts'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            # Narrower than test_go on purpose: golangci-lint only reads Go
            # sources and server/.golangci.yml, and `task gen` writes its output
            # under server/, so a db/ or proto/ edit cannot change the result
            # without also touching server/**.
            lint_go:
              - *docs_excluded
              - 'server/**'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            test_go:
              - *docs_excluded
              - 'server/**'
              - 'db/**'
              - 'proto/**'
              - 'sqlc.yaml'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            test_ts:
              - *docs_excluded
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            test_db_migrations:
              - *docs_excluded
              - 'db/**'
              - 'sqlc.yaml'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            test_mobile:
              - *docs_excluded
              - 'mobile/**'
              - 'Taskfile.yaml'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            test_e2e:
              - *docs_excluded
              - 'e2e/**'
              - 'apps/web-host/**'
              - 'apps/web-admin/**'
              - 'packages/**'
              - 'server/**'
              - 'db/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'Taskfile.yaml'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            test_bootstrap:
              - *docs_excluded
              - '.devcontainer/**'
              - 'db/**'
              - 'e2e/bootstrap/**'
              # task dev starts every app and server, so any of their sources
              # can break startup — Test / E2E covers web-host / web-admin and
              # their APIs, not the full task dev surface.
              - 'apps/**'
              - 'packages/**'
              - 'server/**'
              - 'Taskfile.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            build:
              - *docs_excluded
              - 'apps/**'
              - 'packages/**'
              - 'server/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            docker_web:
              - *docs_excluded
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'infra/docker/web/**'
              - 'infra/docker/Taskfile.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            docker_api:
              - *docs_excluded
              - 'server/**'
              - 'infra/docker/api/**'
              - 'infra/docker/Taskfile.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            docker_batch:
              - *docs_excluded
              - 'server/**'
              - 'infra/docker/batch/**'
              - 'infra/docker/Taskfile.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            docker_core:
              - *docs_excluded
              - 'infra/docker/web/**'
              - 'infra/docker/api/**'
              - 'infra/docker/batch/**'
              - 'infra/docker/Taskfile.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'

      - name: Plan jobs
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          DOCKER_MODE_INPUT: ${{ inputs.docker_mode }}
          FILTER_CHECK: ${{ steps.filter.outputs.check }}
          FILTER_LINT_GO: ${{ steps.filter.outputs.lint_go }}
          FILTER_TEST_GO: ${{ steps.filter.outputs.test_go }}
          FILTER_TEST_TS: ${{ steps.filter.outputs.test_ts }}
          FILTER_TEST_DB_MIGRATIONS: ${{ steps.filter.outputs.test_db_migrations }}
          FILTER_TEST_MOBILE: ${{ steps.filter.outputs.test_mobile }}
          FILTER_TEST_E2E: ${{ steps.filter.outputs.test_e2e }}
          FILTER_TEST_BOOTSTRAP: ${{ steps.filter.outputs.test_bootstrap }}
          FILTER_BUILD: ${{ steps.filter.outputs.build }}
          FILTER_DOCKER_WEB: ${{ steps.filter.outputs.docker_web }}
          FILTER_DOCKER_API: ${{ steps.filter.outputs.docker_api }}
          FILTER_DOCKER_BATCH: ${{ steps.filter.outputs.docker_batch }}
          FILTER_DOCKER_CORE: ${{ steps.filter.outputs.docker_core }}
        run: bash scripts/ci-plan-jobs.sh

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubicloud-standard-2
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Setup / Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: server/go.sum

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup / pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup / Install sqlc
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      - name: Setup / Install buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}

      - name: Dependencies / Install
        run: task deps

      - name: Validate / sqlc Generated Diff
        run: sqlc diff

      - name: Build / Packages
        run: pnpm build --filter "./packages/*"

      - name: Build / Typegen
        run: pnpm typegen

      - name: Validate / Lint and Format
        run: pnpm check

      # packages/icons is the one place a raw <svg> could legitimately live.
      - name: Validate / No hand-written SVG in JSX
        run: |
          if git grep -n '<svg' -- '*.tsx' '*.jsx' ':!packages/icons/src/**'; then
            echo "::error::Use an icon from @publira/icons instead of writing <svg> in JSX. See apps/AGENTS.md."
            exit 1
          fi

      - name: Validate / Typecheck
        run: pnpm typecheck

  lint-go:
    name: Lint / Go
    needs: changes
    if: needs.changes.outputs.lint_go == 'true'
    runs-on: ubicloud-standard-2
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: server/go.sum

      # The action installs the pinned binary and caches the analysis results;
      # the rule set itself lives in server/.golangci.yml, so this runs exactly
      # what `task server:lint` runs locally.
      - name: Validate / golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: server

  test-go:
    name: Test / Go
    needs: changes
    if: needs.changes.outputs.test_go == 'true'
    runs-on: ubicloud-standard-2
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: server/go.sum

      - name: Validate / Go Tests
        working-directory: server
        run: go test ./...

  test-db-migrations:
    name: Test / DB Migrations
    needs: changes
    if: needs.changes.outputs.test_db_migrations == 'true'
    runs-on: ubicloud-standard-2
    services:
      postgres:
        image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: publira
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d publira" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Install migrate
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) migrate_arch="amd64" ;;
            arm64) migrate_arch="arm64" ;;
            *) echo "Unsupported architecture: $arch"; exit 1 ;;
          esac
          archive="migrate.linux-${migrate_arch}.tar.gz"
          curl -fsSL "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/${archive}" -o "/tmp/${archive}"
          curl -fsSL "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/sha256sum.txt" -o /tmp/sha256sum.txt
          (cd /tmp && sha256sum -c --ignore-missing sha256sum.txt)
          tar -xzf "/tmp/${archive}" -C /tmp migrate
          sudo install -m 0755 /tmp/migrate /usr/local/bin/migrate
          rm -f "/tmp/${archive}" /tmp/sha256sum.txt /tmp/migrate

      - name: Validate / Migrate Up (empty DB)
        run: |
          migrate -path db/migrations -database "postgres://postgres:password@localhost:5432/publira?sslmode=disable" up

      - name: Validate / Migrate Down (round trip back to empty)
        run: |
          migrate -path db/migrations -database "postgres://postgres:password@localhost:5432/publira?sslmode=disable" down -all

      - name: Validate / Migrate Up (re-apply after down)
        run: |
          migrate -path db/migrations -database "postgres://postgres:password@localhost:5432/publira?sslmode=disable" up

  test-ts:
    name: Test / TypeScript
    needs: changes
    if: needs.changes.outputs.test_ts == 'true'
    runs-on: ubicloud-standard-2
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Setup / pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Dependencies / Install
        run: pnpm install

      - name: Build / Packages
        run: pnpm build --filter "./packages/*"

      - name: Validate / TypeScript Tests
        run: pnpm test

  test-mobile:
    name: Test / Mobile
    needs: changes
    if: needs.changes.outputs.test_mobile == 'true'
    runs-on: ubicloud-standard-2
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Flutter
        run: |
          set -euo pipefail
          flutter_root="${RUNNER_TEMP}/flutter"
          git clone \
            --depth 1 \
            --branch "${FLUTTER_VERSION}" \
            https://github.com/flutter/flutter.git \
            "${flutter_root}"
          echo "${flutter_root}/bin" >> "${GITHUB_PATH}"
          # Bootstrap Dart SDK / tooling for subsequent steps
          "${flutter_root}/bin/flutter" --version
          "${flutter_root}/bin/dart" --version

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Dependencies / Install
        run: task mobile:deps

      - name: Validate / Format, Analyze, and Tests
        run: task mobile:check

  test-e2e:
    name: Test / E2E
    needs: changes
    if: needs.changes.outputs.test_e2e == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Setup / Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: server/go.sum

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup / pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup / Install migrate
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) migrate_arch="amd64" ;;
            arm64) migrate_arch="arm64" ;;
            *) echo "Unsupported architecture: $arch"; exit 1 ;;
          esac
          archive="migrate.linux-${migrate_arch}.tar.gz"
          curl -fsSL "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/${archive}" -o "/tmp/${archive}"
          curl -fsSL "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/sha256sum.txt" -o /tmp/sha256sum.txt
          (cd /tmp && sha256sum -c --ignore-missing sha256sum.txt)
          tar -xzf "/tmp/${archive}" -C /tmp migrate
          sudo install -m 0755 /tmp/migrate /usr/local/bin/migrate
          rm -f "/tmp/${archive}" /tmp/sha256sum.txt /tmp/migrate

      - name: Dependencies / Install
        run: task deps

      - name: Cache / Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json', 'pnpm-lock.yaml') }}

      - name: Build + Readiness + Playwright
        # prepare (build + browsers) then full lifecycle. Always tears down
        # compose/apps (trap). Readiness failures print "readiness failed: …"
        # and never start Playwright.
        run: task e2e:run
        env:
          CI: true

      - name: Upload / E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/.run/logs/
          if-no-files-found: ignore

  test-bootstrap:
    name: Test / Bootstrap
    needs: changes
    if: needs.changes.outputs.test_bootstrap == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Setup / Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: server/go.sum

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup / pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup / Install migrate
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) migrate_arch="amd64" ;;
            arm64) migrate_arch="arm64" ;;
            *) echo "Unsupported architecture: $arch"; exit 1 ;;
          esac
          archive="migrate.linux-${migrate_arch}.tar.gz"
          curl -fsSL "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/${archive}" -o "/tmp/${archive}"
          curl -fsSL "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/sha256sum.txt" -o /tmp/sha256sum.txt
          (cd /tmp && sha256sum -c --ignore-missing sha256sum.txt)
          tar -xzf "/tmp/${archive}" -C /tmp migrate
          sudo install -m 0755 /tmp/migrate /usr/local/bin/migrate
          rm -f "/tmp/${archive}" /tmp/sha256sum.txt /tmp/migrate

      # Installs dependencies itself (`task setup`); no separate deps step.
      # Always tears the compose project and dev processes down (trap).
      - name: Bootstrap check
        run: task e2e:bootstrap
        env:
          CI: true

      - name: Upload / Bootstrap artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-artifacts
          path: e2e/bootstrap/.run/logs/
          if-no-files-found: ignore

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubicloud-standard-2
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Setup / Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: server/go.sum

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup / pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Dependencies / Install
        run: task deps

      - name: Build / Web
        run: pnpm build

      - name: Build / Server
        run: task server:build

  docker:
    name: Docker / ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.docker_any == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.docker_matrix) }}
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      # Use the default docker driver so `docker build -t …` loads into the local
      # image store (docker-container Buildx does not, and smoke needs docker run).
      - name: Build image
        env:
          DOCKER_TASK: ${{ matrix.task }}
          DOCKER_ARG: ${{ matrix.arg }}
          DOCKER_EXTRA: ${{ matrix.extra }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKER_EXTRA}" ]; then
            task "${DOCKER_TASK}" "${DOCKER_ARG}" "${DOCKER_EXTRA}"
          else
            task "${DOCKER_TASK}" "${DOCKER_ARG}"
          fi

      - name: Smoke / Web /healthz
        if: matrix.role == 'web'
        env:
          APP_NAME: ${{ matrix.target }}
          PORT: ${{ matrix.port }}
        run: task docker:smoke:web "APP_NAME=${APP_NAME}" "PORT=${PORT}"

  # Single required status check for the branch ruleset (shown as "CI / Summary").
  # Intermediate jobs may be skipped when their paths did not change.
  summary:
    name: Summary
    if: always()
    needs:
      - changes
      - check
      - lint-go
      - test-go
      - test-ts
      - test-db-migrations
      - test-mobile
      - test-e2e
      - test-bootstrap
      - build
      - docker
    runs-on: ubicloud-standard-2
    steps:
      - name: Aggregate results
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
          LINT_GO: ${{ needs.lint-go.result }}
          TEST_GO: ${{ needs.test-go.result }}
          TEST_TS: ${{ needs.test-ts.result }}
          TEST_DB_MIGRATIONS: ${{ needs.test-db-migrations.result }}
          TEST_MOBILE: ${{ needs.test-mobile.result }}
          TEST_E2E: ${{ needs.test-e2e.result }}
          TEST_BOOTSTRAP: ${{ needs.test-bootstrap.result }}
          BUILD: ${{ needs.build.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "Detect changes=${CHANGES}" \
            "Check=${CHECK}" \
            "Lint / Go=${LINT_GO}" \
            "Test / Go=${TEST_GO}" \
            "Test / TypeScript=${TEST_TS}" \
            "Test / DB Migrations=${TEST_DB_MIGRATIONS}" \
            "Test / Mobile=${TEST_MOBILE}" \
            "Test / E2E=${TEST_E2E}" \
            "Test / Bootstrap=${TEST_BOOTSTRAP}" \
            "Build=${BUILD}" \
            "Docker=${DOCKER}"
          do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "${name}: ${result}"
            case "${result}" in
              success|skipped)
                ;;
              *)
                echo "::error::Job failed: ${name} (${result})"
                failed=1
                ;;
            esac
          done
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "All jobs succeeded or were skipped."
