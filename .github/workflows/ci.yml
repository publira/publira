name: CI

env:
  # renovate: datasource=github-releases depName=go-task/task versioning=semver-coerced
  TASK_VERSION: 3.49.1
  # renovate: datasource=github-releases depName=sqlc-dev/sqlc versioning=semver-coerced
  SQLC_VERSION: 1.30.0
  # renovate: datasource=github-releases depName=bufbuild/buf versioning=semver-coerced
  BUF_VERSION: 1.67.0
  # renovate: datasource=github-releases depName=golang-migrate/migrate versioning=semver-coerced
  MIGRATE_VERSION: 4.19.1

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.3-alpine3.23@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: publira
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d publira"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup / Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.14.1

      - name: Setup / Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.2
          cache-dependency-path: server/go.sum

      - name: Install Task
        uses: go-task/setup-task@3be4020d41929789a01026e0e427a4321ce0ad44 # v2.0.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup / pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup / Install sqlc
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      - name: Setup / Install buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}

      - name: Setup / Install migrate
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) migrate_arch="amd64" ;;
            arm64) migrate_arch="arm64" ;;
            *) echo "Unsupported architecture: $arch"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/migrate.linux-${migrate_arch}.tar.gz" -o /tmp/migrate.tgz
          tar -xzf /tmp/migrate.tgz -C /tmp migrate
          sudo install -m 0755 /tmp/migrate /usr/local/bin/migrate
          rm -f /tmp/migrate /tmp/migrate.tgz

      - name: Dependencies / Install
        run: task deps

      - name: Validate / DB Migrations
        run: |
          migrate -path db/migrations -database "postgres://postgres:password@localhost:5432/publira?sslmode=disable" up

      - name: Validate / sqlc Generated Diff
        run: sqlc diff

      - name: Build / Packages
        run: pnpm build --filter "./packages/*"

      - name: Build / Typegen
        run: pnpm typegen

      - name: Validate / Lint and Format
        run: pnpm check

      - name: Validate / Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup / Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.14.1

      - name: Setup / Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.2
          cache-dependency-path: server/go.sum

      - name: Install Task
        uses: go-task/setup-task@3be4020d41929789a01026e0e427a4321ce0ad44 # v2.0.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup / pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Dependencies / Install
        run: task deps

      - name: Build / Packages
        run: pnpm build --filter "./packages/*"

      - name: Validate / Go Tests
        working-directory: server
        run: go test ./...

      - name: Validate / Node.js Tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup / Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.14.1

      - name: Setup / Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.2
          cache-dependency-path: server/go.sum

      - name: Install Task
        uses: go-task/setup-task@3be4020d41929789a01026e0e427a4321ce0ad44 # v2.0.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup / pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Dependencies / Install
        run: task deps

      - name: Build / Web
        run: pnpm build

      - name: Build / Server
        run: task server:build
