name: CI

env:
  # renovate: datasource=github-releases depName=go-task/task versioning=semver-coerced
  TASK_VERSION: 3.54.0
  # renovate: datasource=github-releases depName=sqlc-dev/sqlc versioning=semver-coerced
  SQLC_VERSION: 1.31.1
  # renovate: datasource=github-releases depName=bufbuild/buf versioning=semver-coerced
  BUF_VERSION: 1.73.0
  # renovate: datasource=github-releases depName=golang-migrate/migrate versioning=semver-coerced
  MIGRATE_VERSION: 4.20.1
  # renovate: datasource=github-releases depName=golangci/golangci-lint versioning=semver-coerced
  GOLANGCI_LINT_VERSION: 2.14.0
  # renovate: datasource=github-releases depName=wait4x/wait4x versioning=semver-coerced
  WAIT4X_VERSION: 3.7.2
  # renovate: datasource=flutter-version depName=flutter
  FLUTTER_VERSION: 3.47.6
  # Retry flags for every release download below, unquoted at each call site so
  # they split into separate arguments. A transient response from github.com is
  # not what the job downloading the archive is testing.
  CURL_RETRY_FLAGS: "--retry 5 --retry-delay 2 --retry-all-errors"

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    # Nightly Docker full matrix (UTC) — catches cross-service drift missed by path filters
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      docker_mode:
        description: "Docker images: verify = role representatives; full = all documented images"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - full

# Branch ruleset should require only the final job display name: "Summary"
# (see job `summary` below). Intermediate jobs may be skipped by path filters.
# The merge queue on `main` requires that same check on the merge group it
# builds, which is what the `merge_group` trigger above answers.

# Repo default is read-only GITHUB_TOKEN; paths-filter needs PR file list on pull_request.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      format: ${{ steps.plan.outputs.format }}
      check: ${{ steps.plan.outputs.check }}
      lint_go: ${{ steps.plan.outputs.lint_go }}
      test_go: ${{ steps.plan.outputs.test_go }}
      test_ts: ${{ steps.plan.outputs.test_ts }}
      test_bash: ${{ steps.plan.outputs.test_bash }}
      test_db_migrations: ${{ steps.plan.outputs.test_db_migrations }}
      test_mobile: ${{ steps.plan.outputs.test_mobile }}
      test_mobile_e2e: ${{ steps.plan.outputs.test_mobile_e2e }}
      test_mobile_ios: ${{ steps.plan.outputs.test_mobile_ios }}
      test_e2e: ${{ steps.plan.outputs.test_e2e }}
      test_e2e_search: ${{ steps.plan.outputs.test_e2e_search }}
      test_bootstrap: ${{ steps.plan.outputs.test_bootstrap }}
      test_routing: ${{ steps.plan.outputs.test_routing }}
      test_deploy: ${{ steps.plan.outputs.test_deploy }}
      build: ${{ steps.plan.outputs.build }}
      docker_any: ${{ steps.plan.outputs.docker_any }}
      docker_matrix: ${{ steps.plan.outputs.docker_matrix }}
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `push` and `merge_group` have no API file list, so paths-filter diffs
          # locally — `github.event.before`..HEAD for a push, `base_sha`..`head_sha`
          # for a merge group — and both endpoints must be present already, because
          # `persist-credentials: false` leaves no credentials for a fallback
          # `git fetch`. The other events need no history — `pull_request` uses the
          # API file list, and `schedule` / `workflow_dispatch` skip the filter step
          # entirely.
          # Keep `'0'` quoted: a bare 0 is falsy and the `&&`/`||` chain would yield 1.
          fetch-depth: ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && '0' || '1' }}
          persist-credentials: false

      - name: Path filter
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # 'some-with-excludes': a file matches a filter when it matches at least one
          # positive pattern and no negated one. The default 'some' would treat
          # '!**/*.md' as just another alternative and never exclude anything.
          # Applies to every filter below; all other patterns are positive, so their
          # behaviour is unchanged.
          predicate-quantifier: "some-with-excludes"
          filters: |
            # Documentation-only changes must not start any job. Referenced by
            # every filter via the YAML anchor so the list stays in one place; as a
            # filter of its own it is negation-only and therefore always false.
            docs_excluded: &docs_excluded
              - '!**/*.md'
            # Formatting is inexpensive and includes Markdown. It deliberately
            # does not use docs_excluded, unlike the heavier jobs below.
            format:
              - '**'
            check:
              - *docs_excluded
              - 'apps/**'
              - 'locales/**'
              - 'packages/**'
              - 'e2e/**'
              - 'server/**'
              - 'db/**'
              - 'proto/**'
              - 'sqlc.yaml'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.jsonc'
              - 'oxlint.config.ts'
              - 'oxfmt.config.ts'
              - '.github/workflows/ci.yml'
              - '.gitattributes'
              - 'scripts/check-design-tokens.ts'
              - 'scripts/ci-plan-jobs.sh'
              - '.github/actions/go-setup/**'
            # The pages under docs/ are Markdown, which the check filter leaves
            # out, yet `Check` is where they are validated. A filter of its own,
            # without docs_excluded, starts that job for a change to them alone.
            check_docs:
              - 'docs/**'
              - 'scripts/check-docs.ts'
            # Narrower than test_go on purpose: golangci-lint only reads Go
            # sources and server/.golangci.yml, and `task gen` writes its output
            # under server/, so a db/ or proto/ edit cannot change the result
            # without also touching server/**.
            lint_go:
              - *docs_excluded
              - 'server/**'
              - 'scripts/check-go-mod-tidy.sh'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
              - '.github/actions/apt-install/**'
              - '.github/actions/go-setup/**'
            test_go:
              - *docs_excluded
              - 'server/**'
              - 'db/**'
              - 'proto/**'
              - 'sqlc.yaml'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
              - '.github/actions/apt-install/**'
              - '.github/actions/go-setup/**'
              - '.github/actions/go-build-cache-save/**'
            test_ts:
              - *docs_excluded
              - 'apps/**'
              - 'locales/**'
              - 'packages/**'
              # scripts/ is outside the pnpm workspace, so `pnpm test` cannot
              # reach it; this job runs its `node --test` suite as well.
              - 'scripts/*.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.jsonc'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            test_bash:
              - *docs_excluded
              - '**/*.sh'
              - 'scripts/dev-env.sh'
              - 'scripts/dev-env/**'
              - 'e2e/scripts/**'
              - 'Taskfile.yaml'
              - 'e2e/Taskfile.yaml'
              - 'mobile/Taskfile.yaml'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
              - '.github/actions/apt-install/**'
            test_db_migrations:
              - *docs_excluded
              - 'db/**'
              - 'sqlc.yaml'
              - 'scripts/check-migration-order.sh'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            test_mobile:
              - *docs_excluded
              - 'mobile/**'
              - 'Taskfile.yaml'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
              - 'scripts/setup-flutter.sh'
              - '.github/actions/mobile-android-setup/**'
            test_mobile_ios:
              - *docs_excluded
              - 'mobile/**'
              - 'Taskfile.yaml'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
              - 'scripts/setup-flutter.sh'
            test_mobile_e2e:
              - *docs_excluded
              - 'mobile/**'
              - 'e2e/compose.yaml'
              - 'e2e/scripts/db-setup.sh'
              - 'e2e/scripts/down.sh'
              - 'e2e/scripts/lib.sh'
              - 'e2e/scripts/server.sh'
              - 'e2e/scripts/stop-apps.sh'
              - 'e2e/scripts/up.sh'
              - 'e2e/scripts/upload-episode-pages.sh'
              - 'e2e/scripts/worker.sh'
              - 'scripts/storage-init.sh'
              # db-setup.sh uploads the images the seed's rows name, and the
              # reader this job drives draws them.
              - 'scripts/storage-seed.sh'
              - 'proto/publira/v1/catalog.proto'
              - 'proto/publira/v1/domain.proto'
              - 'server/**'
              - 'db/migrations/**'
              - 'db/seeds/**'
              - 'Taskfile.yaml'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
              - '.github/actions/apt-install/**'
              - '.github/actions/go-setup/**'
              - 'scripts/setup-flutter.sh'
              - '.github/actions/mobile-android-setup/**'
            test_e2e:
              - *docs_excluded
              - 'e2e/**'
              # Traefik routing has its own job; a probe-only change must
              # not start the Playwright suite.
              - '!e2e/routing/**'
              # The E2E edge mounts the same routers every environment runs.
              - 'infra/proxy/traefik/**'
              - 'apps/web-host/**'
              - 'apps/web-admin/**'
              - 'apps/web-platform/**'
              # The stack builds and runs email-renderer: the worker renders
              # every mail it delivers through it.
              - 'apps/email-renderer/**'
              - 'packages/**'
              - 'server/**'
              - 'db/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.jsonc'
              - 'Taskfile.yaml'
              - 'scripts/storage-init.sh'
              - 'scripts/storage-seed.sh'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
              - '.github/actions/apt-install/**'
              - '.github/actions/go-setup/**'
            # The OpenSearch backend and what it runs on, and nothing wider:
            # the rest of the stack is Test / E2E's, which runs the same spec
            # on the SQL backend.
            test_e2e_search:
              - *docs_excluded
              - 'server/internal/catalogsearch/**'
              - 'server/internal/catalogindex/**'
              - 'server/internal/outbox/catalog_index_sync.go'
              - 'server/api/publicapi/catalog_search_handlers.go'
              - 'server/internal/platformsearch/**'
              - 'server/cmd/publiractl/search.go'
              - 'db/query/catalog_index.sql'
              - 'db/query/platform_search.sql'
              - 'infra/docker/opensearch/**'
              - 'e2e/compose.yaml'
              - 'e2e/scripts/**'
              - 'e2e/Taskfile.yaml'
              - 'e2e/playwright.config.ts'
              - 'e2e/tests/catalog.search.spec.ts'
              - 'e2e/tests/platform.search-settings.spec.ts'
              # The Platform Console screen the settings spec drives.
              - 'apps/web-platform/app/(protected)/services/search/**'
              - 'apps/web-platform/lib/search-settings*.ts'
              # What the spec reads: its helpers and fixtures, and the seed
              # its OpenSearch-only cases search for, which the ordinary run
              # never asserts on because it registers those cases on
              # OpenSearch alone.
              - 'e2e/src/**'
              - 'db/seeds/**'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
              - '.github/actions/apt-install/**'
              - '.github/actions/go-setup/**'
            test_bootstrap:
              - *docs_excluded
              - 'compose.yaml'
              - 'db/**'
              - 'e2e/bootstrap/**'
              # task dev starts every app and server, so any of their sources
              # can break startup — Test / E2E covers web-host / web-admin /
              # web-platform and their APIs, not the full task dev surface.
              - 'apps/**'
              - 'packages/**'
              - 'server/**'
              - 'Taskfile.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.jsonc'
              - 'scripts/storage-init.sh'
              - 'scripts/storage-seed.sh'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
              - '.github/actions/apt-install/**'
              - '.github/actions/go-setup/**'
            test_routing:
              - *docs_excluded
              - 'compose.yaml'
              - '.devcontainer/**'
              - 'infra/proxy/**'
              - 'e2e/routing/**'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            test_deploy:
              - *docs_excluded
              - 'infra/deploy/**'
              # The deployment's edge mounts these routers unchanged.
              - 'infra/proxy/traefik/**'
              # The smoke runs the images these build.
              - 'infra/docker/**'
              - '.dockerignore'
              - 'scripts/check-deploy-compose.sh'
              - 'scripts/smoke-deploy-compose.sh'
              - 'Taskfile.yaml'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            build:
              - *docs_excluded
              - 'apps/**'
              - 'packages/**'
              - 'server/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.jsonc'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
              - '.github/actions/apt-install/**'
              - '.github/actions/go-setup/**'
              - '.github/actions/go-build-cache-save/**'
            docker_web:
              - *docs_excluded
              - 'apps/**'
              - 'packages/**'
              - 'locales/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.jsonc'
              - 'infra/docker/web/**'
              - 'infra/docker/Taskfile.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            docker_server:
              - *docs_excluded
              - 'server/**'
              - 'infra/docker/server/**'
              - 'infra/docker/Taskfile.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            docker_publiractl:
              - *docs_excluded
              - 'server/**'
              - 'infra/docker/publiractl/**'
              - 'db/migrations/**'
              - 'db/seeds/baseline/**'
              - 'infra/docker/Taskfile.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            docker_node:
              - *docs_excluded
              - 'apps/email-renderer/**'
              - 'packages/**'
              - 'locales/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.jsonc'
              - 'infra/docker/node/**'
              - 'infra/docker/Taskfile.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'
            docker_core:
              - *docs_excluded
              - 'infra/docker/web/**'
              - 'infra/docker/server/**'
              - 'infra/docker/publiractl/**'
              - 'infra/docker/node/**'
              - 'infra/docker/Taskfile.yaml'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - 'scripts/ci-plan-jobs.sh'

      - name: Plan jobs
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          DOCKER_MODE_INPUT: ${{ inputs.docker_mode }}
          FILTER_FORMAT: ${{ steps.filter.outputs.format }}
          FILTER_CHECK: ${{ steps.filter.outputs.check }}
          FILTER_CHECK_DOCS: ${{ steps.filter.outputs.check_docs }}
          FILTER_LINT_GO: ${{ steps.filter.outputs.lint_go }}
          FILTER_TEST_GO: ${{ steps.filter.outputs.test_go }}
          FILTER_TEST_TS: ${{ steps.filter.outputs.test_ts }}
          FILTER_TEST_BASH: ${{ steps.filter.outputs.test_bash }}
          FILTER_TEST_DB_MIGRATIONS: ${{ steps.filter.outputs.test_db_migrations }}
          FILTER_TEST_MOBILE: ${{ steps.filter.outputs.test_mobile }}
          FILTER_TEST_MOBILE_E2E: ${{ steps.filter.outputs.test_mobile_e2e }}
          FILTER_TEST_MOBILE_IOS: ${{ steps.filter.outputs.test_mobile_ios }}
          FILTER_TEST_E2E: ${{ steps.filter.outputs.test_e2e }}
          FILTER_TEST_E2E_SEARCH: ${{ steps.filter.outputs.test_e2e_search }}
          FILTER_TEST_BOOTSTRAP: ${{ steps.filter.outputs.test_bootstrap }}
          FILTER_TEST_ROUTING: ${{ steps.filter.outputs.test_routing }}
          FILTER_TEST_DEPLOY: ${{ steps.filter.outputs.test_deploy }}
          FILTER_BUILD: ${{ steps.filter.outputs.build }}
          FILTER_DOCKER_WEB: ${{ steps.filter.outputs.docker_web }}
          FILTER_DOCKER_SERVER: ${{ steps.filter.outputs.docker_server }}
          FILTER_DOCKER_PUBLIRACTL: ${{ steps.filter.outputs.docker_publiractl }}
          FILTER_DOCKER_NODE: ${{ steps.filter.outputs.docker_node }}
          FILTER_DOCKER_CORE: ${{ steps.filter.outputs.docker_core }}
        run: bash scripts/ci-plan-jobs.sh

  format:
    name: Lint and Format
    needs: changes
    if: needs.changes.outputs.format == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0

      - name: Validate / Lint and Format
        run: pnpm check

      # Here rather than in Check, whose path filter leaves out mobile/: the
      # matrix is held both to web-host and to the app, and this job runs for
      # a change to either.
      - name: Validate / Reader parity
        run: pnpm reader-parity:check

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Go
        id: go
        uses: ./.github/actions/go-setup

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup / pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          # Dependencies are installed by `task deps`, which also runs
          # `task server:deps`. Keep a single install path per job.
          install: false

      - name: Setup / Install sqlc
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      - name: Setup / Install buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}

      - name: Dependencies / Install
        run: task deps

      # Saved here, before anything can fail the job: `go mod tidy` has just
      # downloaded every module a package or a test imports, on every platform.
      - name: Cache / Save Go modules
        if: steps.go.outputs.module-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.module-cache-path }}
          key: ${{ steps.go.outputs.module-cache-key }}

      - name: Validate / Locale Catalog
        run: pnpm locales:check

      - name: Validate / sqlc Generated Diff
        run: sqlc diff

      # buf has no `diff` subcommand, so regenerate and compare against the
      # committed tree. This is the same `buf generate` that `task gen` runs —
      # `clean: true` lives in buf.gen.yaml so the recovery command below really
      # does reproduce this result. Staging before the comparison keeps additions
      # and deletions in the same diff as modifications — `git diff` alone would
      # miss an untracked new file.
      - name: Validate / buf Generated Diff
        run: |
          buf generate
          git add -A -- server/internal/proto/gen packages/api-client/src/gen
          if ! git diff --cached --exit-code -- server/internal/proto/gen packages/api-client/src/gen; then
            echo "::error::Generated protobuf code is out of date. Run \`task gen\` and commit the result."
            exit 1
          fi

      # packages/icons is where a raw <svg> normally lives. `qr-code.tsx` is the
      # documented exception: it draws a generated image rather than an icon —
      # the geometry is computed from the text it encodes, and the fixed
      # black-on-white palette is what makes the code scannable — so nothing in
      # @publira/icons could stand in for it. See apps/AGENTS.md "Icons".
      - name: Validate / No hand-written SVG in JSX
        run: |
          if git grep -n '<svg' -- '*.tsx' '*.jsx' ':!packages/icons/src/**' ':!packages/ui-components/src/qr-code/qr-code.tsx'; then
            echo "::error::Use an icon from @publira/icons instead of writing <svg> in JSX. See apps/AGENTS.md."
            exit 1
          fi

      - name: Validate / Design tokens
        run: node scripts/check-design-tokens.ts

      - name: Validate / Docs
        run: node scripts/check-docs.ts

      - name: Validate / Typecheck
        run: pnpm typecheck

  lint-go:
    name: Lint / Go
    needs: changes
    if: needs.changes.outputs.lint_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Go
        uses: ./.github/actions/go-setup

      # scripts/check-go-mod-tidy.sh carries the reasoning; run it locally
      # before pushing a dependency change.
      - name: Validate / go mod tidy
        run: scripts/check-go-mod-tidy.sh

      - name: Setup / libvips
        uses: ./.github/actions/apt-install
        with:
          packages: libvips-dev pkg-config

      # The action installs the pinned binary and caches the analysis results;
      # the rule set itself lives in server/.golangci.yml, so this runs exactly
      # what `task server:lint` runs locally.
      - name: Validate / golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: server

  test-go:
    name: Test / Go
    needs: changes
    if: needs.changes.outputs.test_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Go
        id: go
        uses: ./.github/actions/go-setup
        with:
          build-cache: test

      - name: Setup / libvips
        uses: ./.github/actions/apt-install
        with:
          packages: libvips-dev pkg-config

      # `-count=1` because the build cache this job saves would otherwise
      # carry the results too, and a later run would report a package that
      # passed on `main` without running its tests.
      - name: Validate / Go Tests
        working-directory: server
        run: go test -count=1 ./...

      - name: Cache / Save Go build
        if: github.ref == 'refs/heads/main' && steps.go.outputs.build-cache-hit != 'true'
        uses: ./.github/actions/go-build-cache-save
        with:
          path: ${{ steps.go.outputs.build-cache-path }}
          key: ${{ steps.go.outputs.build-cache-key }}

  test-db-migrations:
    name: Test / DB Migrations
    needs: changes
    if: needs.changes.outputs.test_db_migrations == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: publira
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d publira" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The append-only guard below diffs against origin/main, so it needs the
          # remote-tracking branch and a merge base. `persist-credentials: false`
          # leaves no credentials for a fallback `git fetch`.
          fetch-depth: 0
          persist-credentials: false

      # An applied migration is immutable: golang-migrate never re-runs a version a
      # database already recorded, so an edit reaches only databases built later.
      # On `push` to main, origin/main and HEAD are the same commit and the diff is
      # empty. See db/AGENTS.md.
      - name: Validate / Migrations Are Append-Only
        run: |
          set -euo pipefail
          violations="$(git diff --name-status --find-renames origin/main...HEAD -- db/migrations/ | grep -v "^A$(printf '\t')" || true)"
          if [ -n "$violations" ]; then
            echo "::error::db/migrations/ is append-only. Stack a new migration instead of editing, renaming, or deleting one."
            echo "$violations"
            exit 1
          fi

      # scripts/check-migration-order.sh carries the reasoning; run it locally
      # before pushing. On `push` to main, origin/main and HEAD are the same
      # commit and the branch adds nothing.
      - name: Validate / Migrations Sort Above main
        run: scripts/check-migration-order.sh

      - name: Setup / Install migrate
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) migrate_arch="amd64" ;;
            arm64) migrate_arch="arm64" ;;
            *) echo "Unsupported architecture: $arch"; exit 1 ;;
          esac
          archive="migrate.linux-${migrate_arch}.tar.gz"
          curl -fsSL ${CURL_RETRY_FLAGS} "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/${archive}" -o "/tmp/${archive}"
          curl -fsSL ${CURL_RETRY_FLAGS} "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/sha256sum.txt" -o /tmp/sha256sum.txt
          (cd /tmp && sha256sum -c --ignore-missing sha256sum.txt)
          tar -xzf "/tmp/${archive}" -C /tmp migrate
          sudo install -m 0755 /tmp/migrate /usr/local/bin/migrate
          rm -f "/tmp/${archive}" /tmp/sha256sum.txt /tmp/migrate

      - name: Validate / Migrate Up (empty DB)
        run: |
          migrate -path db/migrations -database "postgres://postgres:password@localhost:5432/publira?sslmode=disable" up

      - name: Validate / Migrate Down (round trip back to empty)
        run: |
          migrate -path db/migrations -database "postgres://postgres:password@localhost:5432/publira?sslmode=disable" down -all

      - name: Validate / Migrate Up (re-apply after down)
        run: |
          migrate -path db/migrations -database "postgres://postgres:password@localhost:5432/publira?sslmode=disable" up

  test-ts:
    name: Test / TypeScript
    needs: changes
    if: needs.changes.outputs.test_ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0

      - name: Validate / TypeScript Tests
        run: pnpm test

      - name: Validate / Script Tests
        run: pnpm test:scripts

  test-bash:
    name: Test / Bash
    needs: changes
    if: needs.changes.outputs.test_bash == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Install / Bash Tools
        uses: ./.github/actions/apt-install
        with:
          packages: shellcheck shfmt

      - name: Validate / Bash Style
        run: |
          shellcheck --external-sources --source-path=SCRIPTDIR --severity=warning $(git ls-files '*.sh')
          shfmt -i 2 -ci -sr -d $(git ls-files '*.sh')

      - name: Validate / Bash Library Tests
        run: |
          task dev-env:test
          task e2e:test-lib
          task mobile:test-device-ports

  test-mobile:
    name: Test / Mobile
    needs: changes
    if: needs.changes.outputs.test_mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Flutter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/setup-flutter.sh

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Dependencies / Install
        run: task mobile:deps

      - name: Validate / Format, Analyze, and Tests
        run: task mobile:check

  # A tenant's production build from the example manifest, through the command
  # a tenant runs, signed with a throwaway upload key. A job of its own, beside
  # the integration tests rather than after them: nothing in it reads what they
  # run, and nothing outside mobile/ goes into it.
  test-mobile-android:
    name: Test / Mobile Android
    needs: changes
    if: needs.changes.outputs.test_mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Android build
        uses: ./.github/actions/mobile-android-setup

      - name: Build / Tenant Android app
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "${PUBLIRA_ANDROID_KEYSTORE}" \
            -storepass "${PUBLIRA_ANDROID_KEYSTORE_PASSWORD}" -keypass "${PUBLIRA_ANDROID_KEY_PASSWORD}" \
            -alias "${PUBLIRA_ANDROID_KEY_ALIAS}" -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Example Reader"
          task mobile:build -- mobile/config/app.example.yaml apk
        env:
          PUBLIRA_BASE_URL: https://reader.example.com
          PUBLIRA_ANDROID_KEYSTORE: ${{ runner.temp }}/upload.jks
          PUBLIRA_ANDROID_KEYSTORE_PASSWORD: throwaway
          PUBLIRA_ANDROID_KEY_ALIAS: upload
          PUBLIRA_ANDROID_KEY_PASSWORD: throwaway

  # The integration tests run in two jobs, each on an emulator and a runner of
  # its own. This one runs every group that answers itself on the device — the
  # Connect fixture server, the keychain, offline reading — and leaves the live
  # group skipped, so it needs no stack and waits for no build.
  test-mobile-e2e-device:
    name: Test / Mobile E2E (device)
    needs: changes
    if: needs.changes.outputs.test_mobile_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUBLIRA_E2E_RUN_DIR: ${{ github.workspace }}/mobile/.run
      CI: true
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Android build
        id: setup
        uses: ./.github/actions/mobile-android-setup

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup / Android emulator packages
        id: emulator-packages
        run: bash mobile/scripts/emulator-packages.sh

      - name: Validate / Mobile E2E
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.emulator-packages.outputs.api-level }}
          target: ${{ steps.emulator-packages.outputs.target }}
          arch: ${{ steps.emulator-packages.outputs.arch }}
          profile: pixel_6
          disable-animations: true
          script: task mobile:test-integration
        env:
          PUBLIRA_LIVE_API: "false"

      # Saved by the job that builds the app the way both integration-test jobs
      # do: what a debug build transforms is most of what the cache saves them.
      # `restore-keys` carries the previous entry's distributions into this job,
      # so drop every one the wrapper no longer names before the cache is saved.
      - name: Cache / Prune Gradle distributions
        if: steps.setup.outputs.gradle-cache-hit != 'true'
        run: |
          set -euo pipefail
          url="$(sed -n 's/^distributionUrl=//p' mobile/android/gradle/wrapper/gradle-wrapper.properties)"
          find ~/.gradle/wrapper/dists -mindepth 1 -maxdepth 1 -type d ! -name "$(basename "${url}" .zip)" -print -exec rm -rf {} +

      - name: Cache / Save Gradle
        if: steps.setup.outputs.gradle-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: ${{ steps.setup.outputs.gradle-cache-key }}

      - name: Upload / Mobile E2E artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-e2e-artifacts-device
          path: |
            mobile/.run/artifacts/
            mobile/.run/logs/
          if-no-files-found: ignore

  # The binaries the live group's stack runs, built once from the commit under
  # test.
  test-mobile-e2e-build:
    name: Test / Mobile E2E Build
    needs: changes
    if: needs.changes.outputs.test_mobile_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Go
        uses: ./.github/actions/go-setup
        with:
          build-cache: build

      - name: Setup / libvips
        uses: ./.github/actions/apt-install
        with:
          packages: libvips-dev pkg-config

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Build / Server
        run: task server:build

      # A tar rather than the directory itself: an artifact does not keep the
      # executable bit.
      - name: Package / Server
        run: tar -czf "${RUNNER_TEMP}/mobile-e2e-build.tgz" server/bin

      - name: Upload / Server
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-e2e-build
          path: ${{ runner.temp }}/mobile-e2e-build.tgz
          compression-level: 0
          retention-days: 1

  # The live group alone, against the public API, the worker, and the seed, on
  # a stack of only the containers it reads. It waits for the build, which is
  # what leaves it the longest of the mobile jobs.
  test-mobile-e2e-live:
    name: Test / Mobile E2E (live)
    needs: test-mobile-e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: publira-mobile-e2e
      PUBLIRA_E2E_RUN_DIR: ${{ github.workspace }}/mobile/.run
      CI: true
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Android build
        uses: ./.github/actions/mobile-android-setup

      # libvips-tools for the libvips the server links: it depends on the
      # library under whatever name the release gives it.
      - name: Setup / Stack packages
        uses: ./.github/actions/apt-install
        with:
          packages: libvips-tools postgresql-client

      - name: Setup / Install migrate
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) migrate_arch="amd64" ;;
            arm64) migrate_arch="arm64" ;;
            *) echo "Unsupported architecture: $arch"; exit 1 ;;
          esac
          archive="migrate.linux-${migrate_arch}.tar.gz"
          curl -fsSL ${CURL_RETRY_FLAGS} "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/${archive}" -o "/tmp/${archive}"
          curl -fsSL ${CURL_RETRY_FLAGS} "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/sha256sum.txt" -o /tmp/sha256sum.txt
          (cd /tmp && sha256sum -c --ignore-missing sha256sum.txt)
          tar -xzf "/tmp/${archive}" -C /tmp migrate
          sudo install -m 0755 /tmp/migrate /usr/local/bin/migrate
          rm -f "/tmp/${archive}" /tmp/sha256sum.txt /tmp/migrate

      - name: Download / Server
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mobile-e2e-build
          path: ${{ runner.temp }}

      - name: Start / Server stack
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/mobile-e2e-build.tgz"
          bash mobile/scripts/e2e-up.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup / Android emulator packages
        id: emulator-packages
        run: bash mobile/scripts/emulator-packages.sh

      - name: Validate / Mobile E2E
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.emulator-packages.outputs.api-level }}
          target: ${{ steps.emulator-packages.outputs.target }}
          arch: ${{ steps.emulator-packages.outputs.arch }}
          profile: pixel_6
          disable-animations: true
          script: task mobile:test-integration -- --plain-name 'live public API'
        env:
          PUBLIRA_LIVE_API: "true"

      - name: Teardown / Server stack
        if: always()
        run: |
          bash e2e/scripts/worker.sh stop || true
          bash e2e/scripts/server.sh stop || true
          bash e2e/scripts/down.sh || true

      - name: Upload / Mobile E2E artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-e2e-artifacts-live
          path: |
            mobile/.run/artifacts/
            mobile/.run/logs/
          if-no-files-found: ignore

  test-mobile-ios:
    name: Test / Mobile iOS
    needs: changes
    if: needs.changes.outputs.test_mobile_ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Flutter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/setup-flutter.sh

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Dependencies / Install
        run: task mobile:deps

      - name: Validate / iOS builds
        run: task mobile:test-ios-build

      # What a build left changed in the tree is what has to be committed or
      # ignored, and the runner is the only place it can be read.
      - name: Diagnose / Working tree
        if: failure()
        run: git add --intent-to-add --all && git status --short && git diff

  test-e2e-build:
    name: Test / E2E Build
    needs: changes
    if: needs.changes.outputs.test_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Go
        uses: ./.github/actions/go-setup
        with:
          build-cache: build

      - name: Setup / libvips
        uses: ./.github/actions/apt-install
        with:
          packages: libvips-dev pkg-config

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup / pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          # Dependencies are installed by `task deps`, which also runs
          # `task server:deps`. Keep a single install path per job.
          install: false

      - name: Dependencies / Install
        run: task deps

      - name: Build
        run: task e2e:build

      # A tar rather than the directories themselves: the standalone output
      # of a pnpm workspace is full of symlinks, which an artifact does not
      # keep. Besides the binaries and the apps, every workspace package's
      # `dist/`, which the apps' standalone output and the suite itself
      # (`@publira/web-session`) import and `pnpm install` does not build.
      - name: Package / E2E build
        run: |
          set -euo pipefail
          tar -czf "${RUNNER_TEMP}/e2e-build.tgz" \
            server/bin \
            apps/web-host/.next/standalone apps/web-host/.next/static \
            apps/web-admin/.next/standalone apps/web-admin/.next/static \
            apps/web-platform/.next/standalone apps/web-platform/.next/static \
            apps/email-renderer/dist \
            packages/*/dist

      - name: Upload / E2E build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build
          path: ${{ runner.temp }}/e2e-build.tgz
          compression-level: 0
          retention-days: 1

  test-e2e:
    name: Test / E2E (${{ matrix.group }} ${{ matrix.shard }})
    needs: test-e2e-build
    runs-on: ubuntu-latest
    # Matches the other long jobs: a slow package mirror alone once ran a
    # passing run out of a 30-minute limit.
    timeout-minutes: 45
    # One runner and one stack per entry: a group is a set of Playwright
    # projects that may share a stack (`e2e/playwright.config.ts`), and the
    # ordering one needs never reaches another's stack. Every entry starts
    # from what Test / E2E Build built once.
    #
    # `main` and `admin` are sharded. Their files already run beside each
    # other on one stack, so a subset of them on a fresh stack is no less
    # isolated; the other groups order their projects or measure the machine.
    # Playwright splits by test count rather than duration, which is why
    # web-admin, whose tests are the slow ones, is a group apart. By the
    # per-file durations of a run that sharded the two together three ways
    # (44 minutes of tests across the three; 7.2 minutes of wall clock in the
    # slowest, which held 18), `main` in two shards holds at most 8.4 minutes
    # of tests and `admin` in three at most 11.1, while a fourth `admin`
    # shard would end below `exclusive`, the next longest entry.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: screenshots, group: screenshots, shard: 1/1 }
          - { id: main-1, group: main, shard: 1/2 }
          - { id: main-2, group: main, shard: 2/2 }
          - { id: admin-1, group: admin, shard: 1/3 }
          - { id: admin-2, group: admin, shard: 2/3 }
          - { id: admin-3, group: admin, shard: 3/3 }
          - { id: exclusive, group: exclusive, shard: 1/1 }
          - { id: performance, group: performance, shard: 1/1 }
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Go
        uses: ./.github/actions/go-setup

      - name: Setup / libvips
        uses: ./.github/actions/apt-install
        with:
          packages: libvips-dev pkg-config

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup / pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          # Dependencies are installed by `task deps`, which also runs
          # `task server:deps`. Keep a single install path per job.
          install: false

      - name: Setup / Install migrate
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) migrate_arch="amd64" ;;
            arm64) migrate_arch="arm64" ;;
            *) echo "Unsupported architecture: $arch"; exit 1 ;;
          esac
          archive="migrate.linux-${migrate_arch}.tar.gz"
          curl -fsSL ${CURL_RETRY_FLAGS} "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/${archive}" -o "/tmp/${archive}"
          curl -fsSL ${CURL_RETRY_FLAGS} "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/sha256sum.txt" -o /tmp/sha256sum.txt
          (cd /tmp && sha256sum -c --ignore-missing sha256sum.txt)
          tar -xzf "/tmp/${archive}" -C /tmp migrate
          sudo install -m 0755 /tmp/migrate /usr/local/bin/migrate
          rm -f "/tmp/${archive}" /tmp/sha256sum.txt /tmp/migrate

      - name: Setup / Install wait4x
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) wait4x_arch="amd64" ;;
            arm64) wait4x_arch="arm64" ;;
            *) echo "Unsupported architecture: $arch"; exit 1 ;;
          esac
          archive="wait4x-linux-${wait4x_arch}.tar.gz"
          curl -fsSL ${CURL_RETRY_FLAGS} "https://github.com/wait4x/wait4x/releases/download/v${WAIT4X_VERSION}/${archive}" -o "/tmp/${archive}"
          curl -fsSL ${CURL_RETRY_FLAGS} "https://github.com/wait4x/wait4x/releases/download/v${WAIT4X_VERSION}/${archive}.sha256sum" -o "/tmp/${archive}.sha256sum"
          (cd /tmp && sha256sum -c "${archive}.sha256sum")
          tar -xzf "/tmp/${archive}" -C /tmp wait4x
          sudo install -m 0755 /tmp/wait4x /usr/local/bin/wait4x
          rm -f "/tmp/${archive}" "/tmp/${archive}.sha256sum" /tmp/wait4x

      - name: Dependencies / Install
        run: task deps

      - name: Cache / Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json', 'pnpm-lock.yaml') }}

      - name: Download / E2E build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build
          path: ${{ runner.temp }}

      - name: Unpack / E2E build
        run: tar -xzf "${RUNNER_TEMP}/e2e-build.tgz"

      - name: Readiness + Playwright
        # Browsers, then the full lifecycle on the downloaded build. Always
        # tears down compose/apps (trap). Readiness failures print
        # "readiness failed: …" and never start Playwright.
        run: task e2e:run-built -- --shard=${{ matrix.shard }}
        env:
          CI: true
          PUBLIRA_E2E_GROUP: ${{ matrix.group }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.id }}.zip

      - name: Upload / E2E artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts-${{ matrix.id }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/.run/logs/
          if-no-files-found: ignore

      # On success too: the report job merges every entry's blob, and an entry
      # that passed cannot tell whether another one failed.
      - name: Upload / E2E blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-blob-${{ matrix.id }}
          path: e2e/blob-report/
          if-no-files-found: ignore
          retention-days: 7

  test-e2e-report:
    name: Test / E2E Report
    needs: test-e2e
    # Only when an entry failed. Each entry's own artifact already carries its
    # HTML report; this one is every entry's tests in one report.
    if: failure() && needs.test-e2e.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0

      - name: Download / E2E blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-*
          path: e2e/blob-reports
          merge-multiple: true

      - name: Merge / E2E reports
        run: pnpm --dir e2e exec playwright merge-reports --reporter html blob-reports

      - name: Upload / E2E report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: e2e/playwright-report/

  test-e2e-search:
    name: Test / E2E Search
    needs: changes
    if: needs.changes.outputs.test_e2e_search == 'true'
    runs-on: ubuntu-latest
    # One spec on the OpenSearch backend; the build and the image pulls are
    # most of the run.
    timeout-minutes: 30
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Go
        uses: ./.github/actions/go-setup
        with:
          build-cache: build

      - name: Setup / libvips
        uses: ./.github/actions/apt-install
        with:
          packages: libvips-dev pkg-config

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup / pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          # Dependencies are installed by `task deps`, which also runs
          # `task server:deps`. Keep a single install path per job.
          install: false

      - name: Setup / Install migrate
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) migrate_arch="amd64" ;;
            arm64) migrate_arch="arm64" ;;
            *) echo "Unsupported architecture: $arch"; exit 1 ;;
          esac
          archive="migrate.linux-${migrate_arch}.tar.gz"
          curl -fsSL ${CURL_RETRY_FLAGS} "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/${archive}" -o "/tmp/${archive}"
          curl -fsSL ${CURL_RETRY_FLAGS} "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/sha256sum.txt" -o /tmp/sha256sum.txt
          (cd /tmp && sha256sum -c --ignore-missing sha256sum.txt)
          tar -xzf "/tmp/${archive}" -C /tmp migrate
          sudo install -m 0755 /tmp/migrate /usr/local/bin/migrate
          rm -f "/tmp/${archive}" /tmp/sha256sum.txt /tmp/migrate

      - name: Setup / Install wait4x
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) wait4x_arch="amd64" ;;
            arm64) wait4x_arch="arm64" ;;
            *) echo "Unsupported architecture: $arch"; exit 1 ;;
          esac
          archive="wait4x-linux-${wait4x_arch}.tar.gz"
          curl -fsSL ${CURL_RETRY_FLAGS} "https://github.com/wait4x/wait4x/releases/download/v${WAIT4X_VERSION}/${archive}" -o "/tmp/${archive}"
          curl -fsSL ${CURL_RETRY_FLAGS} "https://github.com/wait4x/wait4x/releases/download/v${WAIT4X_VERSION}/${archive}.sha256sum" -o "/tmp/${archive}.sha256sum"
          (cd /tmp && sha256sum -c "${archive}.sha256sum")
          tar -xzf "/tmp/${archive}" -C /tmp wait4x
          sudo install -m 0755 /tmp/wait4x /usr/local/bin/wait4x
          rm -f "/tmp/${archive}" "/tmp/${archive}.sha256sum" /tmp/wait4x

      - name: Dependencies / Install
        run: task deps

      - name: Cache / Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json', 'pnpm-lock.yaml') }}

      - name: Build + Readiness + Playwright
        # The same lifecycle as Test / E2E, with the engine in the compose
        # stack and the server and the worker on it, running the catalog
        # search and search settings specs alone.
        run: task e2e:search
        env:
          CI: true

      - name: Upload / E2E artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-search-artifacts
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/.run/logs/
          if-no-files-found: ignore

  test-bootstrap:
    name: Test / Bootstrap
    needs: changes
    if: needs.changes.outputs.test_bootstrap == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Go
        uses: ./.github/actions/go-setup
        with:
          build-cache: build

      - name: Setup / libvips
        uses: ./.github/actions/apt-install
        with:
          packages: libvips-dev pkg-config

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup / pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          # Dependencies are installed by `task deps`, which also runs
          # `task server:deps`. Keep a single install path per job.
          install: false

      - name: Setup / Install migrate
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) migrate_arch="amd64" ;;
            arm64) migrate_arch="arm64" ;;
            *) echo "Unsupported architecture: $arch"; exit 1 ;;
          esac
          archive="migrate.linux-${migrate_arch}.tar.gz"
          curl -fsSL ${CURL_RETRY_FLAGS} "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/${archive}" -o "/tmp/${archive}"
          curl -fsSL ${CURL_RETRY_FLAGS} "https://github.com/golang-migrate/migrate/releases/download/v${MIGRATE_VERSION}/sha256sum.txt" -o /tmp/sha256sum.txt
          (cd /tmp && sha256sum -c --ignore-missing sha256sum.txt)
          tar -xzf "/tmp/${archive}" -C /tmp migrate
          sudo install -m 0755 /tmp/migrate /usr/local/bin/migrate
          rm -f "/tmp/${archive}" /tmp/sha256sum.txt /tmp/migrate

      - name: Setup / Install wait4x
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) wait4x_arch="amd64" ;;
            arm64) wait4x_arch="arm64" ;;
            *) echo "Unsupported architecture: $arch"; exit 1 ;;
          esac
          archive="wait4x-linux-${wait4x_arch}.tar.gz"
          curl -fsSL ${CURL_RETRY_FLAGS} "https://github.com/wait4x/wait4x/releases/download/v${WAIT4X_VERSION}/${archive}" -o "/tmp/${archive}"
          curl -fsSL ${CURL_RETRY_FLAGS} "https://github.com/wait4x/wait4x/releases/download/v${WAIT4X_VERSION}/${archive}.sha256sum" -o "/tmp/${archive}.sha256sum"
          (cd /tmp && sha256sum -c "${archive}.sha256sum")
          tar -xzf "/tmp/${archive}" -C /tmp wait4x
          sudo install -m 0755 /tmp/wait4x /usr/local/bin/wait4x
          rm -f "/tmp/${archive}" "/tmp/${archive}.sha256sum" /tmp/wait4x

      # Installs dependencies itself (`task setup`); no separate deps step.
      # Always tears the compose project and dev processes down (trap).
      - name: Bootstrap check
        run: task e2e:bootstrap
        env:
          CI: true

      - name: Upload / Bootstrap artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-artifacts
          path: e2e/bootstrap/.run/logs/
          if-no-files-found: ignore

  test-routing:
    name: Test / Routing
    needs: changes
    if: needs.changes.outputs.test_routing == 'true'
    runs-on: ubuntu-latest
    # Four of the probes are console page uploads spread over 75 seconds each.
    timeout-minutes: 20
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      # One stack per proxy under infra/proxy — Traefik, nginx, Caddy — each in
      # front of echo backends, no apps. Always tears the compose project down
      # (trap).
      - name: Routing check
        run: task e2e:routing
        env:
          CI: true

      - name: Upload / Routing artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: routing-artifacts
          path: e2e/routing/.run/
          # The path ends at a hidden segment, and the walk that resolves it
          # starts there: without this it stops on `.run` and uploads nothing.
          include-hidden-files: true
          if-no-files-found: ignore

  test-deploy:
    name: Test / Deploy
    needs: changes
    if: needs.changes.outputs.test_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Validate / Compose config
        run: task deploy:check

      # Every image the Compose file references, built into the local image
      # store under the names .env.example gives them.
      - name: Build / Images
        run: task docker:verify:full

      # Always tears the compose project and its volumes down (trap).
      - name: Smoke / Compose stack
        run: task deploy:smoke

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Go
        id: go
        uses: ./.github/actions/go-setup
        with:
          build-cache: build

      - name: Setup / libvips
        uses: ./.github/actions/apt-install
        with:
          packages: libvips-dev pkg-config

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Setup / pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          # Dependencies are installed by `task deps`, which also runs
          # `task server:deps`. Keep a single install path per job.
          install: false

      - name: Dependencies / Install
        run: task deps

      - name: Build / Web
        run: pnpm build

      - name: Build / Server
        run: task server:build

      # The entry every job that builds the server restores: this one builds
      # nothing else in Go and runs whenever server/ changes.
      - name: Cache / Save Go build
        if: github.ref == 'refs/heads/main' && steps.go.outputs.build-cache-hit != 'true'
        uses: ./.github/actions/go-build-cache-save
        with:
          path: ${{ steps.go.outputs.build-cache-path }}
          key: ${{ steps.go.outputs.build-cache-key }}

  # Every push to main that changes server/ saves one more build cache entry
  # of each kind, and `restore-keys` only ever reads the newest; the rest are
  # 150 MB (`build`) and 200 MB (`test`) each that would crowd the Gradle and
  # Playwright entries out of the repository's 10 GB. Keeping the newest by
  # creation time keeps the newest commit's, because a run that is no longer
  # main's tip does not save (`go-build-cache-save`). A job of its own, so the
  # jobs that run the tree's code never hold a token that can delete caches.
  prune-go-build-cache:
    name: Cache / Prune Go build
    needs: [build, test-go]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && (needs.build.result == 'success' || needs.test-go.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete superseded entries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for kind in build test; do
            gh cache list --ref refs/heads/main --key "go-build-${kind}-" \
              --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' |
              xargs -r -n 1 gh cache delete
          done

  docker:
    name: Docker / ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.docker_any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.docker_matrix) }}
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      # Use the default docker driver so `docker build -t …` loads into the local
      # image store (docker-container Buildx does not, and smoke needs docker run).
      - name: Build image
        env:
          DOCKER_TASK: ${{ matrix.task }}
          DOCKER_ARG: ${{ matrix.arg }}
          DOCKER_EXTRA: ${{ matrix.extra }}
        run: |
          set -euo pipefail
          # The server and publiractl roles take no build ARG, so an empty entry
          # must not reach task as an empty task name.
          args=()
          if [ -n "${DOCKER_ARG}" ]; then
            args+=("${DOCKER_ARG}")
          fi
          if [ -n "${DOCKER_EXTRA}" ]; then
            args+=("${DOCKER_EXTRA}")
          fi
          task "${DOCKER_TASK}" "${args[@]}"

      - name: Smoke / Web /healthz
        if: matrix.role == 'web'
        env:
          APP_NAME: ${{ matrix.target }}
          PORT: ${{ matrix.port }}
        run: task docker:smoke:web "APP_NAME=${APP_NAME}" "PORT=${PORT}"

      - name: Smoke / Node service /livez /readyz
        if: matrix.role == 'node'
        env:
          APP_NAME: ${{ matrix.target }}
          PORT: ${{ matrix.port }}
        run: task docker:smoke:node "APP_NAME=${APP_NAME}" "PORT=${PORT}"

      - name: Smoke / publiractl db migrate and db roles
        if: matrix.role == 'publiractl'
        run: task docker:smoke:publiractl

  # Single required status check for the branch ruleset (shown as "CI / Summary").
  # Intermediate jobs may be skipped when their paths did not change.
  summary:
    name: Summary
    if: always()
    needs:
      - changes
      - format
      - check
      - lint-go
      - test-go
      - test-ts
      - test-bash
      - test-db-migrations
      - test-mobile
      - test-mobile-android
      - test-mobile-e2e-device
      - test-mobile-e2e-build
      - test-mobile-e2e-live
      - test-mobile-ios
      - test-e2e-build
      - test-e2e
      - test-e2e-report
      - test-e2e-search
      - test-bootstrap
      - test-routing
      - test-deploy
      - build
      - prune-go-build-cache
      - docker
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        env:
          CHANGES: ${{ needs.changes.result }}
          FORMAT: ${{ needs.format.result }}
          CHECK: ${{ needs.check.result }}
          LINT_GO: ${{ needs.lint-go.result }}
          TEST_GO: ${{ needs.test-go.result }}
          TEST_TS: ${{ needs.test-ts.result }}
          TEST_BASH: ${{ needs.test-bash.result }}
          TEST_DB_MIGRATIONS: ${{ needs.test-db-migrations.result }}
          TEST_MOBILE: ${{ needs.test-mobile.result }}
          TEST_MOBILE_ANDROID: ${{ needs.test-mobile-android.result }}
          TEST_MOBILE_E2E_DEVICE: ${{ needs.test-mobile-e2e-device.result }}
          TEST_MOBILE_E2E_BUILD: ${{ needs.test-mobile-e2e-build.result }}
          TEST_MOBILE_E2E_LIVE: ${{ needs.test-mobile-e2e-live.result }}
          TEST_MOBILE_IOS: ${{ needs.test-mobile-ios.result }}
          TEST_E2E_BUILD: ${{ needs.test-e2e-build.result }}
          TEST_E2E: ${{ needs.test-e2e.result }}
          TEST_E2E_REPORT: ${{ needs.test-e2e-report.result }}
          TEST_E2E_SEARCH: ${{ needs.test-e2e-search.result }}
          TEST_BOOTSTRAP: ${{ needs.test-bootstrap.result }}
          TEST_ROUTING: ${{ needs.test-routing.result }}
          TEST_DEPLOY: ${{ needs.test-deploy.result }}
          BUILD: ${{ needs.build.result }}
          PRUNE_GO_BUILD_CACHE: ${{ needs.prune-go-build-cache.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "Detect changes=${CHANGES}" \
            "Lint and Format=${FORMAT}" \
            "Check=${CHECK}" \
            "Lint / Go=${LINT_GO}" \
            "Test / Go=${TEST_GO}" \
            "Test / TypeScript=${TEST_TS}" \
            "Test / Bash=${TEST_BASH}" \
            "Test / DB Migrations=${TEST_DB_MIGRATIONS}" \
            "Test / Mobile=${TEST_MOBILE}" \
            "Test / Mobile Android=${TEST_MOBILE_ANDROID}" \
            "Test / Mobile E2E (device)=${TEST_MOBILE_E2E_DEVICE}" \
            "Test / Mobile E2E Build=${TEST_MOBILE_E2E_BUILD}" \
            "Test / Mobile E2E (live)=${TEST_MOBILE_E2E_LIVE}" \
            "Test / Mobile iOS=${TEST_MOBILE_IOS}" \
            "Test / E2E Build=${TEST_E2E_BUILD}" \
            "Test / E2E=${TEST_E2E}" \
            "Test / E2E Report=${TEST_E2E_REPORT}" \
            "Test / E2E Search=${TEST_E2E_SEARCH}" \
            "Test / Bootstrap=${TEST_BOOTSTRAP}" \
            "Test / Routing=${TEST_ROUTING}" \
            "Test / Deploy=${TEST_DEPLOY}" \
            "Build=${BUILD}" \
            "Cache / Prune Go build=${PRUNE_GO_BUILD_CACHE}" \
            "Docker=${DOCKER}"
          do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "${name}: ${result}"
            case "${result}" in
              success|skipped)
                ;;
              *)
                echo "::error::Job failed: ${name} (${result})"
                failed=1
                ;;
            esac
          done
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "All jobs succeeded or were skipped."
