name: Review

# Marks the moments a pull request asks for review. A job that has to write to
# the pull request runs in `Review labels`, which `workflow_run` starts when
# this workflow completes: this one runs with the pull request's own token,
# which is read-only for a fork, so it holds no permissions and does nothing
# but succeed. `Review labels` follows this workflow by its name, so renaming
# it stops every job there.

on:
  pull_request:
    types: [opened, ready_for_review]

permissions: {}

jobs:
  requested:
    name: Review requested
    # An `opened` event for a draft is skipped, so a pull request opened as a
    # draft asks for review when it is marked ready and one opened ready asks
    # immediately. A push does not trigger it: what follows is a snapshot of
    # the moment review was requested, not of the latest push.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Record the pull request
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "#${NUMBER} asks for review at ${HEAD_SHA}"
