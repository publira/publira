name: Release images

# The images of a release, built from the tagged commit and pushed to
# ghcr.io/publira under its version, the Git tag without its `v`, and nothing
# else. An upgrade runs `db migrate` and `db roles` from the new release's
# publiractl before the processes move, so no reference may ever start pointing
# at a newer release by itself: there is no `latest` and no `1.2`.
#
# Release notes calls this before it publishes the Release, so the notes of a
# Release never name a tag that cannot be pulled yet.

on:
  workflow_call:
    inputs:
      version:
        description: The release's version, the Git tag without its `v`
        required: true
        type: string

permissions: {}

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy versioning=semver-coerced
  TRIVY_VERSION: 0.76.1
  REGISTRY: ghcr.io/publira
  SOURCE: ${{ github.server_url }}/${{ github.repository }}
  TAG: ${{ inputs.version }}

jobs:
  build:
    name: Build / ${{ matrix.image.name }} (${{ matrix.arch.name }})
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    # Every leg writes the same commit, so the output does not depend on which
    # leg finishes last.
    outputs:
      revision: ${{ steps.revision.outputs.commit }}
    strategy:
      matrix:
        # The names infra/deploy/compose.yaml composes as
        # ${PUBLIRA_IMAGE_REGISTRY}/<name>:${PUBLIRA_IMAGE_TAG}, built with the
        # arguments `task docker:verify:full` passes.
        image:
          - name: publira
            dockerfile: infra/docker/server/Dockerfile
            args: ""
            version: true
          - name: publiractl
            dockerfile: infra/docker/publiractl/Dockerfile
            args: ""
            version: true
          - name: web-storefront
            dockerfile: infra/docker/web/Dockerfile
            args: "APP_NAME=web-storefront PORT=3000"
            version: false
          - name: web-admin
            dockerfile: infra/docker/web/Dockerfile
            args: "APP_NAME=web-admin PORT=4000"
            version: false
          - name: web-platform
            dockerfile: infra/docker/web/Dockerfile
            args: "APP_NAME=web-platform PORT=4100"
            version: false
          - name: email-renderer
            dockerfile: infra/docker/node/Dockerfile
            args: "APP_NAME=email-renderer PORT=8080"
            version: false
        # The publira image links libvips through CGO, which its Dockerfile
        # does not cross-compile, so each architecture builds on a runner of
        # its own rather than under QEMU.
        arch:
          - name: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the commit
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      # A docker-container builder: the default docker driver cannot push an
      # image by its digest alone.
      - name: Setup / Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<< "${GH_TOKEN}"

      # Pushed by digest and untagged: the tag names the multi-architecture
      # index the publish job assembles, never a single architecture.
      - name: Build and push
        env:
          ARCH: ${{ matrix.arch.name }}
          BUILD_ARGS: ${{ matrix.image.args }}
          DIGESTS_PATH: ${{ runner.temp }}/digests
          DOCKERFILE: ${{ matrix.image.dockerfile }}
          IMAGE: ${{ matrix.image.name }}
          METADATA_PATH: ${{ runner.temp }}/metadata.json
          PLATFORM: ${{ matrix.arch.platform }}
          REVISION: ${{ steps.revision.outputs.commit }}
          VERSION_ARG: ${{ matrix.image.version }}
        run: |
          set -euo pipefail
          flags=()
          read -ra pairs <<< "${BUILD_ARGS}"
          for pair in "${pairs[@]}"; do
            flags+=(--build-arg "${pair}")
          done
          # The build context carries no .git, so the Go binaries report the
          # version linked in here as service.version, or `dev` without it.
          if [[ "${VERSION_ARG}" == "true" ]]; then
            flags+=(--build-arg "VERSION=${TAG}")
          fi
          # The image the final stage starts FROM, as the OCI base annotations
          # on the image's manifest, which is how the scan job tells the base
          # image's layers from the ones the Dockerfile adds. The last FROM of
          # every Dockerfile here names an image pinned by digest.
          base="$(awk 'toupper($1) == "FROM" { ref = ""; for (i = 2; i <= NF; i++) if ($i !~ /^--/) { ref = $i; break } } END { print ref }' "${DOCKERFILE}")"
          if [[ "${base}" != *@sha256:* ]]; then
            echo "::error file=${DOCKERFILE}::The last FROM names ${base:-nothing}, not an image pinned by digest."
            exit 1
          fi
          flags+=(
            --annotation "manifest:org.opencontainers.image.base.name=${base%@*}"
            --annotation "manifest:org.opencontainers.image.base.digest=${base#*@}"
          )
          # BuildKit writes the SBOM and the SLSA provenance of the image into
          # an attestation manifest beside it, which the index lists as an
          # `unknown/unknown` platform. The signature the publish job makes
          # over the index covers them, since the index names them by digest.
          docker buildx build \
            --file "${DOCKERFILE}" \
            --platform "${PLATFORM}" \
            "${flags[@]}" \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.version=${TAG}" \
            --label "org.opencontainers.image.revision=${REVISION}" \
            --provenance=mode=max,version=v1 \
            --sbom=true \
            --output "type=image,name=${REGISTRY}/${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "${METADATA_PATH}" \
            .
          mkdir -p "${DIGESTS_PATH}/${IMAGE}"
          jq -r '."containerimage.digest"' "${METADATA_PATH}" > "${DIGESTS_PATH}/${IMAGE}/${ARCH}"
          echo "${REGISTRY}/${IMAGE}@$(cat "${DIGESTS_PATH}/${IMAGE}/${ARCH}") (${PLATFORM})"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.arch.name }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error

  # Every image, for every architecture, before any of them is tagged: a
  # critical finding in the layers infra/docker/ adds holds the release, and
  # one in the base image's layers is reported in the job summary and passes.
  # scripts/image-vulns.ts judges the findings against
  # infra/docker/trivy-ignore.json.
  scan:
    name: Scan
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # The images are pushed but untagged, and a package the build just
      # created can still be private.
      packages: read
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup / Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Setup / Trivy
        uses: ./.github/actions/tool-install
        with:
          tool: trivy

      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Sign in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<< "${GH_TOKEN}"

      - name: Scan the images
        env:
          DIGESTS_PATH: ${{ runner.temp }}/digests
          SCAN_PATH: ${{ runner.temp }}/scan
        run: |
          set -euo pipefail
          for dir in "${DIGESTS_PATH}"/*; do
            image="${dir##*/}"
            for digest in "${dir}"/*; do
              arch="${digest##*/}"
              scripts/scan-image.sh "${REGISTRY}/${image}@$(cat "${digest}")" "${arch}" "${SCAN_PATH}/${image}/${arch}"
            done
          done

      - name: Judge the findings
        env:
          SCAN_PATH: ${{ runner.temp }}/scan
        run: node scripts/image-vulns.ts infra/docker/trivy-ignore.json "${SCAN_PATH}"

  publish:
    name: Publish
    needs: [build, scan]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # The OIDC token the keyless signature is issued for, which names this
      # workflow at the release's tag.
      id-token: write
      packages: write
    steps:
      # One directory per image, holding one file per architecture whose
      # content is that architecture's digest.
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Sign in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<< "${GH_TOKEN}"

      - name: Setup / cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # The index carries the source as an annotation as well as the label on
      # each image, because the index is what the registry reads to link a
      # multi-architecture package to the repository.
      - name: Tag the multi-architecture images
        env:
          DIGESTS_PATH: ${{ runner.temp }}/digests
          REVISION: ${{ needs.build.outputs.revision }}
        run: |
          set -euo pipefail
          cd "${DIGESTS_PATH}"
          for image in *; do
            refs=()
            for digest in "${image}"/*; do
              refs+=("${REGISTRY}/${image}@$(cat "${digest}")")
            done
            docker buildx imagetools create \
              --tag "${REGISTRY}/${image}:${TAG}" \
              --annotation "index:org.opencontainers.image.source=${SOURCE}" \
              --annotation "index:org.opencontainers.image.version=${TAG}" \
              --annotation "index:org.opencontainers.image.revision=${REVISION}" \
              "${refs[@]}"
          done

      # The index's digest, not its tag, so the signature covers exactly what
      # was just pushed. A keyless signature names the workflow that made it,
      # so `cosign verify` against this workflow at the release's tag passes
      # for these images and for nothing signed anywhere else.
      - name: Sign the multi-architecture images
        env:
          DIGESTS_PATH: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          cd "${DIGESTS_PATH}"
          for image in *; do
            digest="$(docker buildx imagetools inspect "${REGISTRY}/${image}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
            cosign sign --yes "${REGISTRY}/${image}@${digest}"
          done

      # Signed out, so each reference is read the way an operator's install
      # reads it. A package the organization creates private fails here, and
      # the Release is not published until it is made public. Each platform
      # has to carry its attestation manifest, and the index has to verify
      # against the identity docs/en/2-deployments/10-releases.md has an
      # operator check.
      - name: Check the images pull and verify without signing in
        env:
          DIGESTS_PATH: ${{ runner.temp }}/digests
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release-images.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          cd "${DIGESTS_PATH}"
          failed=0
          for image in *; do
            ref="${REGISTRY}/${image}:${TAG}"
            if ! index="$(docker buildx imagetools inspect --raw "${ref}")"; then
              echo "::error::${ref} cannot be read without signing in. Make the ${image} package public in its package settings, then re-run this job."
              failed=1
              continue
            fi
            platforms="$(jq -r '[.manifests[] | select(.annotations."vnd.docker.reference.type" != "attestation-manifest") | "\(.platform.os)/\(.platform.architecture)"] | sort | join(" ")' <<< "${index}")"
            unattested="$(jq -r '[.manifests[] | select(.annotations."vnd.docker.reference.type" == "attestation-manifest") | .annotations."vnd.docker.reference.digest"] as $attested
              | [.manifests[] | select(.annotations."vnd.docker.reference.type" != "attestation-manifest") | select(.digest | IN($attested[]) | not) | "\(.platform.os)/\(.platform.architecture)"] | join(" ")' <<< "${index}")"
            if [[ "${platforms}" != "linux/amd64 linux/arm64" ]]; then
              echo "::error::${ref} lists ${platforms:-no platform}, want linux/amd64 linux/arm64."
              failed=1
            elif [[ -n "${unattested}" ]]; then
              echo "::error::${ref} carries no SBOM or provenance for ${unattested}."
              failed=1
            elif ! cosign verify "${ref}" \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null; then
              echo "::error::${ref} does not verify against ${IDENTITY}."
              failed=1
            else
              echo "${ref}: ${platforms}, attested, signed by ${IDENTITY}"
            fi
          done
          exit "${failed}"
