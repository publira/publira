name: Disposable Domains Update

env:
  # Keep these pins equal to the ones in ci.yml.
  # renovate: datasource=github-releases depName=go-task/task versioning=semver-coerced
  TASK_VERSION: 3.54.0

on:
  schedule:
    # Weekly on Monday 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  update:
    name: Update the disposable email domain list
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Setup / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # create-pull-request configures its own credential from `token`.
          persist-credentials: false

      - name: Setup / Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: server/go.sum

      - name: Setup / Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}

      # The task runs the package's tests on the new snapshot, so a list the
      # server could not parse fails here instead of opening a pull request.
      - name: Update / Disposable email domains
        run: task server:update-disposable-domains

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(server): update the disposable email domain list"
          title: "chore(server): update the disposable email domain list"
          body: |
            ## Summary

            Automated refresh of the embedded disposable email domain list via `task server:update-disposable-domains`.

            ## Changes

            - Replaced `server/internal/disposabledomains/disposable_email_blocklist.conf` and its `LICENSE.txt` with the upstream copies

            ## How to Test

            - Review the license diff, if any, for a change that no longer permits bundling

            ## Checklist

            - [x] I used a Conventional Commits style PR title.
            - [ ] I tested my changes locally.
            - [ ] I updated docs if needed.
          branch: chore/disposable-domains-update
          delete-branch: true
          labels: area/server
          add-paths: |
            server/internal/disposabledomains/disposable_email_blocklist.conf
            server/internal/disposabledomains/LICENSE.txt
