name: Set up pnpm
description: Install pnpm and Node.js through pnpm/setup, and run it a second time when the first attempt fails.

inputs:
  install:
    description: Whether to run `pnpm install` once pnpm and Node.js are installed.
    default: "true"

runs:
  using: composite
  steps:
    # pnpm/setup makes a single attempt at each download, so a reset
    # connection to registry.npmjs.org, or a truncated download it then runs,
    # fails the job. A second attempt starts over from the registry.
    - name: Setup / pnpm
      id: first
      continue-on-error: true
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        install: ${{ inputs.install }}

    - name: Setup / pnpm (retry)
      if: steps.first.outcome == 'failure'
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        install: ${{ inputs.install }}
