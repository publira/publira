version: v2
modules:
  - path: proto
    name: buf.build/publira/publira
# `scripts/check-proto-compat.sh` holds proto/ to the newest release with these
# rules. The web apps and the server speak the Connect protocol's JSON, so
# WIRE_JSON is the category that matches what crosses the wire: a field renamed
# or retyped, or deleted without reserving its number and name, fails it. It
# lets a field's presence change, which reads an older client's empty value as
# "not sent", so FIELD_SAME_CARDINALITY is added for that. Deleting an RPC
# passes on purpose: one the release before no longer calls may go, and no rule
# can tell that apart from one it still calls.
breaking:
  use:
    - WIRE_JSON
    - FIELD_SAME_CARDINALITY
