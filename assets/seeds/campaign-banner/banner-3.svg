<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Seed campaign banner 3, scattered discs</title>

  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e1b4b" />
      <stop offset="1" stop-color="#4338ca" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#field)" />
  <g fill="#ffffff" opacity="0.16">
    <circle cx="180" cy="160" r="120" />
    <circle cx="1420" cy="200" r="160" />
    <circle cx="260" cy="740" r="180" />
    <circle cx="1340" cy="760" r="110" />
    <circle cx="560" cy="120" r="60" />
    <circle cx="1080" cy="820" r="70" />
  </g>

  <!-- The panel a campaign's own lettering would sit on. -->
  <rect x="440" y="280" width="720" height="340" rx="8" fill="#facc15" />
  <g fill="#1e1b4b">
    <rect x="520" y="360" width="560" height="64" rx="4" />
    <rect x="600" y="468" width="400" height="32" rx="4" opacity="0.6" />
  </g>

  <!-- One dot per banner number, so the design is identifiable in greyscale. -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="720" cy="780" r="28" />
    <circle cx="800" cy="780" r="28" />
    <circle cx="880" cy="780" r="28" />
  </g>
</svg>
