<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Seed creator icon 4</title>

  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3557" />
      <stop offset="1" stop-color="#00b4d8" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#field)" />

  <!-- One dot per icon number, so the design is identifiable in greyscale. -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="166" cy="64" r="14" />
    <circle cx="226" cy="64" r="14" />
    <circle cx="286" cy="64" r="14" />
    <circle cx="346" cy="64" r="14" />
  </g>

  <!-- A head and shoulders, so an icon reads as a portrait next to a card. -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="256" cy="224" r="88" />
    <path d="M 256 332 C 348 332 412 386 424 466 L 88 466 C 100 386 164 332 256 332 Z" />
  </g>
</svg>
