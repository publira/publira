<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" preserveAspectRatio="none">
  <title>Seed eye-catch card 2, lattice</title>

  <defs>
    <linearGradient id="field" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0b6e4f" />
      <stop offset="1" stop-color="#08a4bd" />
    </linearGradient>
    <pattern id="lattice" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.35" />
      <rect x="60" y="60" width="80" height="80" fill="#ffffff" opacity="0.18" />
    </pattern>
  </defs>

  <rect width="1600" height="1600" fill="url(#field)" />
  <rect width="1600" height="1600" fill="url(#lattice)" />
  <rect x="200" y="200" width="1200" height="1200" fill="none" stroke="#ffffff" stroke-width="28" opacity="0.55" />

  <g fill="none" stroke="#ffffff" stroke-width="14" opacity="0.85">
    <path d="M 80 176 L 80 80 L 176 80" />
    <path d="M 1520 176 L 1520 80 L 1424 80" />
    <path d="M 80 1424 L 80 1520 L 176 1520" />
    <path d="M 1520 1424 L 1520 1520 L 1424 1520" />
  </g>

  <g fill="#ffffff" opacity="0.9">
    <circle cx="740" cy="1400" r="34" />
    <circle cx="860" cy="1400" r="34" />
  </g>
</svg>
