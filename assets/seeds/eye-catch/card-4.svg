<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" preserveAspectRatio="none">
  <title>Seed eye-catch card 4, diagonal stripes</title>

  <defs>
    <linearGradient id="field" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3557" />
      <stop offset="1" stop-color="#00b4d8" />
    </linearGradient>
    <pattern id="stripes" width="240" height="240" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="120" height="240" fill="#ffffff" opacity="0.16" />
      <rect x="160" width="30" height="240" fill="#ffffff" opacity="0.32" />
    </pattern>
  </defs>

  <rect width="1600" height="1600" fill="url(#field)" />
  <rect width="1600" height="1600" fill="url(#stripes)" />
  <circle cx="800" cy="800" r="380" fill="none" stroke="#ffffff" stroke-width="36" opacity="0.6" />

  <g fill="none" stroke="#ffffff" stroke-width="14" opacity="0.85">
    <path d="M 80 176 L 80 80 L 176 80" />
    <path d="M 1520 176 L 1520 80 L 1424 80" />
    <path d="M 80 1424 L 80 1520 L 176 1520" />
    <path d="M 1520 1424 L 1520 1520 L 1424 1520" />
  </g>

  <g fill="#ffffff" opacity="0.9">
    <circle cx="620" cy="1400" r="34" />
    <circle cx="740" cy="1400" r="34" />
    <circle cx="860" cy="1400" r="34" />
    <circle cx="980" cy="1400" r="34" />
  </g>
</svg>
