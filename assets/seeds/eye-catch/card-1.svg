<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" preserveAspectRatio="none">
  <title>Seed eye-catch card 1, concentric rings</title>

  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f4c81" />
      <stop offset="1" stop-color="#7b2cbf" />
    </linearGradient>
  </defs>

  <rect width="1600" height="1600" fill="url(#field)" />
  <g fill="none" stroke="#ffffff" opacity="0.4">
    <circle cx="800" cy="800" r="1080" stroke-width="44" />
    <circle cx="800" cy="800" r="900" stroke-width="16" />
    <circle cx="800" cy="800" r="720" stroke-width="44" />
    <circle cx="800" cy="800" r="540" stroke-width="16" />
    <circle cx="800" cy="800" r="360" stroke-width="44" />
    <circle cx="800" cy="800" r="180" stroke-width="16" />
  </g>

  <!-- Registration marks, so a crop can be told from the whole. -->
  <g fill="none" stroke="#ffffff" stroke-width="14" opacity="0.85">
    <path d="M 80 176 L 80 80 L 176 80" />
    <path d="M 1520 176 L 1520 80 L 1424 80" />
    <path d="M 80 1424 L 80 1520 L 176 1520" />
    <path d="M 1520 1424 L 1520 1520 L 1424 1520" />
  </g>

  <!-- One dot per card number, so the design is identifiable in greyscale. -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="800" cy="1400" r="34" />
  </g>
</svg>
