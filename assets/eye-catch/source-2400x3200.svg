<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3200" viewBox="0 0 2400 3200">
  <title>Eye-catch source, large enough for every accepted ratio</title>

  <defs>
<linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d95" />
      <stop offset="1" stop-color="#00d5ff" />
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe600" />
      <stop offset="1" stop-color="#001aff" />
    </linearGradient>
    <pattern id="weave" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#ffffff" opacity="0.14" />
      <rect x="100" y="100" width="100" height="100" fill="#ffffff" opacity="0.14" />
    </pattern>
  </defs>

  <rect width="2400" height="3200" fill="url(#warm)" />
  <rect width="2400" height="3200" fill="url(#cool)" opacity="0.45" />
  <rect width="2400" height="3200" fill="url(#weave)" />
  <!-- registration marks, so a crop can be told from the whole -->
  <g fill="none" stroke="#ffffff" stroke-width="19" opacity="0.85">
    <path d="M 120 264 L 120 120 L 264 120" />
    <path d="M 2280 264 L 2280 120 L 2136 120" />
    <path d="M 120 2936 L 120 3080 L 264 3080" />
    <path d="M 2280 2936 L 2280 3080 L 2136 3080" />
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="12" opacity="0.7">
    <line x1="1080" y1="1600" x2="1320" y2="1600" />
    <line x1="1200" y1="1480" x2="1200" y2="1720" />
    <circle cx="1200" cy="1600" r="120" />
  </g>
</svg>
