version: "2"
sql:
  - engine: postgresql
    schema: db/migrations/
    queries: db/query/
    gen:
      go:
        package: dbmodels
        out: server/internal/db/gen
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
        overrides:
          # lib/pq scans a Postgres array only into a slice it has a typed
          # array for, and []int16 is not one of them: the default mapping of
          # smallint[] fails at Scan with "scanning to int16 is not
          # implemented". The values are weekday numbers either way, so the
          # column stays smallint and Go reads it as []int32.
          - column: "series_listings.schedule_weekdays"
            go_type:
              type: "int32"
              slice: true
