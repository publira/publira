version: "3"

# Run from repository root via: task e2e:bootstrap
# Include is declared in e2e/Taskfile.yaml (cwd stays at repo root).

vars:
  # Directory of this Taskfile (e2e/bootstrap/), stable whether included or not.
  PUBLIRA_BOOTSTRAP_DIR: "{{.TASKFILE_DIR}}"

tasks:
  default:
    desc: Verify a clean dev environment end to end (setup → restart → task dev)
    cmds:
      - task: run

  run:
    desc: Full bootstrap check (fresh volume → task setup → db restart → task dev), always tears down
    cmds:
      - bash "{{.PUBLIRA_BOOTSTRAP_DIR}}/scripts/run.sh"

  test-lib:
    desc: Check the stop phase 3 waits on before restarting (no Docker)
    cmds:
      - bash "{{.PUBLIRA_BOOTSTRAP_DIR}}/scripts/lib_test.sh"

  up:
    desc: "Phase 1: fresh compose project on an empty Postgres volume"
    cmds:
      - bash "{{.PUBLIRA_BOOTSTRAP_DIR}}/scripts/up.sh"

  setup:
    desc: "Phase 2: task setup, then assert migrations and the dev seed"
    cmds:
      - bash "{{.PUBLIRA_BOOTSTRAP_DIR}}/scripts/setup.sh"

  restart-db:
    desc: "Phase 3: restart db and rustfs and assert migrations, seed data, and stored objects persist"
    cmds:
      - bash "{{.PUBLIRA_BOOTSTRAP_DIR}}/scripts/restart-db.sh"

  dev-up:
    desc: "Phase 4a: start task dev (background, log in e2e/bootstrap/.run/logs)"
    cmds:
      - bash "{{.PUBLIRA_BOOTSTRAP_DIR}}/scripts/dev-up.sh"

  dev-wait:
    desc: "Phase 4b: wait for every service health probe via wait4x"
    cmds:
      - bash "{{.PUBLIRA_BOOTSTRAP_DIR}}/scripts/dev-wait.sh"

  dev-down:
    desc: Stop the background task dev process group
    cmds:
      - bash "{{.PUBLIRA_BOOTSTRAP_DIR}}/scripts/dev-down.sh"

  down:
    desc: Stop task dev and remove the compose project + volumes
    cmds:
      - bash "{{.PUBLIRA_BOOTSTRAP_DIR}}/scripts/down.sh"
