# Ephemeral dependency stack for E2E (project name: publira-e2e).
# Apps (api-server, web-host) run on the host; only data stores are containerized.
#
# Host ports are offset from each service's default (5432 / 6379 / 9000) so
# they clear other local stacks. Override with E2E_POSTGRES_PORT / E2E_REDIS_PORT /
# E2E_RUSTFS_PORT (and a distinct COMPOSE_PROJECT_NAME) so a second stack can
# run from the same checkout:
#   postgres → localhost:${E2E_POSTGRES_PORT:-5433}
#   redis    → localhost:${E2E_REDIS_PORT:-6380}
#   rustfs   → localhost:${E2E_RUSTFS_PORT:-9003}

name: publira-e2e

services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: publira
    ports:
      - "127.0.0.1:${E2E_POSTGRES_PORT:-5433}:5432"
    volumes:
      - e2e-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d publira"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  redis:
    # Valkey is Redis-protocol compatible; keep REDIS_URL as redis://...
    image: valkey/valkey:9.1.1-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${E2E_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.2@sha256:7d6d361c49c08d427250fb59aae5d78df83d644c3405d9ccf4b21cda0b0692d0
    environment:
      RUSTFS_ACCESS_KEY: publira
      RUSTFS_SECRET_KEY: publirapass
    ports:
      - "127.0.0.1:${E2E_RUSTFS_PORT:-9003}:9000"
    volumes:
      - e2e-rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

volumes:
  e2e-postgres-data:
  e2e-rustfs-data:
