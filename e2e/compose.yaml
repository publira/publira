# Ephemeral dependency stack for E2E (project name: publira-e2e).
# Apps (api-server, web-host) run on the host; only data stores are containerized.
#
# Host ports avoid colliding with Dev Container defaults (db hostname-only,
# redis :6379). Override with E2E_POSTGRES_PORT / E2E_REDIS_PORT (and a distinct
# COMPOSE_PROJECT_NAME) so a second stack can run from the same checkout:
#   postgres → localhost:${E2E_POSTGRES_PORT:-5433}
#   redis    → localhost:${E2E_REDIS_PORT:-6380}

name: publira-e2e

services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:f65cfc1a73466fc0807f4a33496e1c438b19269091c8f998faec871874df8e5e
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: publira
    ports:
      - "127.0.0.1:${E2E_POSTGRES_PORT:-5433}:5432"
    volumes:
      - e2e-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d publira"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  redis:
    # Valkey is Redis-protocol compatible; keep REDIS_URL as redis://...
    image: valkey/valkey:9.1.1-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${E2E_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

volumes:
  e2e-postgres-data:
