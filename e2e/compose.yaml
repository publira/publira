# Ephemeral dependency stack for E2E (project name: publira-e2e).
# Apps (api-server, web-host) run on the host; only data stores are containerized.
#
# The one exception is traefik, the edge in front of those host processes.
#
# Host ports are offset from each service's default (5432 / 6379 / 9000) so
# they clear other local stacks. Override with E2E_POSTGRES_PORT / E2E_REDIS_PORT /
# E2E_RUSTFS_PORT / E2E_EDGE_PORT (and a distinct COMPOSE_PROJECT_NAME) so a
# second stack can run from the same checkout:
#   postgres → localhost:${E2E_POSTGRES_PORT:-5433}
#   redis    → localhost:${E2E_REDIS_PORT:-6380}
#   rustfs   → localhost:${E2E_RUSTFS_PORT:-9003}
#   traefik  → localhost:${E2E_EDGE_PORT:-3080}

name: publira-e2e

services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    environment:
      POSTGRES_DB: publira
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:${E2E_POSTGRES_PORT:-5433}:5432"
    volumes:
      - e2e-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d publira"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  redis:
    # Valkey is Redis-protocol compatible; keep PUBLIRA_REDIS_URL as redis://...
    image: valkey/valkey:9.1.2-alpine@sha256:a174b894902bd3367e330d47cc2054367dc4917701776aaf336f41d83b65ec7a
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${E2E_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.2@sha256:7d6d361c49c08d427250fb59aae5d78df83d644c3405d9ccf4b21cda0b0692d0
    environment:
      RUSTFS_ACCESS_KEY: publira
      RUSTFS_SECRET_KEY: publirapass
    ports:
      - "127.0.0.1:${E2E_RUSTFS_PORT:-9003}:9000"
    volumes:
      - e2e-rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

  # The public edge, matching what Traefik serves in the Dev Container: an
  # episode body image is `/images/episodes/{id}` on the reader's own origin,
  # so without something joining web-host and image-server under one host and
  # port the browser cannot reach a page at all.
  #
  # `network_mode: host` because every backend is a host process on loopback,
  # which a bridged container has no route to. Routers come from a file the
  # run directory owns (scripts/up.sh writes it) rather than Docker labels,
  # because the backends are not containers. Only the viewer performance suite
  # goes through here; every other suite keeps talking to web-host directly.
  traefik:
    image: traefik:v3.7.12@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf
    network_mode: host
    command:
      # Loopback, like every published port above: a bare `:port` would listen
      # on every interface, which host networking makes the real ones.
      - "--entrypoints.web.address=127.0.0.1:${E2E_EDGE_PORT:-3080}"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    volumes:
      - ${E2E_TRAEFIK_DYNAMIC_DIR:-./.run/traefik}:/etc/traefik/dynamic:ro

volumes:
  e2e-postgres-data:
  e2e-rustfs-data:
