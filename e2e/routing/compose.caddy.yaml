# Caddy in front of the echo backends from compose.echo.yaml.
#
# No PUBLIRA_UPSTREAM_* variables: the Caddyfile's defaults already name
# `app`, so this run exercises the committed file as it stands. The hosts have
# no default, and are the ones scripts/lib.sh lists for every proxy.
#
# PUBLIRA_ROUTING_PROXY_DIR replaces the directory in the trusted-hop pass, with a
# copy whose trusted-proxy setting scripts/lib.sh has enabled.
#
# Relative paths resolve against this directory, which is the project
# directory: compose.echo.yaml is passed first and lives here too.

services:
  proxy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    depends_on:
      app:
        condition: service_healthy
    environment:
      PUBLIRA_EDGE_SITE_HOSTS: ${PUBLIRA_ROUTING_SITE_HOSTS:?}
      PUBLIRA_EDGE_ADMIN_HOSTS: ${PUBLIRA_ROUTING_ADMIN_HOSTS:?}
      PUBLIRA_EDGE_PLATFORM_HOSTS: ${PUBLIRA_ROUTING_PLATFORM_HOSTS?}
    ports:
      - "127.0.0.1:${PUBLIRA_ROUTING_EDGE_PORT:-13080}:80"
    volumes:
      - ${PUBLIRA_ROUTING_PROXY_DIR:-../../infra/proxy/caddy}/Caddyfile:/etc/caddy/Caddyfile:ro
