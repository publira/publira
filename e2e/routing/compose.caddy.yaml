# Caddy in front of the echo backends from compose.echo.yaml.
#
# No PUBLIRA_UPSTREAM_* variables: the Caddyfile's defaults already name
# `app`, so this run exercises the committed file as it stands.
#
# Relative paths resolve against this directory, which is the project
# directory: compose.echo.yaml is passed first and lives here too.

services:
  proxy:
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PUBLIRA_ROUTING_EDGE_PORT:-13080}:80"
    volumes:
      - ../../infra/proxy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
