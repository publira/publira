# The four backends, for the proxies that do not come with a compose file of
# their own. The Traefik half of the check overlays the Dev Container files
# instead and gets its `app` from there; nginx and Caddy pair this file with
# compose.nginx.yaml / compose.caddy.yaml.
#
# The service is named `app` because that is the host name the committed
# backend addresses use — infra/proxy/nginx/upstreams.conf and the Caddyfile
# defaults alike.
#
# `PUBLIRA_ROUTING_ECHO` is exported by scripts/lib.sh; the path is absolute so it
# resolves the same way here as it does under the Dev Container overlay, where
# relative paths belong to the repository root.

services:
  app:
    # Pin the tag + digest the same way .devcontainer/compose.yaml does. The
    # Node.js version is the one `devEngines.runtime.version` in package.json
    # names, so echo.ts runs on the runtime the rest of the tooling does.
    image: node:26.13.0-alpine3.24@sha256:c6ad9e9c1d80f6eb607c26b4b0a132ff7a2344fad1c78ea3baa2a7d4c8de6d94
    command: ["node", "/echo.ts"]
    volumes:
      - ${PUBLIRA_ROUTING_ECHO}:/echo.ts:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((res) => process.exit(res.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
