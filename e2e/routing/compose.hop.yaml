# Overlay for the pass that puts a trusted hop in front of the edge, on top of
# compose.echo.yaml and the compose file of the proxy under test.
#
# The hop is a container of its own on a network of its own, at an address
# fixed before the proxy starts, because the proxy is told to trust that one
# address and no other. Probes sent from the host reach the proxy from
# somewhere else, the gateway of one of its networks, so the same run has a
# client outside the trusted range as well. scripts/lib.sh exports the subnet
# and the address.

networks:
  hop:
    ipam:
      config:
        - subnet: ${PUBLIRA_ROUTING_HOP_SUBNET:?}

services:
  proxy:
    networks:
      - default
      - hop

  hop:
    # The echo server's image: the hop sends its requests with Node.js.
    image: node:24.22.2-alpine3.24@sha256:8a32c8cf649a49915a66e81e7a609223c708d0adabf288ee3f4077d765542f85
    init: true
    command: ["node", "-e", "setInterval(() => {}, 1 << 30)"]
    networks:
      hop:
        ipv4_address: ${PUBLIRA_ROUTING_HOP_ADDRESS:?}
