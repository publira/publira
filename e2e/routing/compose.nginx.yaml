# nginx in front of the echo backends from compose.echo.yaml.
#
# The whole infra/proxy/nginx directory becomes /etc/nginx/templates. The
# image's entrypoint fills the hosts scripts/lib.sh lists into
# default.conf.template and writes the result over the image's own
# conf.d/default.conf, which would otherwise claim `default_server` on the
# same port; upstreams.conf and snippets/ are included from where they are
# mounted.
#
# PUBLIRA_ROUTING_PROXY_DIR replaces the directory in the trusted-hop pass, with a
# copy whose trusted-proxy setting scripts/lib.sh has enabled.
#
# Relative paths resolve against this directory, which is the project
# directory: compose.echo.yaml is passed first and lives here too.

services:
  proxy:
    image: nginx:1.31.8-alpine3.24@sha256:e2d97c2b8c016f12c2f1a27d095685063b2f281c4edf2babfde6001cf4fb77a8
    depends_on:
      app:
        condition: service_healthy
    environment:
      PUBLIRA_EDGE_SITE_HOSTS: ${PUBLIRA_ROUTING_SITE_HOSTS:?}
      PUBLIRA_EDGE_ADMIN_HOSTS: ${PUBLIRA_ROUTING_ADMIN_HOSTS:?}
      PUBLIRA_EDGE_PLATFORM_HOSTS: ${PUBLIRA_ROUTING_PLATFORM_HOSTS?}
    ports:
      - "127.0.0.1:${PUBLIRA_ROUTING_EDGE_PORT:-13080}:80"
    volumes:
      - ${PUBLIRA_ROUTING_PROXY_DIR:-../../infra/proxy/nginx}:/etc/nginx/templates:ro
