# nginx in front of the echo backends from compose.echo.yaml.
#
# The whole infra/proxy/nginx directory becomes /etc/nginx/conf.d, which the
# stock nginx.conf includes as `*.conf` inside `http`: publira.conf and
# upstreams.conf are picked up, snippets/ is not, and the image's own
# default.conf is covered over — it would otherwise claim `default_server` on
# the same port.
#
# Relative paths resolve against this directory, which is the project
# directory: compose.echo.yaml is passed first and lives here too.

services:
  proxy:
    image: nginx:1.31.6-alpine@sha256:35c6bab452e41fc906bfa367bccff2e92f88ba6723d07479e7a18e1c6a3f5b52
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ROUTING_EDGE_PORT:-13080}:80"
    volumes:
      - ../../infra/proxy/nginx:/etc/nginx/conf.d:ro
