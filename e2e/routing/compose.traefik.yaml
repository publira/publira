# Overlay on ../../compose.yaml + ../../.devcontainer/compose.yaml for the
# Traefik half of the routing check.
#
# The check must exercise the *real* Dev Container edge: the same Traefik, the
# same static flags, and the same bind mount of
# infra/proxy/traefik/dynamic. Only the process behind the backend ports is
# replaced: a small echo server answers on 3000 / 4000 / 4100 / 8000 so
# a probe can tell which backend the edge chose and which path that backend
# saw. The container is still named `app`, which is the host name services.yaml
# gives every backend.
#
# `db` / `redis` / `mailpit` stay down. The Dev Container file is itself an
# overlay, so the root compose file has to come first for the project to be
# valid at all. Relative paths in the base files resolve against the repository
# root (the first `-f` wins), so this file uses the absolute `PUBLIRA_ROUTING_ECHO`
# exported by scripts/lib.sh.
#
# Published ports are offset from the Dev Container forwards (`traefik:3080`
# / `traefik:8080`) so a local run never collides with the live stack.

services:
  traefik:
    # The hosts the probes expect, in place of the Dev Container's own
    # (scripts/lib.sh lists them).
    environment:
      PUBLIRA_EDGE_SITE_HOSTS: ${PUBLIRA_ROUTING_SITE_HOSTS:?}
      PUBLIRA_EDGE_ADMIN_HOSTS: ${PUBLIRA_ROUTING_ADMIN_HOSTS:?}
      PUBLIRA_EDGE_PLATFORM_HOSTS: ${PUBLIRA_ROUTING_PLATFORM_HOSTS?}
    ports:
      - "127.0.0.1:${PUBLIRA_ROUTING_EDGE_PORT:-13080}:3080"
      - "127.0.0.1:${PUBLIRA_ROUTING_TRAEFIK_API_PORT:-18080}:8080"

  app:
    # Pin the tag + digest the same way .devcontainer/compose.yaml does. The
    # Node.js version is the one `devEngines.runtime.version` in package.json
    # names, so echo.ts runs on the runtime the rest of the tooling does.
    image: node:24.21.0-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    # Drop the Dev Container build; the edge is what this check is about.
    build: !reset
    command: ["node", "/echo.ts"]
    volumes: !override
      - ${PUBLIRA_ROUTING_ECHO}:/echo.ts:ro
    depends_on: !reset
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((res) => process.exit(res.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
