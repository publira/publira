# Overlay on ../../compose.yaml + ../../.devcontainer/compose.yaml for the
# Traefik half of the routing check.
#
# The check must exercise the *real* Dev Container edge: the same Traefik, the
# same static flags, and the same bind mount of
# infra/proxy/traefik/dynamic. Only the process behind the backend ports is
# replaced: a small echo server answers on 3000 / 4000 / 4100 / 8000 / 8200 /
# 8201 so a probe can tell which backend the edge chose and which path that
# backend saw. The container is still named `app`, which is the host name
# services.yaml gives every backend.
#
# `db` / `redis` / `mailpit` stay down. The Dev Container file is itself an
# overlay, so the root compose file has to come first for the project to be
# valid at all. Relative paths in the base files resolve against the repository
# root (the first `-f` wins), so this file uses the absolute `ROUTING_ECHO_PY`
# exported by scripts/lib.sh.
#
# Published ports are offset from the Dev Container forwards (`traefik:3080`
# / `traefik:8080`) so a local run never collides with the live stack.

services:
  traefik:
    ports:
      - "127.0.0.1:${ROUTING_EDGE_PORT:-13080}:3080"
      - "127.0.0.1:${ROUTING_TRAEFIK_API_PORT:-18080}:8080"

  app:
    # Pin the tag + digest the same way .devcontainer/compose.yaml does.
    image: python:3.14-alpine@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
    # Drop the Dev Container build; the edge is what this check is about.
    build: !reset
    command: ["python", "/echo.py"]
    volumes: !override
      - ${ROUTING_ECHO_PY}:/echo.py:ro
    depends_on: !reset
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/')",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
