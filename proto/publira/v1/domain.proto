syntax = "proto3";

package publira.v1;

option go_package = "github.com/publira/publira/server/gen/publira/v1;publirav1";

message GetTenantByDomainRequest {
  repeated string domains = 1;
}

message GetTenantByDomainResponse {
  // Primary key (UUID) for internal routing / TenantContext.
  string tenant_id = 1;
  // The tenant's saved default locale (ja, en) so the host proxy can pick a
  // redirect in one round trip. Never empty: a stored code naming no supported
  // locale fails this RPC rather than answering another language.
  string default_locale = 2;
}

service DomainService {
  rpc GetTenantByDomain(GetTenantByDomainRequest) returns (GetTenantByDomainResponse) {}
}
