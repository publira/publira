syntax = "proto3";

package publira.v1;

option go_package = "github.com/publira/publira/server/gen/publira/v1;publirav1";

import "publira/types/v1/types.proto";

message LoginRequest {
  publira.types.v1.TenantContext tenant = 1;
  string email = 2;
  string password = 3;
}

message LoginResponse {
  publira.types.v1.User user = 1;
  publira.types.v1.AccessToken access_token = 2;
}

message CreateUserRequest {
  publira.types.v1.TenantContext tenant = 1;
  string name = 2;
  string email = 3;
  string password = 4;
}

message CreateUserResponse {
  publira.types.v1.User user = 1;
  publira.types.v1.AccessToken access_token = 2;
}

message VerifyUserEmailRequest {
  publira.types.v1.TenantContext tenant = 1;
  string token = 2;
}

message VerifyUserEmailResponse {
  bool verified = 1;
}

message RequestEmailChangeRequest {
  publira.types.v1.TenantContext tenant = 1;
  string current_email = 2;
  string new_email = 3;
  string current_password = 4;
}

message RequestEmailChangeResponse {
  bool requested = 1;
}

message ConfirmEmailChangeRequest {
  publira.types.v1.TenantContext tenant = 1;
  string token = 2;
}

message ConfirmEmailChangeResponse {
  bool confirmed = 1;
  bool changed = 2;
  string pending_confirmation_for = 3;
}

message RequestPasswordResetRequest {
  publira.types.v1.TenantContext tenant = 1;
  string email = 2;
}

message RequestPasswordResetResponse {
  bool requested = 1;
}

message ConfirmPasswordResetRequest {
  publira.types.v1.TenantContext tenant = 1;
  string token = 2;
  string new_password = 3;
}

message ConfirmPasswordResetResponse {
  bool confirmed = 1;
}

message LogoutRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message LogoutResponse {}

message GetMeRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message GetMeResponse {
  publira.types.v1.User user = 1;
}

message UpdateMeRequest {
  publira.types.v1.TenantContext tenant = 1;
  string name = 2;
}

message UpdateMeResponse {
  publira.types.v1.User user = 1;
}

message DeleteMeRequest {
  publira.types.v1.TenantContext tenant = 1;
  string password = 2;
}

message DeleteMeResponse {}

message GetNotificationSettingsRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message GetNotificationSettingsResponse {
  bool email_notifications_enabled = 1;
}

message UpdateNotificationSettingsRequest {
  publira.types.v1.TenantContext tenant = 1;
  bool email_notifications_enabled = 2;
}

message UpdateNotificationSettingsResponse {
  bool email_notifications_enabled = 1;
}

message NotificationItem {
  string id = 1;
  string notification_type = 2;
  string title = 3;
  string body = 4;
  string link_url = 5;
  bool is_read = 6;
  string read_at = 7;
  string created_at = 8;
}

message ListNotificationsRequest {
  publira.types.v1.TenantContext tenant = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListNotificationsResponse {
  repeated NotificationItem notifications = 1;
}

message MarkNotificationAsReadRequest {
  publira.types.v1.TenantContext tenant = 1;
  string notification_id = 2;
}

message MarkNotificationAsReadResponse {
  bool marked = 1;
}

message MarkAllNotificationsAsReadRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message MarkAllNotificationsAsReadResponse {
  int32 marked_count = 1;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse) {}
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {}
  rpc VerifyUserEmail(VerifyUserEmailRequest) returns (VerifyUserEmailResponse) {}
  rpc RequestEmailChange(RequestEmailChangeRequest) returns (RequestEmailChangeResponse) {}
  rpc ConfirmEmailChange(ConfirmEmailChangeRequest) returns (ConfirmEmailChangeResponse) {}
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse) {}
  rpc ConfirmPasswordReset(ConfirmPasswordResetRequest) returns (ConfirmPasswordResetResponse) {}
  rpc Logout(LogoutRequest) returns (LogoutResponse) {}
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {}
  rpc UpdateMe(UpdateMeRequest) returns (UpdateMeResponse) {}
  rpc DeleteMe(DeleteMeRequest) returns (DeleteMeResponse) {}
  rpc GetNotificationSettings(GetNotificationSettingsRequest) returns (GetNotificationSettingsResponse) {}
  rpc UpdateNotificationSettings(UpdateNotificationSettingsRequest) returns (UpdateNotificationSettingsResponse) {}
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {}
  rpc MarkNotificationAsRead(MarkNotificationAsReadRequest) returns (MarkNotificationAsReadResponse) {}
  rpc MarkAllNotificationsAsRead(MarkAllNotificationsAsReadRequest) returns (MarkAllNotificationsAsReadResponse) {}
}
