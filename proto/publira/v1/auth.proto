syntax = "proto3";

package publira.v1;

option go_package = "github.com/publira/publira/server/gen/publira/v1;publirav1";

import "publira/types/v1/types.proto";

message CreateSessionRequest {
  publira.types.v1.TenantContext tenant = 1;
  string email = 2;
  string password = 3;
}

message CreateSessionResponse {
  publira.types.v1.User user = 1;
  publira.types.v1.Session session = 2;
}

message CreateUserRequest {
  publira.types.v1.TenantContext tenant = 1;
  string name = 2;
  string email = 3;
  string password = 4;
}

message CreateUserResponse {
  publira.types.v1.User user = 1;
  publira.types.v1.Session session = 2;
}

message VerifyUserEmailRequest {
  publira.types.v1.TenantContext tenant = 1;
  string token = 2;
}

message VerifyUserEmailResponse {
  bool verified = 1;
}

message RequestEmailChangeRequest {
  publira.types.v1.TenantContext tenant = 1;
  string session_id = 2;
  string current_email = 3;
  string new_email = 4;
  string current_password = 5;
}

message RequestEmailChangeResponse {
  bool requested = 1;
}

message ConfirmEmailChangeRequest {
  publira.types.v1.TenantContext tenant = 1;
  string token = 2;
}

message ConfirmEmailChangeResponse {
  bool confirmed = 1;
  bool changed = 2;
  string pending_confirmation_for = 3;
}

message RequestPasswordResetRequest {
  publira.types.v1.TenantContext tenant = 1;
  string email = 2;
}

message RequestPasswordResetResponse {
  bool requested = 1;
}

message ConfirmPasswordResetRequest {
  publira.types.v1.TenantContext tenant = 1;
  string token = 2;
  string new_password = 3;
}

message ConfirmPasswordResetResponse {
  bool confirmed = 1;
}

message DeleteSessionRequest {
  publira.types.v1.TenantContext tenant = 1;
  string session_id = 2;
}

message DeleteSessionResponse {}

message GetMeRequest {
  publira.types.v1.TenantContext tenant = 1;
  string session_id = 2;
}

message GetMeResponse {
  publira.types.v1.User user = 1;
}

message UpdateMeRequest {
  publira.types.v1.TenantContext tenant = 1;
  string session_id = 2;
  string name = 3;
}

message UpdateMeResponse {
  publira.types.v1.User user = 1;
}

message DeleteMeRequest {
  publira.types.v1.TenantContext tenant = 1;
  string session_id = 2;
  string password = 3;
}

message DeleteMeResponse {}

message GetNotificationSettingsRequest {
  publira.types.v1.TenantContext tenant = 1;
  string session_id = 2;
}

message GetNotificationSettingsResponse {
  bool email_notifications_enabled = 1;
}

message UpdateNotificationSettingsRequest {
  publira.types.v1.TenantContext tenant = 1;
  string session_id = 2;
  bool email_notifications_enabled = 3;
}

message UpdateNotificationSettingsResponse {
  bool email_notifications_enabled = 1;
}

service AuthService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {}
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {}
  rpc VerifyUserEmail(VerifyUserEmailRequest) returns (VerifyUserEmailResponse) {}
  rpc RequestEmailChange(RequestEmailChangeRequest) returns (RequestEmailChangeResponse) {}
  rpc ConfirmEmailChange(ConfirmEmailChangeRequest) returns (ConfirmEmailChangeResponse) {}
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse) {}
  rpc ConfirmPasswordReset(ConfirmPasswordResetRequest) returns (ConfirmPasswordResetResponse) {}
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse) {}
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {}
  rpc UpdateMe(UpdateMeRequest) returns (UpdateMeResponse) {}
  rpc DeleteMe(DeleteMeRequest) returns (DeleteMeResponse) {}
  rpc GetNotificationSettings(GetNotificationSettingsRequest) returns (GetNotificationSettingsResponse) {}
  rpc UpdateNotificationSettings(UpdateNotificationSettingsRequest) returns (UpdateNotificationSettingsResponse) {}
}
