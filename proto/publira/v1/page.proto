syntax = "proto3";

package publira.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/v1;publirav1";

import "publira/types/v1/types.proto";

message ListPublishedPagesRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The reader's locale. Each page is listed in its published translation in
  // this locale, else the tenant's default locale, else its oldest published
  // one, and Page.locale names the one listed. Empty means the tenant's
  // default locale.
  string locale = 2;
}

message ListPublishedPagesResponse {
  repeated publira.types.v1.Page pages = 1;
}

message ListPublishedPageSlugsRequest {
  publira.types.v1.TenantContext tenant = 1;
}

// Every published page's slug, footer or not, in storage form ("/privacy").
// The public site's proxy holds the whole set to decide whether a path names a
// page, so it is one unpaginated answer rather than a list to browse.
message ListPublishedPageSlugsResponse {
  repeated string slugs = 1;
}

message GetPublishedPageRequest {
  publira.types.v1.TenantContext tenant = 1;
  string slug = 2;
  // The reader's locale, resolved as ListPublishedPagesRequest.locale is.
  string locale = 3;
}

message GetPublishedPageResponse {
  publira.types.v1.Page page = 1;
  publira.types.v1.PageVersion version = 2;
  // Every locale the page has a published translation in, the served one
  // included, in code order: the language alternates of the page.
  repeated string published_locales = 3;
}

service PublicPagesService {
  rpc ListPublishedPages(ListPublishedPagesRequest) returns (ListPublishedPagesResponse) {}
  rpc ListPublishedPageSlugs(ListPublishedPageSlugsRequest) returns (ListPublishedPageSlugsResponse) {}
  rpc GetPublishedPage(GetPublishedPageRequest) returns (GetPublishedPageResponse) {}
}