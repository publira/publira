syntax = "proto3";

package publira.v1;

option go_package = "github.com/publira/publira/server/gen/publira/v1;publirav1";

import "publira/types/v1/types.proto";

// Cursor pagination. Field shape and token rules: proto/README.md.
message ListPublishedLabelsRequest {
  // Removed with the move to cursor pagination.
  reserved 3;
  reserved "offset";

  publira.types.v1.TenantContext tenant = 1;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 4;
}

message ListPublishedLabelsResponse {
  repeated publira.types.v1.Label labels = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

// Sort order of a published series list.
enum SeriesOrder {
  // Same as SERIES_ORDER_PUBLISHED_AT_DESC.
  SERIES_ORDER_UNSPECIFIED = 0;
  // Newest published first.
  SERIES_ORDER_PUBLISHED_AT_DESC = 1;
  // Oldest published first.
  SERIES_ORDER_PUBLISHED_AT_ASC = 2;
  // By title, ascending.
  SERIES_ORDER_TITLE_ASC = 3;
  // By title, descending.
  SERIES_ORDER_TITLE_DESC = 4;
}

// Cursor pagination. Field shape and token rules: proto/README.md.
message ListPublishedSeriesRequest {
  // Removed with the move to cursor pagination.
  reserved 3;
  reserved "offset";

  publira.types.v1.TenantContext tenant = 1;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 4;
  // Sort order. A token carries the order it was built for; sending it with a
  // different order is invalid_argument, because the page it points at no
  // longer exists in the new order. Changing the order restarts at page 1.
  SeriesOrder order = 5;
}

message ListPublishedSeriesResponse {
  repeated publira.types.v1.Series series = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

message GetSeriesDetailRequest {
  publira.types.v1.TenantContext tenant = 1;
  string public_id = 2;
}

message GetSeriesDetailResponse {
  publira.types.v1.Series series = 1;
  repeated publira.types.v1.Episode episodes = 2;
}

message GetEpisodeDetailRequest {
  publira.types.v1.TenantContext tenant = 1;
  string public_id = 2;
}

// Viewer access state for an episode body on GetEpisodeDetail.
enum EpisodeAccess {
  EPISODE_ACCESS_UNSPECIFIED = 0;
  // price is 0 (public body).
  EPISODE_ACCESS_FREE = 1;
  // paid and no valid purchase/ticket grant.
  EPISODE_ACCESS_LOCKED = 2;
  // valid purchase or active access ticket.
  EPISODE_ACCESS_ENTITLED = 3;
}

// Episode detail for public viewing.
// Body/content is represented as ordered images for the reader UI.
message GetEpisodeDetailResponse {
  publira.types.v1.Episode episode = 1;
  publira.types.v1.Series series = 2;
  // Body images. Empty when access is locked (paid, no purchase/ticket).
  repeated publira.types.v1.EpisodeImage images = 3;
  // Viewer access state for this episode.
  EpisodeAccess access = 4;
}

// A creator that currently has at least one published series.
message PublishedAuthor {
  string public_id = 1;
  string name = 2;
  string profile_text = 3;
  string icon_image_url = 4;
  int64 icon_image_file_size_bytes = 5;
  string icon_image_updated_at = 6;
  int32 published_series_count = 7;
}

// Cursor pagination. Field shape and token rules: proto/README.md.
// Sorted by creator name, then id. There is no order field: name order is the
// only list the storefront needs, and a later selectable order would have to
// carry its name in the token (see proto/README.md).
message ListPublishedAuthorsRequest {
  publira.types.v1.TenantContext tenant = 1;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 3;
}

message ListPublishedAuthorsResponse {
  repeated PublishedAuthor authors = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

// Cursor pagination for the author's published series. Field shape and token
// rules: proto/README.md. Sorted by title, then id. There is no order field:
// title order is the only series list the author page needs, and a later
// selectable order would have to carry its name in the token.
message GetPublishedAuthorDetailRequest {
  publira.types.v1.TenantContext tenant = 1;
  string public_id = 2;
  // Max series in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 3;
  // Opaque token from a previous response. Empty for the first page.
  string token = 4;
}

message GetPublishedAuthorDetailResponse {
  PublishedAuthor author = 1;
  // One page of published series credited to this author, title ascending.
  repeated publira.types.v1.Series series = 2;
  // Token for the previous series page. Empty on the first page.
  string previous_token = 3;
  // Token for the next series page. Empty on the last page.
  string next_token = 4;
}

// A label that belongs to the requested tenant, plus how many of its series
// are currently published. Labels have no unpublished state of their own; a
// label with zero published series is still returned so a shareable detail
// URL stays valid after its last series is taken down.
message PublishedLabel {
  string public_id = 1;
  string name = 2;
  string eye_catch_image_updated_at = 3;
  repeated publira.types.v1.SeriesEyeCatchVariant eye_catch_image_variants = 4;
  int32 published_series_count = 5;
}

// Cursor pagination for the label's published series. Field shape and token
// rules: proto/README.md. Sorted by title, then id. There is no order field:
// title order is the only series list the label page needs, and a later
// selectable order would have to carry its name in the token.
message GetPublishedLabelDetailRequest {
  publira.types.v1.TenantContext tenant = 1;
  string public_id = 2;
  // Max series in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 3;
  // Opaque token from a previous response. Empty for the first page.
  string token = 4;
}

message GetPublishedLabelDetailResponse {
  PublishedLabel label = 1;
  // One page of published series on this label, title ascending.
  repeated publira.types.v1.Series series = 2;
  // Token for the previous series page. Empty on the first page.
  string previous_token = 3;
  // Token for the next series page. Empty on the last page.
  string next_token = 4;
}

// Cursor pagination. Field shape and token rules: proto/README.md.
// Matches published series whose title or synopsis contains `query`
// (case-insensitive substring). Sorted by title, then id. There is no order
// field: title order is the only search result list the storefront needs.
// The token carries the Unicode-lowercased query it was built for; that same
// string is the ILIKE pattern. Sending the token with a query that lowers to
// a different string is invalid_argument. ASCII case changes of the same
// query are the same search. Changing to a different query restarts at page 1.
message SearchPublishedSeriesRequest {
  publira.types.v1.TenantContext tenant = 1;
  // Trimmed keyword. Empty after trim is invalid_argument. Max 100 runes.
  // Not restricted to ASCII; Japanese titles are the expected input.
  string query = 2;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 3;
  // Opaque token from a previous response. Empty for the first page.
  string token = 4;
}

message SearchPublishedSeriesResponse {
  repeated publira.types.v1.Series series = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

// Whether behavioural signals are behind a recommendation list at all. It
// describes the tenant rather than the page: a later page of a ranked list is
// all new arrivals, and still says RANKING. The list itself cannot be read for
// this — a ranked list and its fallback are both just series.
enum RecommendationSource {
  RECOMMENDATION_SOURCE_UNSPECIFIED = 0;
  // A ranking snapshot decided the front of the list.
  RECOMMENDATION_SOURCE_RANKING = 1;
  // The tenant has no usable ranking snapshot, so the whole list is ordered
  // newest first.
  RECOMMENDATION_SOURCE_NEW_ARRIVALS = 2;
}

// Cursor pagination. Field shape and token rules: proto/README.md.
// There is no order field: the recommendation order is the one this RPC exists
// to produce.
message ListRecommendedSeriesRequest {
  publira.types.v1.TenantContext tenant = 1;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 3;
}

message ListRecommendedSeriesResponse {
  // Ranked series first, in ranking order, then every other published series
  // newest first.
  repeated publira.types.v1.Series series = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
  RecommendationSource source = 4;
}

service CatalogService {
  rpc ListPublishedLabels(ListPublishedLabelsRequest) returns (ListPublishedLabelsResponse) {}
  rpc ListPublishedSeries(ListPublishedSeriesRequest) returns (ListPublishedSeriesResponse) {}
  rpc GetSeriesDetail(GetSeriesDetailRequest) returns (GetSeriesDetailResponse) {}
  // Returns only currently published episodes in the requested tenant.
  // Unpublished, cross-tenant, and missing episodes are all surfaced as NotFound
  // to prevent content existence leakage.
  rpc GetEpisodeDetail(GetEpisodeDetailRequest) returns (GetEpisodeDetailResponse) {}
  rpc ListPublishedAuthors(ListPublishedAuthorsRequest) returns (ListPublishedAuthorsResponse) {}
  // Returns a creator only when they have at least one currently published
  // series in the requested tenant. Cross-tenant, unpublished, and missing
  // authors are all surfaced as NotFound so an unpublished author cannot be
  // distinguished from one that does not exist.
  rpc GetPublishedAuthorDetail(GetPublishedAuthorDetailRequest) returns (GetPublishedAuthorDetailResponse) {}
  // Returns a label that belongs to the requested tenant. Cross-tenant and
  // missing labels are surfaced as NotFound so a foreign label cannot be
  // distinguished from one that does not exist.
  rpc GetPublishedLabelDetail(GetPublishedLabelDetailRequest) returns (GetPublishedLabelDetailResponse) {}
  // Keyword search over published series titles and synopses. An empty query
  // is invalid_argument. A token carries the Unicode-lowercased query it was
  // built for; sending it with a query that lowers to a different string is
  // invalid_argument.
  rpc SearchPublishedSeries(SearchPublishedSeriesRequest) returns (SearchPublishedSeriesResponse) {}
  // Every published series, ordered by the latest ranking snapshot of
  // behavioural signals and then by publication date, so a storefront slot can
  // take the first page and a "see more" view can keep paging into the rest.
  // A tenant whose signals have not produced a snapshot yet gets the new
  // arrivals alone, which is what the slot showed before rankings existed.
  // A ranking rebuilt between two pages moves the boundary the same way an
  // unpublished series does; the token names a position, not a snapshot.
  rpc ListRecommendedSeries(ListRecommendedSeriesRequest) returns (ListRecommendedSeriesResponse) {}
}

message MarkEpisodeAsReadRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The public ID of the episode the signed-in member finished reading.
  string episode_public_id = 2;
}

message MarkEpisodeAsReadResponse {
  // The first time this member marked the episode as read. Repeated calls keep
  // this value unchanged.
  string read_at = 1;
}

service EpisodeReadService {
  // Idempotently records that the authenticated member finished a currently
  // published episode they may read. Unpublished, foreign, missing, and
  // inaccessible episodes are all surfaced as NotFound.
  rpc MarkEpisodeAsRead(MarkEpisodeAsReadRequest) returns (MarkEpisodeAsReadResponse) {}
}

// Kinds of public catalog targets a member can follow.
enum FollowTargetType {
  FOLLOW_TARGET_TYPE_UNSPECIFIED = 0;
  FOLLOW_TARGET_TYPE_EPISODE = 1;
  FOLLOW_TARGET_TYPE_AUTHOR = 2;
  FOLLOW_TARGET_TYPE_SERIES = 3;
}

// A public catalog target. The public ID is interpreted according to type.
message FollowTarget {
  FollowTargetType type = 1;
  string public_id = 2;
}

// The current member's state for one public target. This is deliberately kept
// separate from CatalogService so catalog reads remain shared-cacheable.
message GetMyFollowStatusRequest {
  publira.types.v1.TenantContext tenant = 1;
  FollowTarget target = 2;
}

message GetMyFollowStatusResponse {
  bool is_following = 1;
}

message FollowRequest {
  publira.types.v1.TenantContext tenant = 1;
  FollowTarget target = 2;
}

message FollowResponse {
  bool is_following = 1;
}

message UnfollowRequest {
  publira.types.v1.TenantContext tenant = 1;
  FollowTarget target = 2;
}

message UnfollowResponse {
  bool is_following = 1;
}

// One currently public target followed by the authenticated member.
message MyFollow {
  // Explicitly distinguishes episode, author, and series follows in a mixed timeline.
  FollowTargetType target_type = 1;
  string target_public_id = 2;
  string followed_at = 3;
}

// Cursor pagination. Field shape and token rules: proto/README.md.
message ListMyFollowsRequest {
  publira.types.v1.TenantContext tenant = 1;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 3;
}

message ListMyFollowsResponse {
  repeated MyFollow follows = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

service FollowService {
  // Returns the authenticated member's relation to a currently public target.
  rpc GetMyFollowStatus(GetMyFollowStatusRequest) returns (GetMyFollowStatusResponse) {}
  // Idempotently follows a currently public target.
  rpc Follow(FollowRequest) returns (FollowResponse) {}
  // Idempotently removes the follow for a currently public target.
  rpc Unfollow(UnfollowRequest) returns (UnfollowResponse) {}
  // Lists only the authenticated member's follows whose targets remain public,
  // newest follow first.
  rpc ListMyFollows(ListMyFollowsRequest) returns (ListMyFollowsResponse) {}
}

// Kinds of public catalog targets a member can rate.
enum RatingTargetType {
  RATING_TARGET_TYPE_UNSPECIFIED = 0;
  RATING_TARGET_TYPE_SERIES = 1;
  RATING_TARGET_TYPE_EPISODE = 2;
}

// A public catalog target. The public ID is interpreted according to type.
message RatingTarget {
  RatingTargetType type = 1;
  string public_id = 2;
}

// Records one rating by the authenticated member. Ratings are append-only: a
// member who changes their mind sends this again and the earlier score is kept
// as history, so aggregation decides for itself which one counts (the latest
// per actor). There is no RPC to remove a rating.
message RateContentRequest {
  publira.types.v1.TenantContext tenant = 1;
  RatingTarget target = 2;
  // 1 to 5 inclusive. Anything else, including the unset 0, is
  // invalid_argument; the same range is a CHECK constraint on the stored row.
  int32 score = 3;
}

message RateContentResponse {
  // The score that was recorded, echoed back from the stored row.
  int32 score = 1;
  string rated_at = 2;
}

service RatingService {
  // Records a rating for a currently public series or episode. Cross-tenant,
  // unpublished, and missing targets are all surfaced as NotFound, matching
  // FollowService, so a rating cannot be used to probe for hidden content.
  rpc RateContent(RateContentRequest) returns (RateContentResponse) {}
}

// Kinds of public catalog targets a page view can be recorded for.
enum ContentViewTargetType {
  CONTENT_VIEW_TARGET_TYPE_UNSPECIFIED = 0;
  CONTENT_VIEW_TARGET_TYPE_SERIES = 1;
  CONTENT_VIEW_TARGET_TYPE_EPISODE = 2;
}

// A public catalog target. The public ID is interpreted according to type.
message ContentViewTarget {
  ContentViewTargetType type = 1;
  string public_id = 2;
}

// Records that a reader opened the target's detail page.
message RecordContentViewRequest {
  publira.types.v1.TenantContext tenant = 1;
  ContentViewTarget target = 2;
}

// Deliberately empty. The caller reports a view it already rendered, so there
// is nothing for it to learn back; whether the view was recorded, deduplicated,
// or dropped is not the reader's concern.
message RecordContentViewResponse {}

service ContentViewService {
  // Records one soft page view for a currently public series or episode.
  //
  // A view is recorded here rather than as a side effect of GetSeriesDetail /
  // GetEpisodeDetail, because those reads are cached by their callers: a cache
  // fill carries no reader and would otherwise mint an actor of its own, and a
  // cache hit never reaches this server at all. This RPC is called once per
  // page a reader actually opened.
  //
  // Optional authentication. A signed-in reader is attributed to their account
  // and everyone else to the publira_aid cookie, which is minted and returned
  // in Set-Cookie when the request carries none. A bearer this server cannot
  // verify does not fail the call: the view falls back to the cookie, and is
  // recorded only if one came with it, because minting an identifier for a
  // caller that presented a session of its own would open a new actor per
  // request.
  //
  // Cross-tenant, unpublished, and missing targets are all surfaced as
  // NotFound, matching FollowService and RatingService, so a view cannot be
  // used to probe for hidden content.
  rpc RecordContentView(RecordContentViewRequest) returns (RecordContentViewResponse) {}
}

// A one-time paid-episode checkout. Purchases are created only by the Stripe
// webhook after a successful payment, never by the browser's return URL.
message StartEpisodeCheckoutRequest {
  publira.types.v1.TenantContext tenant = 1;
  string episode_public_id = 2;
}

message StartEpisodeCheckoutResponse {
  string checkout_url = 1;
}

// One purchase belonging to the signed-in reader. `is_active` is evaluated by
// the API at read time: a purchase without an expiry is always active.
message MyPurchase {
  string id = 1;
  publira.types.v1.Episode episode = 2;
  publira.types.v1.Series series = 3;
  int32 price_at_purchase = 4;
  string purchased_at = 5;
  // Empty when this purchase does not expire.
  string expires_at = 6;
  bool is_active = 7;
}

// Cursor pagination. Field shape and token rules: proto/README.md.
message ListMyPurchasesRequest {
  publira.types.v1.TenantContext tenant = 1;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 3;
}

message ListMyPurchasesResponse {
  repeated MyPurchase purchases = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

// `web-host` forwards Stripe's raw request body and signature to this RPC.
// Signature verification and all purchase validation stay on the API server.
message ProcessStripeWebhookRequest {
  publira.types.v1.TenantContext tenant = 1;
  bytes payload = 2;
  string stripe_signature = 3;
}

message ProcessStripeWebhookResponse {}

service PurchaseService {
  rpc StartEpisodeCheckout(StartEpisodeCheckoutRequest) returns (StartEpisodeCheckoutResponse) {}
  // Lists only the authenticated reader's purchases in the requested tenant.
  rpc ListMyPurchases(ListMyPurchasesRequest) returns (ListMyPurchasesResponse) {}
  rpc ProcessStripeWebhook(ProcessStripeWebhookRequest) returns (ProcessStripeWebhookResponse) {}
}
