syntax = "proto3";

package publira.v1;

option go_package = "github.com/publira/publira/server/gen/publira/v1;publirav1";

import "publira/types/v1/types.proto";

message ListPublishedLabelsRequest {
  publira.types.v1.TenantContext tenant = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListPublishedLabelsResponse {
  repeated publira.types.v1.Label labels = 1;
}

// Sort order of a published series list.
enum SeriesOrder {
  // Same as SERIES_ORDER_PUBLISHED_AT_DESC.
  SERIES_ORDER_UNSPECIFIED = 0;
  // Newest published first.
  SERIES_ORDER_PUBLISHED_AT_DESC = 1;
  // Oldest published first.
  SERIES_ORDER_PUBLISHED_AT_ASC = 2;
  // By title, ascending.
  SERIES_ORDER_TITLE_ASC = 3;
  // By title, descending.
  SERIES_ORDER_TITLE_DESC = 4;
}

// Cursor pagination. Field shape and token rules: proto/README.md.
message ListPublishedSeriesRequest {
  // Removed with the move to cursor pagination.
  reserved 3;
  reserved "offset";

  publira.types.v1.TenantContext tenant = 1;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 4;
  // Sort order. A token carries the order it was built for; sending it with a
  // different order is invalid_argument, because the page it points at no
  // longer exists in the new order. Changing the order restarts at page 1.
  SeriesOrder order = 5;
}

message ListPublishedSeriesResponse {
  repeated publira.types.v1.Series series = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

message GetSeriesDetailRequest {
  publira.types.v1.TenantContext tenant = 1;
  string public_id = 2;
}

message GetSeriesDetailResponse {
  publira.types.v1.Series series = 1;
  repeated publira.types.v1.Episode episodes = 2;
}

message GetEpisodeDetailRequest {
  publira.types.v1.TenantContext tenant = 1;
  string public_id = 2;
}

// Viewer access state for an episode body on GetEpisodeDetail.
enum EpisodeAccess {
  EPISODE_ACCESS_UNSPECIFIED = 0;
  // price is 0 (public body).
  EPISODE_ACCESS_FREE = 1;
  // paid and no valid purchase/ticket grant.
  EPISODE_ACCESS_LOCKED = 2;
  // valid purchase or active access ticket.
  EPISODE_ACCESS_ENTITLED = 3;
}

// Episode detail for public viewing.
// Body/content is represented as ordered images for the reader UI.
message GetEpisodeDetailResponse {
  publira.types.v1.Episode episode = 1;
  publira.types.v1.Series series = 2;
  // Body images. Empty when access is locked (paid, no purchase/ticket).
  repeated publira.types.v1.EpisodeImage images = 3;
  // Viewer access state for this episode.
  EpisodeAccess access = 4;
}

// A creator that currently has at least one published series.
message PublishedAuthor {
  string public_id = 1;
  string name = 2;
  string profile_text = 3;
  string icon_image_url = 4;
  int64 icon_image_file_size_bytes = 5;
  string icon_image_updated_at = 6;
  int32 published_series_count = 7;
}

// Cursor pagination. Field shape and token rules: proto/README.md.
// Sorted by creator name, then id. There is no order field: name order is the
// only list the storefront needs, and a later selectable order would have to
// carry its name in the token (see proto/README.md).
message ListPublishedAuthorsRequest {
  publira.types.v1.TenantContext tenant = 1;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 3;
}

message ListPublishedAuthorsResponse {
  repeated PublishedAuthor authors = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

// Cursor pagination for the author's published series. Field shape and token
// rules: proto/README.md. Sorted by title, then id. There is no order field:
// title order is the only series list the author page needs, and a later
// selectable order would have to carry its name in the token.
message GetPublishedAuthorDetailRequest {
  publira.types.v1.TenantContext tenant = 1;
  string public_id = 2;
  // Max series in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 3;
  // Opaque token from a previous response. Empty for the first page.
  string token = 4;
}

message GetPublishedAuthorDetailResponse {
  PublishedAuthor author = 1;
  // One page of published series credited to this author, title ascending.
  repeated publira.types.v1.Series series = 2;
  // Token for the previous series page. Empty on the first page.
  string previous_token = 3;
  // Token for the next series page. Empty on the last page.
  string next_token = 4;
}

service CatalogService {
  rpc ListPublishedLabels(ListPublishedLabelsRequest) returns (ListPublishedLabelsResponse) {}
  rpc ListPublishedSeries(ListPublishedSeriesRequest) returns (ListPublishedSeriesResponse) {}
  rpc GetSeriesDetail(GetSeriesDetailRequest) returns (GetSeriesDetailResponse) {}
  // Returns only currently published episodes in the requested tenant.
  // Unpublished, cross-tenant, and missing episodes are all surfaced as NotFound
  // to prevent content existence leakage.
  rpc GetEpisodeDetail(GetEpisodeDetailRequest) returns (GetEpisodeDetailResponse) {}
  rpc ListPublishedAuthors(ListPublishedAuthorsRequest) returns (ListPublishedAuthorsResponse) {}
  // Returns a creator only when they have at least one currently published
  // series in the requested tenant. Cross-tenant, unpublished, and missing
  // authors are all surfaced as NotFound so an unpublished author cannot be
  // distinguished from one that does not exist.
  rpc GetPublishedAuthorDetail(GetPublishedAuthorDetailRequest) returns (GetPublishedAuthorDetailResponse) {}
}
