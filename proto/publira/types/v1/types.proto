syntax = "proto3";

package publira.types.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/types/v1;publirattypesv1";

// Common data models shared across services

// TenantContext identifies a tenant for internal RPC wiring.
// tenant_id is the primary key (UUID), not the public-facing short code.
//
// Every publira.v1 and publira.admin.v1 RPC that names a tenant this way
// refuses a suspended one before it does anything else, with
// failed_precondition and the ErrorInfo reason TENANT_SUSPENDED. That covers
// signing in and every request made with a session: a session is not ended by
// suspension, and is honoured again once the tenant is resumed.
message TenantContext {
  string tenant_id = 1;
}

message User {
  string public_id = 1;
  string name = 2;
  string role = 3;
  // The reader's own birth date as YYYY-MM-DD, empty when they have given
  // none. Set where a User stands for the account the request authenticated
  // or signed in as, which is GetMe, UpdateMe, Login, LoginWithIdToken and
  // FinishPasskeyLogin; empty everywhere a User names someone the caller is merely looking at, so
  // a console listing accounts never carries it.
  string birth_date = 4;
  // The account's email address, under the same rule as birth_date: set by the
  // public API's GetMe, UpdateMe, Login, LoginWithIdToken and
  // FinishPasskeyLogin, so a form can offer the reader their own address, and
  // empty wherever a User names someone else.
  string email = 5;
  // The account's icon. Set where the public API answers with the caller's
  // own account as GetMe reads it — GetMe, UpdateMe, UploadMyIcon,
  // SelectMyIcon, DeleteMyIcon, Login, LoginWithIdToken and
  // FinishPasskeyLogin — and empty wherever a User names someone else. The
  // variant list is empty, and icon_image_updated_at with it, for an account
  // that shows no icon.
  //
  // The icon is either one the reader uploaded or one of the tenant's presets
  // (ReaderIconPreset), and the variants carry whichever it is, so a client
  // renders both alike.
  string icon_image_updated_at = 6;
  repeated UserIconVariant icon_image_variants = 7;
  // The ReaderIconPreset.id of the preset the account shows, under the same
  // rule as icon_image_variants, so a preset picker can mark the one in use.
  // Empty for an account that shows an upload or no icon.
  string icon_preset_id = 8;
}

// One stored rendition of a reader's icon, in the shape the tenant's branding
// images use. A replaced icon is stored under a new URL rather than over the
// old one, and the old URL stops answering once it is replaced or removed, so
// a page holding one has to read the account again rather than keep it.
message UserIconVariant {
  string label = 1;
  string url = 2;
  string content_type = 3;
  int32 width = 4;
  int32 height = 5;
  int64 file_size_bytes = 6;
}

// AccessToken is a JWT issued by Login. Clients send it as Authorization: Bearer.
message AccessToken {
  string token = 1;
  string expires_at = 2;
}

// One entry of the creator-role vocabulary a tenant curates: original author,
// artist, writer, supervisor, and whatever else its catalogue needs. It orders
// the credits everywhere they are shown, so the leading role leads without
// anyone ordering each series by hand.
message CreatorRole {
  string public_id = 1;
  string name = 2;
  // The role's primary key, which the admin API addresses it by.
  string id = 3;
}

// Where an episode credit was written. Series rows are baked onto an episode
// when it is created; episode rows are additions made for that episode alone.
enum CreatorCreditSource {
  CREATOR_CREDIT_SOURCE_UNSPECIFIED = 0;
  CREATOR_CREDIT_SOURCE_SERIES = 1;
  CREATOR_CREDIT_SOURCE_EPISODE = 2;
}

message Creator {
  // 3 held `role` as a free string. The field keeps its name and becomes a
  // CreatorRole, so the old number is reserved to keep a client from reading
  // the new value as the old one.
  reserved 3;

  string public_id = 1;
  string name = 2;
  string profile_text = 4;
  string icon_image_url = 5;
  int64 icon_image_file_size_bytes = 6;
  string icon_image_updated_at = 7;
  // The role this credit is held in. Set where a Creator stands for a credit
  // on a series; empty where it stands for the person alone, as the creator
  // console reads them.
  CreatorRole role = 8;
  // Set when this creator stands for an episode credit. It lets an editor see
  // which rows are local additions that a later range edit must leave alone.
  CreatorCreditSource source = 9;
  // The creator's primary key. The admin API addresses a creator by it, and
  // the reader API sets it on a series' credits so a reader can follow them.
  string id = 10;
}

message Label {
  string public_id = 1;
  string name = 2;
  string eye_catch_image_updated_at = 3;
  repeated SeriesEyeCatchVariant eye_catch_image_variants = 4;
  // The label's primary key, which the admin API addresses it by.
  string id = 5;
}

message SeriesEyeCatchVariant {
  // Label format: "{ratio}_{width}w" (for example "portrait_1200w",
  // "landscape_1600w").
  string label = 1;
  // Intended use: portrait / square / landscape / og.
  string variant_type = 7;
  string url = 2;
  string content_type = 3;
  int32 width = 4;
  int32 height = 5;
  int64 file_size_bytes = 6;
}

// ImageCropRect names the part of an uploaded image a caller wants kept. It
// is stated in pixels of that upload, with the origin at its top-left corner,
// and it stands on its own: nothing records the image it was measured
// against, so a rectangle only means anything alongside the bytes it came
// with.
//
// The rectangle says where the cut is taken, not what shape comes out. The
// server still fits it to the target aspect ratio, so a selection that is a
// few pixels off that ratio delivers the ratio delivery expects.
message ImageCropRect {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
}

// Whether a series is still gaining episodes. Stored on
// series_listings.status, so it is the tenant's statement about the series
// rather than something derived from the episodes it happens to hold.
enum SeriesStatus {
  SERIES_STATUS_UNSPECIFIED = 0;
  // New episodes are still coming.
  SERIES_STATUS_ONGOING = 1;
  // The series has ended; no further episode is planned.
  SERIES_STATUS_COMPLETED = 2;
  // Paused, with more episodes intended.
  SERIES_STATUS_HIATUS = 3;
}

// Who a series is meant for. A client interposes its own confirmation on a
// rated series; whether the reader has to prove an age is a separate tenant
// setting.
enum SeriesAgeRating {
  SERIES_AGE_RATING_UNSPECIFIED = 0;
  // No age restriction.
  SERIES_AGE_RATING_ALL = 1;
  SERIES_AGE_RATING_R15 = 2;
  SERIES_AGE_RATING_R18 = 3;
}

// One entry of the classification a tenant curates. The genre list is short,
// ordered by the tenant, and managed from the console; `public_id` is what a
// filter names, so a rename does not move it.
message Genre {
  string public_id = 1;
  // The name of the translation in the locale the read asked for, else the
  // tenant's default locale's, else the oldest one. The console's reads ask
  // for the default locale.
  string name = 2;
  // Unique within the tenant, derived from the name a reader in the tenant's
  // default locale is shown, by every save that changes that name. It
  // identifies the name rather than standing in for it: no save can give two
  // genres names that differ there by case or spacing alone. It does not
  // change with the locale a read asks for, nor when the tenant changes its
  // default locale.
  string slug = 3;
  // The eye-catch the console uploaded, as a label carries one. Filled by the
  // genre RPCs themselves; a genre listed on a series carries names only.
  string eye_catch_image_updated_at = 4;
  repeated SeriesEyeCatchVariant eye_catch_image_variants = 5;
  // The genre's primary key, which the admin API addresses it by.
  string id = 6;
  // The locale of the translation `name` comes from, named the way
  // Series.locale is: a public read names the one it served, and the
  // console's reads leave it empty.
  string locale = 7;
  // Every name the genre has, oldest first. Filled by the console's genre RPCs
  // alone.
  repeated GenreTranslation translations = 8;
}

// One locale's name of a genre.
message GenreTranslation {
  string locale = 1;
  string name = 2;
  // RFC 3339.
  string created_at = 3;
  string updated_at = 4;
}

// A free-form label written on the series form. Tags have no console of their
// own and no order: a tag exists because a series carries it, and stops
// existing when the last one lets it go. It is addressed by slug, which is why
// it carries no public_id.
message Tag {
  string name = 1;
  string slug = 2;
}

message Series {
  string public_id = 1;
  string title = 2;
  string synopsis = 3;
  Label label = 4;
  repeated Creator creators = 5;
  int32 reading_period_hours = 6;
  bool is_published = 11;
  string published_at = 12;
  // Fields 7 and 8 are removed (formerly eye_catch_image_url and
  // eye_catch_image_file_size_bytes).
  reserved 7, 8;
  string eye_catch_image_updated_at = 9;
  repeated SeriesEyeCatchVariant eye_catch_image_variants = 10;
  SeriesStatus status = 13;
  // The weekdays a new episode is expected, as EXTRACT(DOW) numbers: 0 is
  // Sunday and 6 is Saturday. Ascending, without duplicates. Empty means the
  // series keeps no weekly schedule, which is a statement rather than a gap.
  repeated int32 schedule_weekdays = 14;
  SeriesAgeRating age_rating = 15;
  // In the tenant's genre order, not the order they were assigned in.
  repeated Genre genres = 16;
  // By name, so a series presents its tags the same way every time.
  repeated Tag tags = 17;
  // How many published episodes of this series a reader can open without
  // paying: the ones priced at 0, and the priced ones a free window is open
  // on at the moment of the read. It is counted per read rather than stored,
  // so an episode leaving its free window stops counting the moment it does,
  // and a series with no free episode carries 0 rather than nothing.
  int32 free_episode_count = 18;
  // What the series is rated, to one decimal on the 1-5 scale its episodes are
  // reacted to on. A reader never rates a series directly: the figure is the
  // reaction points its episodes collected over the reads they were finished
  // on, pulled towards the tenant's own mean while few readers have finished
  // any of them, so a series two people read does not top the list at 5.0.
  //
  // 0 means the series has no figure yet rather than the worst one: nobody has
  // reacted to it, or the reactions have not reached the daily aggregates the
  // figure is derived from. A client shows nothing in that case rather than a
  // zero. Set on the reads where a Series stands for one series a reader
  // opened, and empty in the lists that carry a series as a link.
  double rating_average = 19;
  // How many readers are behind `rating_average`. A reader counts once for the
  // series however many of its episodes they reacted to, so this is a
  // headcount and not a count of reactions. It is set and cleared together
  // with the figure.
  int64 rating_count = 20;
  // Which surfaces the series may be shown on. Set on the console's reads;
  // SURFACE_AVAILABILITY_UNSPECIFIED on the storefront's and the app's, where
  // the catalog has already left out every series the caller may not show.
  SurfaceAvailability availability = 21;
  string id = 22;
  // Where the rental period of each new episode in the series starts, as
  // `reading_period_hours` is for the permanent copy's. Zero states none. Set
  // on the console's reads and 0 on the public ones.
  int32 rental_period_hours = 23;
  // The locale of the translation `title` and `synopsis` come from. A public
  // read names the one it served, which differs from the one asked for when
  // the series has no translation in that locale, and may be a locale the
  // tenant no longer offers when the series has none in its default locale
  // either. Empty on the console's reads.
  string locale = 24;
  // What StartSeriesRemainderCheckout takes off the sum of the prices it
  // sells, in whole percent from 1 to 99. Zero sells the rest of the series at
  // that sum. Set on the console's reads and 0 on the public ones, where
  // GetSeriesEpisodeAccess quotes the rest of the series to the reader.
  int32 bundle_discount_percent = 25;
}

message Episode {
  string public_id = 1;
  string title = 2;
  int32 order_index = 3;
  int32 price = 4;
  int32 reading_period_hours = 5;
  string status = 6;
  string scheduled_at = 7;
  string published_at = 8;
  // Who this episode is credited to, in role priority order. Every episode
  // carries its own credits, baked from the series when it was created, so an
  // artist who took over at episode 12 is on episode 12 onwards and not on the
  // eleven before it. Set where an Episode stands for one episode a reader or
  // an editor opened; empty in the lists that carry an episode as a link.
  repeated Creator creators = 9;
  // How many readers have rated this episode. Set on the same reads `creators`
  // is: a rating is given at the end of an episode, so the figure belongs to
  // the episode a reader opened rather than to every link that names it.
  //
  // It counts readers rather than the points they gave, so it means the same
  // thing whichever press mode the tenant chose. It is the stored tally rather
  // than a count taken at read time, so the episode read carries one more
  // column instead of one more scan.
  int64 rating_count = 10;
  // Which way the pages are turned, and the zero-based index of the page from
  // which two pages share a screen: every page before it stands alone. Both are
  // resolved — the episode's own value where it states one, and its series'
  // where it does not — so a viewer lays the body out from these two fields
  // alone. Set on the reads that carry `creators`; READING_DIRECTION_UNSPECIFIED
  // and 0 in the lists that carry an episode as a link.
  //
  // The index may lie past the last page when the series states it for longer
  // episodes than this one, and the episode is then laid out without a spread.
  ReadingDirection reading_direction = 11;
  int32 spread_start_index = 12;
  // The episode's own availability, and SURFACE_AVAILABILITY_UNSPECIFIED
  // where it follows its series. Set on the console's reads and unspecified on
  // the public ones, like Series.availability. It is the override rather than
  // a resolved value because the series bounds it: an episode is shown only
  // where its series is too, so a series and an episode naming different
  // single surfaces leave the episode shown nowhere, which no one value says.
  SurfaceAvailability availability = 13;
  // Which surfaces the episode may be bought on, resolved: the episode's own
  // value, else its series', else the tenant's. Set on GetEpisodeDetail, on
  // the episodes GetSeriesDetail lists, and on the console's GetEpisode and
  // the episode writes that answer in its shape; SURFACE_AVAILABILITY_UNSPECIFIED
  // elsewhere. A client offers the checkout only where this names its own
  // surface, because StartEpisodeCheckout refuses it anywhere else.
  SurfaceAvailability purchase_availability = 14;
  string id = 15;
  // RFC3339 end of the free window open on this episode, and empty when none
  // is. It is what GetEpisodeDetailResponse.free_until reports for the same
  // episode, so a row in a list can say how long a priced episode stays free
  // without the episode being opened. `price` stays the stored price meanwhile,
  // because that is what the episode costs again once the window closes.
  // 9999-12-31T00:00:00Z is a window the series' free-after-publication rule
  // opened, which has no end of its own: the episode is free for as long as
  // the rule covers it.
  //
  // Set on the public reads that carry `price`: GetEpisodeDetail, the episodes
  // GetSeriesDetail lists, GetMySeriesProgress and ListMyRecentSeries. Empty
  // on the console's reads, and in the lists that carry an episode as a link
  // without a price.
  string free_until = 16;
  // The episode's own eye-catch, in the shape Series carries one. Empty when
  // the episode has none, which is not an error to show: the series' eye-catch
  // stands in for it. Set on GetEpisodeDetail, on the episodes GetSeriesDetail
  // lists, on the member's own lists of episodes (ListMyEpisodeReads,
  // ListMyRecentSeries and ListMyFollowUpdates), and on the console's episode
  // reads and the episode writes that answer in their shape; empty elsewhere.
  string eye_catch_image_updated_at = 17;
  repeated SeriesEyeCatchVariant eye_catch_image_variants = 18;
  // The rental: what renting the episode costs, in the minor unit `price` is
  // in, and how long the rental opens it. Both are 0 on an episode that is not
  // rented, and both are set on one that is: `price` then stays what the
  // permanent copy costs, and `reading_period_hours` its expiry, if any. A
  // rental is always cheaper than the permanent copy.
  //
  // Set on GetEpisodeDetail, on the episodes GetSeriesDetail lists, and on the
  // console's episode reads and writes; 0 elsewhere.
  int32 rental_price = 19;
  int32 rental_period_hours = 20;
  // The locale of the translation `title` comes from, named the way
  // Series.locale is: a public read names the one it served, and the
  // console's reads leave it empty.
  string locale = 21;
  // The campaign price open on the episode: what its permanent copy sells for
  // until `campaign_ends_at` (RFC3339), in the minor unit `price` is in, and
  // what StartEpisodeCheckout charges for it meanwhile. `price` stays the
  // stored price, because that is what the permanent copy costs again once the
  // campaign ends, and the rental keeps `rental_price`. A campaign price is
  // always below `price`. Both are 0 and empty when no campaign is open, and a
  // free window open over a campaign still opens the episode to everyone.
  //
  // Set on GetEpisodeDetail and on the episodes GetSeriesDetail lists; 0 and
  // empty elsewhere, the console's reads included.
  int32 campaign_price = 22;
  string campaign_ends_at = 23;
  // What the episode costs in the tenant's coins, which CoinService.
  // PayEpisodeWithCoins spends: coin_price for the permanent copy, at
  // campaign_price while a campaign is open and at price otherwise, and
  // coin_rental_price for the rental, at rental_price. Each is that price
  // divided by the value of one coin, rounded up. coin_name is the tenant's
  // word for its coins in the reader's locale, so a client never names them
  // itself.
  //
  // All three are 0 and empty on a free episode, and coin_rental_price on one
  // that is not rented. They are 0 and empty too while the platform does not
  // allow tenant coins or the tenant has not turned its coins on, and a client
  // offers coins only where coin_price or coin_rental_price is set.
  //
  // Set on GetEpisodeDetail and on the episodes GetSeriesDetail lists; 0 and
  // empty elsewhere, the console's reads included.
  int32 coin_price = 24;
  int32 coin_rental_price = 25;
  string coin_name = 26;
}

// Which way the pages of a work are turned. A series states it for every one
// of its episodes, and an episode may state its own.
enum ReadingDirection {
  READING_DIRECTION_UNSPECIFIED = 0;
  // The reader turns from right to left, the binding of most manga. It is what
  // a series nobody has set is read in.
  READING_DIRECTION_RIGHT_TO_LEFT = 1;
  READING_DIRECTION_LEFT_TO_RIGHT = 2;
}

message EpisodeImage {
  string id = 1;
  string image_url = 2;
  string content_type = 3;
  int64 file_size_bytes = 4;
  int32 display_order = 5;
  int32 width = 6;
  int32 height = 7;
}

// A stored tenant branding image, in the shape the eye-catch images already
// use. `variant_type` names what the image is for — `logo`, `icon`, or
// `sign_in` — the way the eye-catch variants name their aspect ratio; it is not
// a size. Sizes are the image server's job: it resizes on request from the
// stored master.
message TenantImageVariant {
  string label = 1;
  string url = 2;
  string content_type = 3;
  int32 width = 4;
  int32 height = 5;
  int64 file_size_bytes = 6;
  string variant_type = 7;
}

message TenantTheme {
  // 4 held `logo_url` and 29 held `icon_url`, single URL strings. Both are
  // stored tenant images now and are carried the way `Series` carries its
  // eye-catch — variants plus the image's `updated_at` — so the old names are
  // reserved to keep a client from reading the new values as the old ones.
  reserved 4, 29;
  reserved "logo_url", "icon_url";

  string primary_color = 1;
  string secondary_color = 2;
  string accent_color = 3;
  string background_color = 5;
  string foreground_color = 6;
  string surface_color = 7;
  string surface_foreground_color = 8;
  string card_color = 9;
  string card_foreground_color = 10;
  string popover_color = 11;
  string popover_foreground_color = 12;
  string primary_foreground_color = 13;
  string secondary_foreground_color = 14;
  string accent_foreground_color = 15;
  string muted_color = 16;
  string muted_foreground_color = 17;
  string border_color = 18;
  string input_color = 19;
  string ring_color = 20;
  string success_color = 21;
  string success_foreground_color = 22;
  string warning_color = 23;
  string warning_foreground_color = 24;
  string destructive_color = 25;
  string destructive_foreground_color = 26;
  string info_color = 27;
  string info_foreground_color = 28;
  // Tenant icon, uploaded and stored independently from the logo. The
  // variant list is empty when the tenant has not set one.
  string icon_image_updated_at = 30;
  repeated TenantImageVariant icon_image_variants = 31;
  // Tenant logo. The variant list is empty when the tenant has not set one.
  string logo_image_updated_at = 32;
  repeated TenantImageVariant logo_image_variants = 33;
  // A CSS font-family list for reading text. Empty uses the brief's default stack.
  string serif_font_family = 34;
  // A CSS font-family list for interface text. Empty uses the brief's default stack.
  string sans_font_family = 35;
  // The image beside the storefront's sign-in and sign-up forms, uploaded for
  // that panel alone. The variant list is empty when the tenant has not set
  // one.
  string sign_in_image_updated_at = 36;
  repeated TenantImageVariant sign_in_image_variants = 37;
}

// A page as seen through one of its translations, which supplies the title and
// the published version.
message Page {
  string id = 1;
  string slug = 2;
  string title = 3;
  string published_version_id = 4;
  string created_at = 5;
  string updated_at = 6;
  bool display_in_footer = 7;
  // The locale of the translation the title and published version come from.
  // A public read names the one it served, which differs from the one asked
  // for when the page has no published translation in that locale.
  string locale = 8;
}

// One locale's rendering of a page: its title and the version of its own
// history that is live.
message PageTranslation {
  string id = 1;
  string page_id = 2;
  string locale = 3;
  string title = 4;
  string published_version_id = 5;
  string created_at = 6;
  string updated_at = 7;
}

message PageVersion {
  string id = 1;
  string page_id = 2;
  int32 version_number = 3;
  string content_markdown = 4;
  string author_user_id = 5;
  string status = 6;
  string publish_at = 7;
  string created_at = 8;
  string published_at = 9;
  // When the last publication of this version asked every reader to agree to
  // the page again (AdminPagesService.PublishVersion's require_agreement).
  // Empty where no publication of it did.
  string agreement_required_at = 10;
}
// How comments a reader writes on an episode are published. The tenant states
// it once (tenant_config.comment_mode) and one series may state its own
// instead (series_listings.comment_mode), so a storefront deciding whether an
// episode page offers commenting at all reads the mode of the series it is in.
enum CommentMode {
  COMMENT_MODE_UNSPECIFIED = 0;
  // Commenting is off: the storefront shows no comment section, and posting is
  // refused. This is what a tenant that has never chosen gets.
  COMMENT_MODE_DISABLED = 1;
  // A posted comment is readable by everyone as soon as it is stored.
  COMMENT_MODE_IMMEDIATE = 2;
  // A posted comment waits for a staff approval before anyone but its author
  // can read it.
  COMMENT_MODE_APPROVAL_REQUIRED = 3;
}

// The client a public read or write that acts on a work is made from: the
// catalog, and the reader's own follows, reading history, library, ratings,
// comments, and views. A work may be withheld from either of them
// (SurfaceAvailability), and the server answers each one with the works it may
// show, so the rule lives on the server rather than in two clients filtering a
// full catalog.
enum ClientSurface {
  // Answered as CLIENT_SURFACE_WEB, so a caller that names nothing keeps
  // seeing what the storefront sees.
  CLIENT_SURFACE_UNSPECIFIED = 0;
  // The tenant's web storefront.
  CLIENT_SURFACE_WEB = 1;
  // The tenant's mobile app.
  CLIENT_SURFACE_APP = 2;
}

// How a tenant's app sells an episode the app may sell
// (tenant_config.app_purchase_route). Where an episode may be bought at all is
// SurfaceAvailability; this says only which purchase the app offers for it.
enum AppPurchaseRoute {
  // Never answered by a read. A write naming it is rejected: the tenant states
  // one of the two routes.
  APP_PURCHASE_ROUTE_UNSPECIFIED = 0;
  // The web checkout, opened in the system browser. What every tenant sells
  // through until it chooses otherwise.
  APP_PURCHASE_ROUTE_EXTERNAL_CHECKOUT = 1;
  // The App Store's or Google Play's own in-app purchase.
  APP_PURCHASE_ROUTE_STORE = 2;
}

// Which surfaces a work may be shown on, or an episode bought on.
//
// Where a work is shown, a series states it (series.availability) and an
// episode may narrow it (episodes.availability): an episode is shown only where
// its series is, so its own value can take it off a surface but never put it on
// one its series is kept off. A work kept off a surface is absent from every
// list, search, ranking, and recommendation read that surface makes, and from
// the reader's own lists read there, and a read or write of it by public ID
// answers not_found exactly as it does for an unpublished one.
//
// Where an episode is bought, the tenant states a default
// (tenant_config.purchase_availability), and a series and then an episode may
// each replace the value above it rather than narrow it.
enum SurfaceAvailability {
  // On a series write, the default the column carries: both surfaces. On an
  // episode, following its series.
  SURFACE_AVAILABILITY_UNSPECIFIED = 0;
  // The storefront and the app.
  SURFACE_AVAILABILITY_ALL = 1;
  // The storefront alone.
  SURFACE_AVAILABILITY_WEB = 2;
  // The app alone.
  SURFACE_AVAILABILITY_APP = 3;
}

// A volume: a run of a series' episodes sold together, at a price of its own,
// in one checkout. Buying it opens every episode it holds, which the episode
// reads then report as EPISODE_ENTITLEMENT_SOURCE_PURCHASE.
message Volume {
  // The volume's primary key, which StartVolumeCheckout addresses it by.
  string id = 1;
  string public_id = 2;
  string title = 3;
  // Where the volume stands among its series' volumes, ascending.
  int32 order_index = 4;
  // What the volume costs, in the minor unit of the tenant currency, as
  // Episode.price is. Never 0: a volume is never free.
  int32 price = 5;
  // The episodes the volume holds, by Episode.id, in the volume's own order.
  // On a public read, only the episodes that read lists for the calling
  // surface; a volume none of whose episodes it lists is not in the answer.
  repeated string episode_ids = 6;
  // The cover, stored the way a series eye-catch is. Empty when the volume has
  // none, and the series' eye-catch stands in for it then.
  string cover_image_updated_at = 7;
  repeated SeriesEyeCatchVariant cover_image_variants = 8;
}

// The rest of a series, bought in one StartSeriesRemainderCheckout: every
// episode the reader could buy and did not hold when the checkout started.
// Buying it opens each of them, which the episode reads then report as
// EPISODE_ENTITLEMENT_SOURCE_PURCHASE.
message SeriesBundle {
  // The bundle's primary key, a UUID.
  string id = 1;
  // How many episodes the checkout sold.
  int32 episode_count = 2;
  // The series' bundle discount the checkout took off, in whole percent; 0
  // when it took none.
  int32 discount_percent = 3;
}

// A pack of the tenant's coins as a purchase bought it: the coins and the bonus
// coins the reader was shown when the checkout or the store's payment sheet
// opened, which are what the purchase granted however the pack has changed
// since.
message PurchasedCoinPack {
  // The pack's primary key, a UUID.
  string id = 1;
  string public_id = 2;
  int32 coins = 3;
  int32 bonus_coins = 4;
}

// Which of an episode's two sales a purchase is (purchases.kind).
enum PurchaseKind {
  // On a request, the permanent copy, which is what every client that names no
  // kind buys.
  PURCHASE_KIND_UNSPECIFIED = 0;
  // The permanent copy, at Episode.price, which opens the episode for its
  // reading period if it has one and for good if it does not. A store purchase
  // and a grant staff record are always this.
  PURCHASE_KIND_PURCHASE = 1;
  // The rental, at Episode.rental_price, which opens the episode for
  // Episode.rental_period_hours.
  PURCHASE_KIND_RENTAL = 2;
}

// What a tenant lets a reader show as an icon (tenant_config.reader_icon_policy).
enum ReaderIconPolicy {
  READER_ICON_POLICY_UNSPECIFIED = 0;
  // A reader uploads an image of their own. This is what a tenant that has
  // never chosen gets.
  READER_ICON_POLICY_UPLOAD = 1;
  // A reader picks one of the tenant's presets and uploads nothing.
  READER_ICON_POLICY_PRESET = 2;
  // No reader shows an icon.
  READER_ICON_POLICY_DISABLED = 3;
}

// Where a tenant's storefront loads its Google tag from
// (tenant_analytics_settings.serving_mode).
enum GoogleTagServingMode {
  GOOGLE_TAG_SERVING_MODE_UNSPECIFIED = 0;
  // The tag is loaded from Google and sends its hits there. This is what a
  // tenant that has never chosen gets.
  GOOGLE_TAG_SERVING_MODE_GOOGLE = 1;
  // The tag is loaded from, and sends its hits to, the tenant's server-side
  // Tag Manager container at server_container_url.
  GOOGLE_TAG_SERVING_MODE_SERVER_CONTAINER = 2;
  // The tag is loaded from, and sends its hits to, gateway_path on the
  // storefront's own origin, which Publira proxies to Google, or to the
  // tenant's server container when server_container_url is set.
  GOOGLE_TAG_SERVING_MODE_GATEWAY = 3;
}

// Whether a tenant's storefront asks a reader before its Google tag stores
// anything (tenant_analytics_settings.consent_mode). The mode applies to every
// reader of the tenant, wherever they read from.
enum GoogleTagConsentMode {
  GOOGLE_TAG_CONSENT_MODE_UNSPECIFIED = 0;
  // The tag runs as soon as the page loads, and the tenant discloses it on its
  // privacy page. This is what a tenant that has never chosen gets.
  GOOGLE_TAG_CONSENT_MODE_NOT_REQUIRED = 1;
  // The storefront asks the reader before the tag runs, and sends Google
  // Consent Mode v2 signals that match the answer.
  GOOGLE_TAG_CONSENT_MODE_OPT_IN = 2;
  // The storefront sends Google Consent Mode v2 defaults of denied and shows
  // no banner of its own: the tenant's consent tool, running inside its Tag
  // Manager container, collects the answer and updates the signals. Requires
  // a Tag Manager container ID.
  GOOGLE_TAG_CONSENT_MODE_EXTERNAL = 3;
}

// An icon the tenant provides for its readers to pick. A reader's account
// that shows it carries the same variants in User.icon_image_variants.
message ReaderIconPreset {
  string id = 1;
  string created_at = 2;
  // The stored renditions, largest first.
  repeated UserIconVariant variants = 3;
}

// Which of a tenant's age ratings a reader has to prove an age for
// (tenant_config.age_verification). The values are the rungs of one ladder
// rather than a switch per rating: a tenant that gated `r15` while leaving
// `r18` open would be stating a policy nobody means.
enum AgeVerification {
  AGE_VERIFICATION_UNSPECIFIED = 0;
  // Nothing is proven. A rated series still carries its rating, and a client
  // still interposes its own confirmation on one, but no birth date is asked
  // for and none is checked. This is what a tenant that has never chosen gets.
  AGE_VERIFICATION_NONE = 1;
  // `r18` series demand a proven 18. `r15` series are left to the client's
  // confirmation.
  AGE_VERIFICATION_R18 = 2;
  // `r15` series demand a proven 15 and `r18` series a proven 18.
  AGE_VERIFICATION_R15_AND_R18 = 3;
}

// How long each kind of record that expires is kept before a purge batch
// deletes it, in whole days. Each value is from 1 to 36500, except
// content_event_days.
message RetentionPeriods {
  // A comment its author withdrew, counted from the withdrawal.
  int32 withdrawn_comment_days = 1;
  // A raw engagement event, counted from when it occurred. From 30 to 36500:
  // the recommendations are built from the last 28 calendar days of events
  // in the tenant's time zone, and each day's statistics from its events once
  // the day has ended.
  int32 content_event_days = 2;
  // A daily ranking snapshot, counted from the end of its period. The newest
  // period is kept whatever its age.
  int32 daily_ranking_snapshot_days = 3;
  // A weekly ranking snapshot, counted like a daily one.
  int32 weekly_ranking_snapshot_days = 4;
}

// What a subscription plan opens while it is paid
// (subscription_plans.scope).
enum SubscriptionPlanScope {
  // Never answered by a read. A write naming it is rejected: a plan states
  // one of the three.
  SUBSCRIPTION_PLAN_SCOPE_UNSPECIFIED = 0;
  // Every episode of the tenant. Such a plan names no labels and no series.
  SUBSCRIPTION_PLAN_SCOPE_ALL = 1;
  // Every episode of the series of the labels the plan names.
  SUBSCRIPTION_PLAN_SCOPE_LABEL = 2;
  // Every episode of the series the plan names.
  SUBSCRIPTION_PLAN_SCOPE_SERIES = 3;
}

// The unit a subscription plan's recurring price is billed every so many of,
// as its Stripe Price states it (subscription_plans.recurring_interval).
enum SubscriptionInterval {
  SUBSCRIPTION_INTERVAL_UNSPECIFIED = 0;
  SUBSCRIPTION_INTERVAL_DAY = 1;
  SUBSCRIPTION_INTERVAL_WEEK = 2;
  SUBSCRIPTION_INTERVAL_MONTH = 3;
  SUBSCRIPTION_INTERVAL_YEAR = 4;
}

// A subscription's state, as Stripe last reported it (subscriptions.status).
// Each value is Stripe's own status of the same name.
enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  // The first payment has not gone through yet, such as one waiting on the
  // reader's 3-D Secure.
  SUBSCRIPTION_STATUS_INCOMPLETE = 1;
  // The first payment never went through, and the subscription was dropped.
  SUBSCRIPTION_STATUS_INCOMPLETE_EXPIRED = 2;
  SUBSCRIPTION_STATUS_TRIALING = 3;
  // Paid up.
  SUBSCRIPTION_STATUS_ACTIVE = 4;
  // A renewal payment failed, and Stripe is retrying it.
  SUBSCRIPTION_STATUS_PAST_DUE = 5;
  // Ended: canceled at once, at the end of its period, or after its retries
  // ran out.
  SUBSCRIPTION_STATUS_CANCELED = 6;
  // Stripe's retries ran out and the tenant's Stripe settings keep the
  // subscription open, unpaid.
  SUBSCRIPTION_STATUS_UNPAID = 7;
  SUBSCRIPTION_STATUS_PAUSED = 8;
}
