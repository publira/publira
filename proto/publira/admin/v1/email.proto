syntax = "proto3";

package publira.admin.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/admin/v1;publiraadminv1";

import "publira/types/v1/types.proto";

enum SecretUpdateMode {
  SECRET_UPDATE_MODE_UNSPECIFIED = 0;
  SECRET_UPDATE_MODE_UNCHANGED = 1;
  SECRET_UPDATE_MODE_REPLACE = 2;
  SECRET_UPDATE_MODE_CLEAR = 3;
}

enum TestEmailRecipientType {
  TEST_EMAIL_RECIPIENT_TYPE_UNSPECIFIED = 0;
  TEST_EMAIL_RECIPIENT_TYPE_SELF = 1;
  TEST_EMAIL_RECIPIENT_TYPE_CUSTOM = 2;
}

message TenantEmailSettings {
  bool smtp_override_enabled = 1;
  string host = 2;
  int32 port = 3;
  string username = 4;
  string encryption = 5;
  string from_name = 6;
  string from_address = 7;
  string reply_to = 8;
  bool has_password = 9;
}

message GetTenantEmailSettingsRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message GetTenantEmailSettingsResponse {
  TenantEmailSettings settings = 1;
}

message UpdateTenantEmailSettingsRequest {
  publira.types.v1.TenantContext tenant = 1;
  bool smtp_override_enabled = 2;
  string host = 3;
  int32 port = 4;
  string username = 5;
  SecretUpdateMode password_update_mode = 6;
  string password = 7;
  string encryption = 8;
  string from_name = 9;
  string from_address = 10;
  string reply_to = 11;
}

message UpdateTenantEmailSettingsResponse {
  TenantEmailSettings settings = 1;
}

message GetTenantEmailSenderRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message GetTenantEmailSenderResponse {
  // The address the tenant's mail is sent from: the tenant's own when its
  // SMTP override is on, the platform's otherwise. Empty when the settings in
  // force name none, which for the platform means none are saved yet.
  string from_address = 1;
}

message SendTenantSmtpTestEmailRequest {
  publira.types.v1.TenantContext tenant = 1;
  TestEmailRecipientType recipient_type = 2;
  string recipient_email = 3;
  bool smtp_override_enabled = 4;
  string host = 5;
  int32 port = 6;
  string username = 7;
  SecretUpdateMode password_update_mode = 8;
  string password = 9;
  string encryption = 10;
  string from_name = 11;
  string from_address = 12;
  string reply_to = 13;
}

message SendTenantSmtpTestEmailResponse {
  string recipient_email = 1;
}

service AdminEmailSettingsService {
  // Minimum role: tenant_admin.
  rpc GetTenantEmailSettings(GetTenantEmailSettingsRequest) returns (GetTenantEmailSettingsResponse) {}
  // Minimum role: tenant_admin.
  rpc UpdateTenantEmailSettings(UpdateTenantEmailSettingsRequest) returns (UpdateTenantEmailSettingsResponse) {}
  // Answers the address the tenant's mail is sent from, so a sender a mail
  // provider requires to be registered can be named to a tenant on the
  // platform's mail too, which GetTenantEmailSettings cannot do. Nothing else
  // of the platform's SMTP settings is answered.
  // Minimum role: tenant_admin.
  rpc GetTenantEmailSender(GetTenantEmailSenderRequest) returns (GetTenantEmailSenderResponse) {}
  // Minimum role: tenant_admin.
  rpc SendTenantSmtpTestEmail(SendTenantSmtpTestEmailRequest) returns (SendTenantSmtpTestEmailResponse) {}
}