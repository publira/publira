syntax = "proto3";

package publira.admin.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/admin/v1;publiraadminv1";

import "publira/types/v1/types.proto";

// One episode's read-through over the reported period.
//
// complete_count and member_view_count are the numerator and denominator of
// the rate, and are counted over the same cohort — signed-in members — so the
// two can be divided. The rate itself is not carried: it is the client's to
// render, including what it shows when the denominator is zero.
message EpisodeReadThrough {
  string series_public_id = 1;
  string series_title = 2;
  string episode_public_id = 3;
  string episode_title = 4;
  // Members who finished this episode for the first time during the period.
  int64 complete_count = 5;
  // Views of this episode by signed-in members during the period.
  int64 member_view_count = 6;
}

// Cursor pagination. Field shape and token rules: proto/README.md.
message ListEpisodeReadThroughRequest {
  publira.types.v1.TenantContext tenant = 1;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 3;
}

message ListEpisodeReadThroughResponse {
  // Ordered by complete_count, highest first.
  repeated EpisodeReadThrough episodes = 1;
  // The reported period, as inclusive calendar dates (YYYY-MM-DD) in the
  // tenant's time zone. A day here is the tenant's own day, the same one the
  // audit log's date filter means, so the two screens cannot disagree about
  // where a day begins.
  string period_start = 2;
  string period_end = 3;
  // The same two counts over every episode in the period. They stay the same
  // on every page, because the rate for the period is not the rate of whatever
  // rows one page happens to hold.
  int64 total_complete_count = 4;
  int64 total_member_view_count = 5;
  // Token for the previous page. Empty on the first page.
  string previous_token = 6;
  // Token for the next page. Empty on the last page.
  string next_token = 7;
  // The IANA time zone period_start and period_end are calendar days in, so
  // the screen can name it rather than assume one. It is the tenant's resolved
  // zone: the counting and the wording come from the same read.
  string time_zone = 8;
}

// How GetRevenueStatsRequest cuts its period into rows.
enum RevenueGroupBy {
  REVENUE_GROUP_BY_UNSPECIFIED = 0;
  // One row per day of the period, the tenant's own days, a day without a
  // sale included.
  REVENUE_GROUP_BY_DAY = 1;
  // One row per series that sold in the period.
  REVENUE_GROUP_BY_SERIES = 2;
  // One row per episode that sold in the period.
  REVENUE_GROUP_BY_EPISODE = 3;
}

// What sold in one row of a revenue report, in the minor unit of the
// response's currency.
//
// A sale is counted on the day it was made, and what went back on it is taken
// off that day too, however long after it went back: a refund, and a dispute
// of the payment the tenant lost, which takes all of it back. A day already
// reported can therefore fall afterwards. A dispute still open takes nothing
// back until it is lost.
//
// A purchase of a volume or of the rest of a series sold every episode in it,
// so it is a sale of each of those episodes at the part of its price that
// episode accounts for, the part a royalty statement credits, and a sale of
// the series they belong to at all of it. What went back on such a purchase
// is divided over its episodes in the same proportion, each part rounded
// down, so the episode rows' refunded_amount can fall short of the totals by
// less than one minor unit per episode.
message RevenueStatsRow {
  // The tenant day (YYYY-MM-DD) of a REVENUE_GROUP_BY_DAY row. Empty
  // otherwise.
  string date = 1;
  // The series of a REVENUE_GROUP_BY_SERIES or REVENUE_GROUP_BY_EPISODE row,
  // under its title in the tenant's default locale. Empty for a day.
  string series_public_id = 2;
  string series_title = 3;
  // The episode of a REVENUE_GROUP_BY_EPISODE row. Empty otherwise.
  string episode_public_id = 4;
  string episode_title = 5;
  // Purchases made, refunded ones included.
  int64 purchase_count = 6;
  // What those purchases were paid.
  int64 gross_amount = 7;
  // What went back to the readers of them.
  int64 refunded_amount = 8;
  // gross_amount less refunded_amount: what the tenant kept.
  int64 net_amount = 9;
}

// The same four figures over the whole period, each purchase counted once
// whatever its episodes.
message RevenueStatsTotals {
  int64 purchase_count = 1;
  int64 gross_amount = 2;
  int64 refunded_amount = 3;
  int64 net_amount = 4;
}

message GetRevenueStatsRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The period, as inclusive calendar dates (YYYY-MM-DD) in the tenant's time
  // zone: the first no later than the last, and covering at most 366 days.
  // Both are required.
  string start_date = 2;
  string end_date = 3;
  // REVENUE_GROUP_BY_UNSPECIFIED is refused.
  RevenueGroupBy group_by = 4;
  // Cursor pagination of a REVENUE_GROUP_BY_SERIES or
  // REVENUE_GROUP_BY_EPISODE report. Field shape and token rules:
  // proto/README.md. A REVENUE_GROUP_BY_DAY report holds one row per day of a
  // period no longer than 366 days, answers all of them at once, and ignores
  // both fields.
  //
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 5;
  // Opaque token from a previous response. Empty for the first page. A token
  // is bound to the grouping and the period it was issued for.
  string token = 6;
}

message GetRevenueStatsResponse {
  // A day report in date order. A series or an episode report ordered by
  // net_amount, highest first.
  repeated RevenueStatsRow rows = 1;
  // The period the request asked for, echoed back.
  string start_date = 2;
  string end_date = 3;
  // The IANA time zone the dates are the tenant's days in. It is the tenant's
  // resolved zone: the counting and the wording come from the same read.
  string time_zone = 4;
  // The ISO 4217 code every amount is in: the currency the tenant sells in.
  // A purchase paid in another, from before the tenant changed it, is in no
  // row and no total, since its price cannot be added to theirs.
  string currency = 5;
  // The figures over the whole period. They stay the same on every page.
  RevenueStatsTotals totals = 6;
  // Token for the previous page. Empty on the first page, and always for a
  // day report.
  string previous_token = 7;
  // Token for the next page. Empty on the last page, and always for a day
  // report.
  string next_token = 8;
}

// How GetAudienceStatsRequest cuts its period into rows.
enum AudienceGroupBy {
  AUDIENCE_GROUP_BY_UNSPECIFIED = 0;
  // One row per day of the period, the tenant's own days, a quiet day
  // included.
  AUDIENCE_GROUP_BY_DAY = 1;
  // One row per series of the tenant, every series included.
  AUDIENCE_GROUP_BY_SERIES = 2;
}

// How one row of an audience report was followed, read, and reacted to.
//
// Followers are counted from every follow made and ended, so a follow made a
// moment ago is already in them. A follow ends when the reader takes it back
// and when their account is deleted. A follow that ended before the server
// began recording them is in no figure, and one standing then is counted from
// the day it was made.
//
// Views, completed reads, and reactions reach a day once the daily aggregates
// have been rebuilt for it, so today, and a day still waiting for its rebuild,
// counts none of them yet. A reaction is one press of an episode's reaction
// control that added to the reader's score, and reaction_points are what those
// presses added: a tenant whose readers react with a single press records 5
// points a reaction.
message AudienceStatsRow {
  // The tenant day (YYYY-MM-DD) of an AUDIENCE_GROUP_BY_DAY row. Empty
  // otherwise.
  string date = 1;
  // The series of an AUDIENCE_GROUP_BY_SERIES row, under its title in the
  // tenant's default locale. Empty for a day.
  string series_public_id = 2;
  string series_title = 3;
  // Readers following at the end of the row's day, or, for a series, at the
  // end of the period.
  int64 follower_count = 4;
  // Follows made during the row's day, or the period for a series.
  int64 followed_count = 5;
  // Follows that ended during it.
  int64 unfollowed_count = 6;
  // Views of the series page and of its episodes, every reader's, a signed-out
  // one's included.
  int64 view_count = 7;
  // Members who finished one of its episodes for the first time.
  int64 complete_count = 8;
  int64 reaction_count = 9;
  int64 reaction_points = 10;
  // The rating an AUDIENCE_GROUP_BY_SERIES row's series stands at now, the
  // figure its page shows: rating_average on the 1-5 scale to one decimal,
  // and rating_count the readers who reacted to any of its episodes. It is
  // formed over every reaction the series has collected rather than the
  // period's. Both are 0 for a series no reader has reacted to yet, and for a
  // day.
  double rating_average = 11;
  int64 rating_count = 12;
}

// The same figures over the whole period.
message AudienceStatsTotals {
  // Readers following at the end of the period.
  int64 follower_count = 1;
  int64 followed_count = 2;
  int64 unfollowed_count = 3;
  int64 view_count = 4;
  int64 complete_count = 5;
  int64 reaction_count = 6;
  int64 reaction_points = 7;
}

message GetAudienceStatsRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The period, as inclusive calendar dates (YYYY-MM-DD) in the tenant's time
  // zone: the first no later than the last, and covering at most 366 days.
  // Both are required.
  string start_date = 2;
  string end_date = 3;
  // AUDIENCE_GROUP_BY_UNSPECIFIED is refused.
  AudienceGroupBy group_by = 4;
  // Narrows every row and the totals to one series. Empty reports the whole
  // tenant. A series the tenant does not have is not_found.
  string series_public_id = 5;
  // Cursor pagination of an AUDIENCE_GROUP_BY_SERIES report. Field shape and
  // token rules: proto/README.md. An AUDIENCE_GROUP_BY_DAY report holds one
  // row per day of a period no longer than 366 days, answers all of them at
  // once, and ignores both fields.
  //
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 6;
  // Opaque token from a previous response. Empty for the first page. A token
  // is bound to the period and the series it was issued for.
  string token = 7;
}

message GetAudienceStatsResponse {
  // A day report in date order. A series report ordered by follower_count,
  // highest first.
  repeated AudienceStatsRow rows = 1;
  // The period the request asked for, echoed back.
  string start_date = 2;
  string end_date = 3;
  // The IANA time zone the dates are the tenant's days in. It is the tenant's
  // resolved zone: the counting and the wording come from the same read.
  string time_zone = 4;
  // The figures over the whole period. They stay the same on every page.
  AudienceStatsTotals totals = 5;
  // Token for the previous page. Empty on the first page, and always for a
  // day report.
  string previous_token = 6;
  // Token for the next page. Empty on the last page, and always for a day
  // report.
  string next_token = 7;
}

// How many of an episode's readers reached one of its pages.
message EpisodePageReach {
  // Zero-based, so the episode's last page is page_count - 1.
  int32 page_index = 1;
  // Readers who stopped at this page or after it. Those who left at it are
  // this count less the next page's, and at the last page this count.
  int64 reader_count = 2;
}

message GetEpisodeDropOffRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The episode to report. One the tenant does not have is not_found.
  string episode_public_id = 2;
  // The period, as inclusive calendar dates (YYYY-MM-DD) in the tenant's time
  // zone: the first no later than the last, and covering at most 366 days.
  // Both are required.
  string start_date = 3;
  string end_date = 4;
}

message GetEpisodeDropOffResponse {
  // Every page from the first through the episode's last, and through the
  // furthest page a reader reached if that is further, in page order. Empty
  // for an episode with no pages that no reader reached.
  //
  // A reader is counted on the day their saved position was last moved, at
  // the page it holds, as the day stood when the daily aggregates were
  // rebuilt for it. A reader who moved on several days of the period is
  // counted once on each, at the page they stopped at that day. Today, and a
  // day still waiting for its rebuild, counts no reader yet.
  repeated EpisodePageReach pages = 1;
  // The pages the episode has now. A page past them was reached before the
  // episode lost pages.
  int32 page_count = 2;
  // The period the request asked for, echoed back.
  string start_date = 3;
  string end_date = 4;
  // The IANA time zone the dates are the tenant's days in. It is the tenant's
  // resolved zone: the counting and the wording come from the same read.
  string time_zone = 5;
}

// Which report ExportStatsRequest writes, and how it cuts the period: each is
// one of the reports the RPCs above answer, under the grouping it names.
enum StatsExportKind {
  STATS_EXPORT_KIND_UNSPECIFIED = 0;
  // GetRevenueStats by REVENUE_GROUP_BY_DAY.
  STATS_EXPORT_KIND_REVENUE_BY_DAY = 1;
  // GetRevenueStats by REVENUE_GROUP_BY_SERIES.
  STATS_EXPORT_KIND_REVENUE_BY_SERIES = 2;
  // GetRevenueStats by REVENUE_GROUP_BY_EPISODE.
  STATS_EXPORT_KIND_REVENUE_BY_EPISODE = 3;
  // GetAudienceStats by AUDIENCE_GROUP_BY_DAY.
  STATS_EXPORT_KIND_AUDIENCE_BY_DAY = 4;
  // GetAudienceStats by AUDIENCE_GROUP_BY_SERIES.
  STATS_EXPORT_KIND_AUDIENCE_BY_SERIES = 5;
  // GetEpisodeDropOff.
  STATS_EXPORT_KIND_EPISODE_DROP_OFF = 6;
}

message ExportStatsRequest {
  publira.types.v1.TenantContext tenant = 1;
  // STATS_EXPORT_KIND_UNSPECIFIED is refused.
  StatsExportKind kind = 2;
  // The period, as inclusive calendar dates (YYYY-MM-DD) in the tenant's time
  // zone, on the same terms as the report's own RPC.
  string start_date = 3;
  string end_date = 4;
  // Narrows an audience report to one series, as GetAudienceStatsRequest's
  // field of the same name does. Any other kind refuses it, since the file
  // would not be narrowed the way the request says.
  string series_public_id = 5;
  // The episode of STATS_EXPORT_KIND_EPISODE_DROP_OFF, which requires it. Any
  // other kind refuses it.
  string episode_public_id = 6;
}

message ExportStatsResponse {
  // The report as CSV: UTF-8 with a byte order mark, CRLF line endings,
  // RFC 4180 quoting. A header row, then every row the report's RPC answers,
  // in its order and over all of its pages, with no summary row; the totals
  // are those of that RPC. Counts and amounts are integers, an amount in the
  // minor unit of currency with no currency symbol. The IDs are public IDs,
  // and a title is in the tenant's default locale. Columns, by kind:
  //
  //   REVENUE_BY_DAY        date, purchase_count, gross_amount,
  //                         refunded_amount, net_amount, currency
  //   REVENUE_BY_SERIES     start_date, end_date, series_id, series_title,
  //                         purchase_count, gross_amount, refunded_amount,
  //                         net_amount, currency
  //   REVENUE_BY_EPISODE    start_date, end_date, series_id, series_title,
  //                         episode_id, episode_title, purchase_count,
  //                         gross_amount, refunded_amount, net_amount,
  //                         currency
  //   AUDIENCE_BY_DAY       date, follower_count, followed_count,
  //                         unfollowed_count, view_count, complete_count,
  //                         reaction_count, reaction_points
  //   AUDIENCE_BY_SERIES    start_date, end_date, series_id, series_title,
  //                         follower_count, followed_count, unfollowed_count,
  //                         view_count, complete_count, reaction_count,
  //                         reaction_points, rating_average, rating_count
  //   EPISODE_DROP_OFF      start_date, end_date, episode_id, page_index,
  //                         reader_count
  //
  // date, start_date, and end_date are the tenant's days (YYYY-MM-DD), the
  // last two the period the request asked for. currency is the response
  // currency of GetRevenueStats, the same on every row. rating_average has
  // one decimal, and is 0.0 for a series no reader has reacted to.
  bytes csv = 1;
}

service AdminEngagementService {
  // Minimum role: tenant_auditor.
  rpc ListEpisodeReadThrough(ListEpisodeReadThroughRequest) returns (ListEpisodeReadThroughResponse) {}
  // What sold over a period of the tenant's days, by day, by series, or by
  // episode, net of what went back to the readers, in the tenant's currency.
  // It reads purchases themselves, so a sale made a moment ago is in it.
  //
  // Minimum role: tenant_admin.
  rpc GetRevenueStats(GetRevenueStatsRequest) returns (GetRevenueStatsResponse) {}
  // How a tenant's series were followed, read, and reacted to over a period of
  // its days, by day or by series, with the rating each series stands at.
  //
  // Minimum role: tenant_auditor.
  rpc GetAudienceStats(GetAudienceStatsRequest) returns (GetAudienceStatsResponse) {}
  // How far into one episode its readers got over a period of the tenant's
  // days, page by page, which shows the page at which they leave it.
  //
  // Minimum role: tenant_auditor.
  rpc GetEpisodeDropOff(GetEpisodeDropOffRequest) returns (GetEpisodeDropOffResponse) {}
  // One of the reports above as a CSV file, whole: a ranked report's every
  // page in one file. It reads what the report's RPC reads, when it is asked,
  // and records the download in the tenant's audit log. The role is the one
  // revenue needs whichever report is asked for, since one RPC serves them
  // all.
  //
  // Minimum role: tenant_admin.
  rpc ExportStats(ExportStatsRequest) returns (ExportStatsResponse) {}
}
