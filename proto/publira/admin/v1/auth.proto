syntax = "proto3";

package publira.admin.v1;

option go_package = "github.com/publira/publira/server/gen/publira/admin/v1;publiraadminv1";

import "publira/types/v1/types.proto";

message AdminAuthServiceLoginRequest {
  publira.types.v1.TenantContext tenant = 1;
  string email = 2;
  string password = 3;
}

message AdminAuthServiceLoginResponse {
  publira.types.v1.User user = 1;
  publira.types.v1.AccessToken access_token = 2;
}

message AdminAuthServiceLogoutRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message AdminAuthServiceLogoutResponse {}

message AdminAuthServiceRequestPasswordResetRequest {
  publira.types.v1.TenantContext tenant = 1;
  string email = 2;
}

message AdminAuthServiceRequestPasswordResetResponse {
  bool requested = 1;
}

message AdminAuthServiceConfirmPasswordResetRequest {
  publira.types.v1.TenantContext tenant = 1;
  string token = 2;
  string new_password = 3;
}

message AdminAuthServiceConfirmPasswordResetResponse {
  bool confirmed = 1;
}

message AdminAuthServiceGetMeRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message AdminAuthServiceGetMeResponse {
  publira.types.v1.User user = 1;
}

message AdminAuthServiceGetTenantByDomainRequest {
  repeated string domains = 1;
}

message AdminAuthServiceGetTenantByDomainResponse {
  // Primary key (UUID) for internal routing / TenantContext.
  string tenant_id = 1;
  // The tenant's saved default locale (ja, en) so the console proxy can publish
  // the display language in the round trip it already makes. Never empty: a
  // stored code naming no supported locale fails this RPC rather than answering
  // another language.
  string default_locale = 2;
}

message AdminAuthServiceGetTenantRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message AdminAuthServiceTenant {
  string public_id = 1;
  string name = 2;
  string domain = 3;
  string admin_domain = 4;
}

message AdminAuthServiceGetTenantResponse {
  AdminAuthServiceTenant tenant = 1;
}

message AdminAuthServiceGetTenantConfigRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message AdminAuthServiceGetTenantConfigResponse {
  string copyright_text = 1;
  string site_description = 2;
  string site_tagline = 3;
}

message AdminAuthServiceGetTenantAdminInvitationStateRequest {
  publira.types.v1.TenantContext tenant = 1;
  string token = 2;
}

message AdminAuthServiceGetTenantAdminInvitationStateResponse {
  string email = 1;
  string status = 2;
  string expires_at = 3;
  bool account_exists = 4;
}

message AdminAuthServiceAcceptTenantAdminInvitationRequest {
  publira.types.v1.TenantContext tenant = 1;
  string token = 2;
  string name = 3;
  string password = 4;
}

message AdminAuthServiceAcceptTenantAdminInvitationResponse {
  bool accepted = 1;
  bool account_created = 2;
}

message AdminAuthServiceUpdateTenantConfigRequest {
  publira.types.v1.TenantContext tenant = 1;
  string copyright_text = 2;
  string site_description = 3;
  string site_tagline = 4;
}

message AdminAuthServiceUpdateTenantConfigResponse {
  string copyright_text = 1;
  string site_description = 2;
  string site_tagline = 3;
}

message AdminAuthServiceRequestEmailChangeRequest {
  publira.types.v1.TenantContext tenant = 1;
  string current_email = 2;
  string new_email = 3;
  string current_password = 4;
}

message AdminAuthServiceRequestEmailChangeResponse {
  bool requested = 1;
}

message AdminAuthServiceConfirmEmailChangeRequest {
  publira.types.v1.TenantContext tenant = 1;
  string token = 2;
}

message AdminAuthServiceConfirmEmailChangeResponse {
  bool confirmed = 1;
  bool changed = 2;
  string pending_confirmation_for = 3;
}

service AdminAuthService {
  rpc Login(AdminAuthServiceLoginRequest) returns (AdminAuthServiceLoginResponse) {}
  rpc Logout(AdminAuthServiceLogoutRequest) returns (AdminAuthServiceLogoutResponse) {}
  rpc RequestPasswordReset(AdminAuthServiceRequestPasswordResetRequest) returns (AdminAuthServiceRequestPasswordResetResponse) {}
  rpc ConfirmPasswordReset(AdminAuthServiceConfirmPasswordResetRequest) returns (AdminAuthServiceConfirmPasswordResetResponse) {}
  rpc GetMe(AdminAuthServiceGetMeRequest) returns (AdminAuthServiceGetMeResponse) {}
  rpc GetTenantByDomain(AdminAuthServiceGetTenantByDomainRequest) returns (AdminAuthServiceGetTenantByDomainResponse) {}
  rpc GetTenant(AdminAuthServiceGetTenantRequest) returns (AdminAuthServiceGetTenantResponse) {}
  rpc GetTenantConfig(AdminAuthServiceGetTenantConfigRequest) returns (AdminAuthServiceGetTenantConfigResponse) {}
  rpc GetTenantAdminInvitationState(AdminAuthServiceGetTenantAdminInvitationStateRequest) returns (AdminAuthServiceGetTenantAdminInvitationStateResponse) {}
  rpc AcceptTenantAdminInvitation(AdminAuthServiceAcceptTenantAdminInvitationRequest) returns (AdminAuthServiceAcceptTenantAdminInvitationResponse) {}
  rpc UpdateTenantConfig(AdminAuthServiceUpdateTenantConfigRequest) returns (AdminAuthServiceUpdateTenantConfigResponse) {}
  rpc RequestEmailChange(AdminAuthServiceRequestEmailChangeRequest) returns (AdminAuthServiceRequestEmailChangeResponse) {}
  rpc ConfirmEmailChange(AdminAuthServiceConfirmEmailChangeRequest) returns (AdminAuthServiceConfirmEmailChangeResponse) {}
}
