syntax = "proto3";

package publira.admin.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/admin/v1;publiraadminv1";

import "publira/types/v1/types.proto";

message AdminAuthServiceLoginRequest {
  publira.types.v1.TenantContext tenant = 1;
  string email = 2;
  string password = 3;
}

message AdminAuthServiceLoginResponse {
  // Empty while mfa_challenge is set: the password was right, but the session
  // is not issued until the second factor is settled.
  publira.types.v1.User user = 1;
  publira.types.v1.AccessToken access_token = 2;
  AdminAuthServiceMfaChallenge mfa_challenge = 3;
}

// What the account still owes before the login can finish.
enum MfaChallengeKind {
  MFA_CHALLENGE_KIND_UNSPECIFIED = 0;
  // The account holds a second factor and owes an answer from one of them.
  MFA_CHALLENGE_KIND_VERIFY = 1;
  // The account holds no second factor and the tenant requires one of its
  // role, so the only thing this challenge can complete is an enrollment: a
  // TOTP authenticator or a passkey.
  MFA_CHALLENGE_KIND_ENROLL = 2;
}

// A kind of second factor an account can hold.
enum MfaMethod {
  MFA_METHOD_UNSPECIFIED = 0;
  // A confirmed TOTP authenticator, answered with a code from it.
  MFA_METHOD_TOTP = 1;
  // A passkey or security key registered for the console's relying party,
  // answered through FinishPasskeyVerification.
  MFA_METHOD_PASSKEY = 2;
}

// The half-finished session a password alone earns. The token is signed and
// short-lived, and no RPC other than the MFA ones accepts it.
message AdminAuthServiceMfaChallenge {
  string token = 1;
  string expires_at = 2;
  MfaChallengeKind kind = 3;
  // The factors a verify challenge can be answered with, so the console
  // offers those and no other. Empty for an enroll challenge. A recovery code
  // answers VerifyMfa whichever of them the account holds.
  repeated MfaMethod methods = 4;
}

message AdminAuthServiceVerifyMfaRequest {
  publira.types.v1.TenantContext tenant = 1;
  string challenge_token = 2;
  // A code from the authenticator, or one of the recovery codes handed out at
  // enrollment. Which one it was is reported back in the response. An account
  // that holds passkeys and no authenticator may send a recovery code alone.
  string code = 3;
}

message AdminAuthServiceVerifyMfaResponse {
  publira.types.v1.User user = 1;
  publira.types.v1.AccessToken access_token = 2;
  bool recovery_code_used = 3;
  int32 remaining_recovery_codes = 4;
}

message AdminAuthServiceGetMfaStatusRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message AdminAuthServiceGetMfaStatusResponse {
  // The TOTP authenticator is confirmed. A passkey does not set it: methods
  // names every factor the account holds.
  bool enabled = 1;
  string enabled_at = 2;
  // What is left of the batch handed out with the account's first factor,
  // whichever factor that was.
  int32 remaining_recovery_codes = 3;
  // The tenant requires MFA of this account's role. With methods empty, the
  // console has to send the account to enrollment before anything else.
  bool required = 4;
  repeated MfaMethod methods = 5;
}

message AdminAuthServiceStartMfaEnrollmentRequest {
  publira.types.v1.TenantContext tenant = 1;
  // Sent instead of an Authorization header when the login stopped at an
  // enroll challenge. A signed-in account enrolling voluntarily leaves it
  // empty and is identified by its session.
  string challenge_token = 2;
}

message AdminAuthServiceStartMfaEnrollmentResponse {
  // Base32 secret, for an authenticator that is typed into rather than
  // scanned. It is readable only here and only until the next start.
  string secret = 1;
  // otpauth:// URI (RFC 6238 parameters) the console renders as a QR code.
  string otpauth_uri = 2;
}

message AdminAuthServiceConfirmMfaEnrollmentRequest {
  publira.types.v1.TenantContext tenant = 1;
  string challenge_token = 2;
  string code = 3;
}

message AdminAuthServiceConfirmMfaEnrollmentResponse {
  // Plaintext exactly once; only hashes are kept.
  repeated string recovery_codes = 1;
  // Set when a challenge token finished the login rather than a session.
  publira.types.v1.User user = 2;
  publira.types.v1.AccessToken access_token = 3;
}

message AdminAuthServiceDisableMfaRequest {
  publira.types.v1.TenantContext tenant = 1;
  string code = 2;
}

message AdminAuthServiceDisableMfaResponse {
  bool disabled = 1;
}

message AdminAuthServiceRegenerateMfaRecoveryCodesRequest {
  publira.types.v1.TenantContext tenant = 1;
  // A code from the authenticator. A recovery code is refused: one leaked
  // code that could mint ten more would never expire.
  string code = 2;
  // An assertion made with one of the account's passkeys over a challenge
  // BeginPasskeyConfirmation issued, as its toJSON() serializes it, sent in
  // place of code. Exactly one of the two is sent. A refused assertion counts
  // toward the same lock a wrong code does.
  string passkey_credential_json = 3;
}

message AdminAuthServiceRegenerateMfaRecoveryCodesResponse {
  // Replaces every code the account held, used or not.
  repeated string recovery_codes = 1;
}

// A passkey or security key the account registered for the console. Only the
// ones registered for the console's relying party ID are listed: a credential
// answers no other.
message Passkey {
  string id = 1;
  // What its owner called it. Empty until they name it.
  string name = 2;
  string created_at = 3;
  // Empty until it first answers a sign-in.
  string last_used_at = 4;
  // The authenticator syncs it to the owner's other devices, as a passkey in
  // a password manager does; false for one bound to a single device, such as
  // a security key.
  bool backed_up = 5;
}

message AdminAuthServiceBeginPasskeyRegistrationRequest {
  publira.types.v1.TenantContext tenant = 1;
  // Sent instead of an Authorization header when the login stopped at an
  // enroll challenge, as StartMfaEnrollment takes it.
  string challenge_token = 2;
}

message AdminAuthServiceBeginPasskeyRegistrationResponse {
  // PublicKeyCredentialCreationOptionsJSON, for
  // PublicKeyCredential.parseCreationOptionsFromJSON. User verification is
  // required, and the account's existing credentials are excluded.
  string creation_options_json = 1;
}

message AdminAuthServiceFinishPasskeyRegistrationRequest {
  publira.types.v1.TenantContext tenant = 1;
  string challenge_token = 2;
  // The PublicKeyCredential the authenticator created, as its toJSON()
  // serializes it.
  string credential_json = 3;
  // At most 64 characters; empty leaves it unnamed.
  string name = 4;
}

message AdminAuthServiceFinishPasskeyRegistrationResponse {
  Passkey passkey = 1;
  // Plaintext exactly once, and only when the account held no unused
  // recovery code before this passkey.
  repeated string recovery_codes = 2;
  // Set when a challenge token finished the login rather than a session.
  publira.types.v1.User user = 3;
  publira.types.v1.AccessToken access_token = 4;
}

message AdminAuthServiceBeginPasskeyVerificationRequest {
  publira.types.v1.TenantContext tenant = 1;
  string challenge_token = 2;
}

message AdminAuthServiceBeginPasskeyVerificationResponse {
  // PublicKeyCredentialRequestOptionsJSON, for
  // PublicKeyCredential.parseRequestOptionsFromJSON, allowing the account's
  // credentials for the console's relying party ID.
  string request_options_json = 1;
}

message AdminAuthServiceFinishPasskeyVerificationRequest {
  publira.types.v1.TenantContext tenant = 1;
  string challenge_token = 2;
  // The PublicKeyCredential the authenticator asserted with, as its toJSON()
  // serializes it.
  string credential_json = 3;
}

message AdminAuthServiceFinishPasskeyVerificationResponse {
  publira.types.v1.User user = 1;
  publira.types.v1.AccessToken access_token = 2;
  int32 remaining_recovery_codes = 3;
}

message AdminAuthServiceBeginPasskeyConfirmationRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message AdminAuthServiceBeginPasskeyConfirmationResponse {
  // PublicKeyCredentialRequestOptionsJSON, as
  // BeginPasskeyVerificationResponse answers it. The assertion made over it
  // goes in the passkey_credential_json of the request it confirms, and
  // confirms that one request.
  string request_options_json = 1;
}

message AdminAuthServiceListPasskeysRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message AdminAuthServiceListPasskeysResponse {
  // Oldest first.
  repeated Passkey passkeys = 1;
}

message AdminAuthServiceRenamePasskeyRequest {
  publira.types.v1.TenantContext tenant = 1;
  string id = 2;
  // At most 64 characters; empty clears it.
  string name = 3;
}

message AdminAuthServiceRenamePasskeyResponse {
  Passkey passkey = 1;
}

message AdminAuthServiceDeletePasskeyRequest {
  publira.types.v1.TenantContext tenant = 1;
  string id = 2;
}

message AdminAuthServiceDeletePasskeyResponse {}

message AdminAuthServiceLogoutRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message AdminAuthServiceLogoutResponse {}

message AdminAuthServiceRequestPasswordResetRequest {
  publira.types.v1.TenantContext tenant = 1;
  string email = 2;
}

message AdminAuthServiceRequestPasswordResetResponse {
  bool requested = 1;
}

message AdminAuthServiceConfirmPasswordResetRequest {
  publira.types.v1.TenantContext tenant = 1;
  string token = 2;
  string new_password = 3;
}

message AdminAuthServiceConfirmPasswordResetResponse {
  bool confirmed = 1;
}

message AdminAuthServiceGetMeRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message AdminAuthServiceGetMeResponse {
  publira.types.v1.User user = 1;
}

message AdminAuthServiceGetTenantByDomainRequest {
  repeated string domains = 1;
}

message AdminAuthServiceGetTenantByDomainResponse {
  // Primary key (UUID) for internal routing / TenantContext.
  string tenant_id = 1;
  // The tenant's saved default locale (ja, en) so the console proxy can publish
  // the display language in the round trip it already makes. Never empty: a
  // stored code naming no supported locale fails this RPC rather than answering
  // another language.
  string default_locale = 2;
}

message AdminAuthServiceGetTenantRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message AdminAuthServiceTenant {
  string public_id = 1;
  string name = 2;
  string domain = 3;
  string admin_domain = 4;
  // The ISO 4217 code, in capitals, of the currency the tenant sells in. Every
  // price and amount the console reads and writes is an integer in its minor
  // unit, so a price of 500 is 500 yen in JPY and 5.00 dollars in USD.
  string currency = 5;
}

message AdminAuthServiceGetTenantResponse {
  AdminAuthServiceTenant tenant = 1;
}

message AdminAuthServiceGetTenantConfigRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The locale whose site copy to read. Empty means the tenant's default
  // locale; a locale the tenant does not offer is invalid_argument.
  string locale = 2;
}

// The site copy written in that locale and nothing else: every field is empty
// where the locale has no copy, although readers in it are served another
// locale's.
message AdminAuthServiceGetTenantConfigResponse {
  string copyright_text = 1;
  string site_description = 2;
  string site_tagline = 3;
  // The locale read, which names the default locale when the request named
  // none.
  string locale = 4;
}

message AdminAuthServiceGetTenantAdminInvitationStateRequest {
  publira.types.v1.TenantContext tenant = 1;
  string token = 2;
}

message AdminAuthServiceGetTenantAdminInvitationStateResponse {
  string email = 1;
  string status = 2;
  string expires_at = 3;
  bool account_exists = 4;
  // The role accepting the invitation grants:
  // tenant_admin | tenant_editor | tenant_auditor
  string role = 5;
}

message AdminAuthServiceAcceptTenantAdminInvitationRequest {
  publira.types.v1.TenantContext tenant = 1;
  string token = 2;
  string name = 3;
  string password = 4;
}

message AdminAuthServiceAcceptTenantAdminInvitationResponse {
  bool accepted = 1;
  bool account_created = 2;
}

// Writes one locale's site copy whole. A field of nothing but white space is
// stored empty, and leaving all three empty deletes the locale's copy, so its
// readers are served the copy GetTenant falls back to.
message AdminAuthServiceUpdateTenantConfigRequest {
  publira.types.v1.TenantContext tenant = 1;
  string copyright_text = 2;
  string site_description = 3;
  string site_tagline = 4;
  // The locale the copy is written in. Empty means the tenant's default
  // locale; a locale the tenant does not offer is invalid_argument.
  string locale = 5;
}

message AdminAuthServiceUpdateTenantConfigResponse {
  string copyright_text = 1;
  string site_description = 2;
  string site_tagline = 3;
  // The locale written.
  string locale = 4;
}

message AdminAuthServiceRequestEmailChangeRequest {
  publira.types.v1.TenantContext tenant = 1;
  string current_email = 2;
  string new_email = 3;
  string current_password = 4;
}

message AdminAuthServiceRequestEmailChangeResponse {
  bool requested = 1;
}

message AdminAuthServiceConfirmEmailChangeRequest {
  publira.types.v1.TenantContext tenant = 1;
  string token = 2;
}

message AdminAuthServiceConfirmEmailChangeResponse {
  bool confirmed = 1;
  bool changed = 2;
  string pending_confirmation_for = 3;
}

service AdminAuthService {
  rpc Login(AdminAuthServiceLoginRequest) returns (AdminAuthServiceLoginResponse) {}
  rpc Logout(AdminAuthServiceLogoutRequest) returns (AdminAuthServiceLogoutResponse) {}
  rpc RequestPasswordReset(AdminAuthServiceRequestPasswordResetRequest) returns (AdminAuthServiceRequestPasswordResetResponse) {}
  rpc ConfirmPasswordReset(AdminAuthServiceConfirmPasswordResetRequest) returns (AdminAuthServiceConfirmPasswordResetResponse) {}
  rpc GetMe(AdminAuthServiceGetMeRequest) returns (AdminAuthServiceGetMeResponse) {}
  // The tenant whose console host is the first of domains any tenant serves.
  // not_found when none is, and failed_precondition with the ErrorInfo reason
  // TENANT_SUSPENDED when that tenant is suspended, so the console can tell a
  // tenant that is not being served from a host that serves no tenant.
  rpc GetTenantByDomain(AdminAuthServiceGetTenantByDomainRequest) returns (AdminAuthServiceGetTenantByDomainResponse) {}
  // Minimum role: tenant_auditor.
  rpc GetTenant(AdminAuthServiceGetTenantRequest) returns (AdminAuthServiceGetTenantResponse) {}
  // Minimum role: tenant_auditor.
  rpc GetTenantConfig(AdminAuthServiceGetTenantConfigRequest) returns (AdminAuthServiceGetTenantConfigResponse) {}
  rpc GetTenantAdminInvitationState(AdminAuthServiceGetTenantAdminInvitationStateRequest) returns (AdminAuthServiceGetTenantAdminInvitationStateResponse) {}
  rpc AcceptTenantAdminInvitation(AdminAuthServiceAcceptTenantAdminInvitationRequest) returns (AdminAuthServiceAcceptTenantAdminInvitationResponse) {}
  // Minimum role: tenant_admin.
  rpc UpdateTenantConfig(AdminAuthServiceUpdateTenantConfigRequest) returns (AdminAuthServiceUpdateTenantConfigResponse) {}
  rpc RequestEmailChange(AdminAuthServiceRequestEmailChangeRequest) returns (AdminAuthServiceRequestEmailChangeResponse) {}
  rpc ConfirmEmailChange(AdminAuthServiceConfirmEmailChangeRequest) returns (AdminAuthServiceConfirmEmailChangeResponse) {}
  rpc VerifyMfa(AdminAuthServiceVerifyMfaRequest) returns (AdminAuthServiceVerifyMfaResponse) {}
  rpc GetMfaStatus(AdminAuthServiceGetMfaStatusRequest) returns (AdminAuthServiceGetMfaStatusResponse) {}
  rpc StartMfaEnrollment(AdminAuthServiceStartMfaEnrollmentRequest) returns (AdminAuthServiceStartMfaEnrollmentResponse) {}
  rpc ConfirmMfaEnrollment(AdminAuthServiceConfirmMfaEnrollmentRequest) returns (AdminAuthServiceConfirmMfaEnrollmentResponse) {}
  rpc DisableMfa(AdminAuthServiceDisableMfaRequest) returns (AdminAuthServiceDisableMfaResponse) {}
  // Replaces the recovery codes, for an account that proves its
  // authenticator or one of its passkeys. failed_precondition when the
  // account does not hold the factor it answers with.
  rpc RegenerateMfaRecoveryCodes(AdminAuthServiceRegenerateMfaRecoveryCodesRequest) returns (AdminAuthServiceRegenerateMfaRecoveryCodesResponse) {}
  // Starts registering a passkey, for a signed-in account or for one that
  // login stopped at an enroll challenge.
  rpc BeginPasskeyRegistration(AdminAuthServiceBeginPasskeyRegistrationRequest) returns (AdminAuthServiceBeginPasskeyRegistrationResponse) {}
  // Stores the passkey the authenticator created. Under an enroll challenge
  // it also finishes the login, as ConfirmMfaEnrollment does.
  rpc FinishPasskeyRegistration(AdminAuthServiceFinishPasskeyRegistrationRequest) returns (AdminAuthServiceFinishPasskeyRegistrationResponse) {}
  // Starts answering a verify challenge with a passkey.
  rpc BeginPasskeyVerification(AdminAuthServiceBeginPasskeyVerificationRequest) returns (AdminAuthServiceBeginPasskeyVerificationResponse) {}
  // Exchanges a verify challenge and an assertion for the session. A refused
  // assertion counts toward the same lock a wrong code does.
  rpc FinishPasskeyVerification(AdminAuthServiceFinishPasskeyVerificationRequest) returns (AdminAuthServiceFinishPasskeyVerificationResponse) {}
  // Begins the fresh assertion a signed-in account confirms
  // RegenerateMfaRecoveryCodes with in place of a code, allowing its own
  // passkeys for the console's relying party ID alone. failed_precondition for
  // an account that holds none.
  rpc BeginPasskeyConfirmation(AdminAuthServiceBeginPasskeyConfirmationRequest) returns (AdminAuthServiceBeginPasskeyConfirmationResponse) {}
  rpc ListPasskeys(AdminAuthServiceListPasskeysRequest) returns (AdminAuthServiceListPasskeysResponse) {}
  rpc RenamePasskey(AdminAuthServiceRenamePasskeyRequest) returns (AdminAuthServiceRenamePasskeyResponse) {}
  // failed_precondition when it is the account's last second factor and the
  // tenant requires one of its role.
  rpc DeletePasskey(AdminAuthServiceDeletePasskeyRequest) returns (AdminAuthServiceDeletePasskeyResponse) {}
}
