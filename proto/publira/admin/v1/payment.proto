syntax = "proto3";

package publira.admin.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/admin/v1;publiraadminv1";

import "publira/admin/v1/coin.proto";
import "publira/admin/v1/email.proto";
import "publira/admin/v1/subscription_plan.proto";
import "publira/types/v1/types.proto";

// One credential a payment provider declares.
message PaymentCredentialField {
  // The key the value is stored and sent under. The console names the field
  // from its own catalogs by the provider id and this name.
  string name = 1;
  // A secret field is stored encrypted and never answered back in full.
  bool secret = 2;
  // A public field is handed to the reader's browser, as a publishable key is,
  // and its value is answered back as stored.
  bool public = 3;
  // Every required field has to be stored before the provider takes payments.
  bool required = 4;
}

// A payment provider a tenant may choose, as the server registers it.
message PaymentProvider {
  // The id stored in a tenant's settings and named in the webhook route.
  string id = 1;
  string display_name = 2;
  repeated PaymentCredentialField fields = 3;
  // The path on the tenant's storefront the provider's notifications are
  // received on, such as "/api/v1/webhook/payment/stripe".
  string webhook_path = 4;
  // The ISO 4217 codes, in capitals, of the currencies the provider can charge
  // in, in its declared order. A tenant may sell only in one of them.
  repeated string currencies = 5;
}

message ListPaymentProvidersRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message ListPaymentProvidersResponse {
  // Ordered by id.
  repeated PaymentProvider providers = 1;
}

// What is stored for one credential field of the tenant's provider. A secret
// value never appears here.
message PaymentCredentialFieldState {
  string name = 1;
  bool configured = 2;
  // Display hint derived at write time: prefix + bullets + last four for a
  // secret field, and the value itself for one that is not secret. Empty when
  // the field is not stored.
  string hint = 3;
  // The stored value of a field the provider declares public, which the
  // checkout page is given. Empty for every other field.
  string public_value = 4;
}

// Non-secret view of a tenant's payment-provider settings.
message TenantPaymentSettings {
  reserved 3, 4, 5, 6;
  reserved "secret_key_configured", "webhook_secret_configured", "secret_key_hint", "webhook_secret_hint";

  // The id of the provider the tenant chose, or empty before one is saved.
  string provider = 1;
  bool enabled = 2;
  // True when enabled and every field the provider requires is stored.
  // Checkout and Webhook use this tenant's settings only when ready.
  bool ready = 7;
  // One entry per field the provider declares, in its declared order.
  repeated PaymentCredentialFieldState fields = 8;
  // The ISO 4217 code, in capitals, of the currency the tenant sells in, and
  // stores every price in the minor unit of. The platform's default currency
  // before any is saved.
  string currency = 9;
  // True once the tenant has a purchase, so that UpdateTenantPaymentSettings
  // refuses to change currency.
  bool currency_locked = 10;
}

message GetTenantPaymentSettingsRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message GetTenantPaymentSettingsResponse {
  TenantPaymentSettings settings = 1;
}

// A change to one credential field. A field the request leaves out is left as
// it is.
message PaymentCredentialFieldUpdate {
  string name = 1;
  SecretUpdateMode mode = 2;
  // The new value; read only when mode is SECRET_UPDATE_MODE_REPLACE.
  string value = 3;
}

message UpdateTenantPaymentSettingsRequest {
  reserved 4, 5, 6, 7;
  reserved "secret_key_update_mode", "secret_key", "webhook_secret_update_mode", "webhook_secret";

  publira.types.v1.TenantContext tenant = 1;
  // A registered provider id. Choosing a provider other than the stored one
  // clears every field stored for the previous one.
  string provider = 2;
  bool enabled = 3;
  repeated PaymentCredentialFieldUpdate fields = 8;
  // The ISO 4217 code of the currency to sell in, which has to be one the
  // provider declares; anything else is invalid_argument, whether named here
  // or kept. Empty keeps the stored currency. A change is failed_precondition
  // once currency_locked is true.
  string currency = 9;
}

message UpdateTenantPaymentSettingsResponse {
  TenantPaymentSettings settings = 1;
}

// Non-secret view of the App Store Connect API key the server talks to the App
// Store with. The .p8 private key never appears here.
message TenantAppStorePaymentSettings {
  bool enabled = 1;
  // The issuer ID and the key ID are not secret and are answered as stored.
  string issuer_id = 2;
  string key_id = 3;
  bool private_key_configured = 4;
  // Display hint derived at write time. Empty when no key is stored.
  string private_key_hint = 5;
  // The app the store sells in: the bundle identifier the tenant's iOS app
  // association names. Empty where it names none, and edited there, not here.
  string bundle_identifier = 6;
  // True when enabled, the key is stored, and bundle_identifier is not empty.
  bool ready = 7;
}

// Non-secret view of the service account the server talks to Google Play as.
// The JSON key never appears here.
message TenantGooglePlayPaymentSettings {
  bool enabled = 1;
  // The client_email of the stored key, which the tenant grants access to in
  // the Play Console. Empty when no key is stored.
  string service_account_email = 2;
  bool service_account_key_configured = 3;
  // Display hint derived at write time. Empty when no key is stored.
  string service_account_key_hint = 4;
  // The app the store sells in: the application ID the tenant's Android app
  // association names. Empty where it names none, and edited there, not here.
  string package_name = 5;
  // True when enabled, the key is stored, and package_name is not empty.
  bool ready = 6;
}

message TenantStorePaymentSettings {
  // Never APP_PURCHASE_ROUTE_UNSPECIFIED on a read.
  publira.types.v1.AppPurchaseRoute app_purchase_route = 1;
  TenantAppStorePaymentSettings app_store = 2;
  TenantGooglePlayPaymentSettings google_play = 3;
}

message GetTenantStorePaymentSettingsRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message GetTenantStorePaymentSettingsResponse {
  TenantStorePaymentSettings settings = 1;
}

message AppStorePaymentSettingsUpdate {
  bool enabled = 1;
  // A UUID, and a ten-character key ID in capital letters and digits. Both are
  // required while enabled; an empty value clears one.
  string issuer_id = 2;
  string key_id = 3;
  SecretUpdateMode private_key_update_mode = 4;
  // The contents of the .p8 file App Store Connect issued, a PKCS #8 EC
  // private key in PEM form.
  string private_key = 5;
}

message GooglePlayPaymentSettingsUpdate {
  bool enabled = 1;
  SecretUpdateMode service_account_key_update_mode = 2;
  // The JSON key file of a service account, as the Google Cloud console
  // downloads it.
  string service_account_key = 3;
}

message UpdateTenantStorePaymentSettingsRequest {
  publira.types.v1.TenantContext tenant = 1;
  // Every field is written, and an absent store is written disabled with its
  // key left as it is. APP_PURCHASE_ROUTE_UNSPECIFIED is invalid_argument, and
  // APP_PURCHASE_ROUTE_STORE is failed_precondition unless a store is ready
  // once this request is applied.
  publira.types.v1.AppPurchaseRoute app_purchase_route = 2;
  AppStorePaymentSettingsUpdate app_store = 3;
  GooglePlayPaymentSettingsUpdate google_play = 4;
}

message UpdateTenantStorePaymentSettingsResponse {
  TenantStorePaymentSettings settings = 1;
}

// A consumable product the tenant creates in App Store Connect and the Play
// Console: one per price its catalog sells in the app at, and one per pack of
// its coins.
message TenantStoreProduct {
  // The same ID in both stores: `episode_` followed by the price, or `coins_`
  // followed by the pack's id (CoinPack.id) in lowercase hexadecimal, without
  // hyphens, since Google Play takes digits, lowercase letters, underscores,
  // and periods alone.
  string product_id = 1;
  // The price in the minor unit of currency.
  int32 price = 2;
  // How many episodes sell at this price, as their own price or as the price
  // of a campaign on them that has not ended, drafts and scheduled ones
  // included. 0 on the product of a pack.
  int32 episode_count = 3;
  // The ISO 4217 code, in capitals, of the tenant currency price is in.
  string currency = 4;
  // The pack the product sells, set on the product of a pack and unset on one
  // of a price. Its name in each store is the tenant's to set.
  CoinPack coin_pack = 5;
}

message ListTenantStoreProductsRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message ListTenantStoreProductsResponse {
  // The products of prices, ordered by price, and then the product of every
  // pack the tenant has not retired, in the order it sells them, on sale or
  // not, so a pack's product can exist before the pack goes on sale. Only paid
  // episodes the app may show and sell are counted. The packs are listed
  // whether or not coins are turned on.
  repeated TenantStoreProduct products = 1;
  // Every subscription plan of the tenant, in the order it was created,
  // published or not and whether or not it names a store product yet, so the
  // console can show which plans the app sells and which it does not. Each
  // names the auto-renewable subscription it is sold as in each store, which
  // the tenant creates there with the plan's billing period.
  repeated AdminSubscriptionPlan subscription_plans = 2;
}

service AdminPaymentSettingsService {
  // Minimum role: tenant_admin.
  rpc ListPaymentProviders(ListPaymentProvidersRequest) returns (ListPaymentProvidersResponse) {}
  // Minimum role: tenant_admin.
  rpc GetTenantPaymentSettings(GetTenantPaymentSettingsRequest) returns (GetTenantPaymentSettingsResponse) {}
  // Minimum role: tenant_admin.
  rpc UpdateTenantPaymentSettings(UpdateTenantPaymentSettingsRequest) returns (UpdateTenantPaymentSettingsResponse) {}
  // Minimum role: tenant_admin.
  rpc GetTenantStorePaymentSettings(GetTenantStorePaymentSettingsRequest) returns (GetTenantStorePaymentSettingsResponse) {}
  // Minimum role: tenant_admin.
  rpc UpdateTenantStorePaymentSettings(UpdateTenantStorePaymentSettingsRequest) returns (UpdateTenantStorePaymentSettingsResponse) {}
  // Minimum role: tenant_admin.
  rpc ListTenantStoreProducts(ListTenantStoreProductsRequest) returns (ListTenantStoreProductsResponse) {}
}
