syntax = "proto3";

package publira.admin.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/admin/v1;publiraadminv1";

import "publira/types/v1/types.proto";

// One message a reader sent the tenant, as staff read it.
//
// The message is what the reader first wrote, the address to answer at, who on
// the staff owns it, and whether anyone has dealt with it yet. Everything said
// after it is an entry under it.
//
// Where the message stands is derived rather than stored: status reads
// handled_at and the assignee together, so it cannot disagree with them.
message ContactMessage {
  string public_id = 1;
  // The address staff answer at, as the reader typed it.
  string reply_to_email = 2;
  // Empty for a message the reader gave no subject.
  string subject = 3;
  string body = 4;
  // When the message arrived.
  string created_at = 5;
  // When staff marked the message dealt with. Empty while it is still waiting,
  // whether or not anybody is assigned to it.
  string handled_at = 6;
  // The account that sent the message. Both are empty for a guest, and for a
  // reader whose account has been deleted since: the message stays, because the
  // tenant may still owe an answer to the address on it.
  string sender_public_id = 7;
  string sender_name = 8;
  // The message's primary key, which every action on it addresses it by.
  string id = 9;
  // The member of staff the message is assigned to, which is not who marked it
  // handled: a handled message keeps its assignee. All three are empty while
  // nobody is assigned, including after the assignee's account was deleted.
  // assignee_user_id is the TenantMember.user_id AssignContactMessage takes.
  string assignee_user_id = 10;
  string assignee_public_id = 11;
  string assignee_name = 12;
  // The internal note staff keep on the message. Empty when there is none.
  // Readers never see it: no public API carries it.
  string staff_note = 13;
  // Where the message stands in the inbox, one of:
  //   unhandled   - nobody has dealt with it and nobody is assigned
  //   in_progress - nobody has dealt with it yet, but somebody is assigned
  //   handled     - staff marked it dealt with, assigned or not
  // The values are the ListContactMessagesRequest.status filter's, and a
  // message lists under the filter its own status names.
  string status = 14;
  // The exchange that followed the message, oldest first, so the newest is
  // last. Only a read of one message carries it: every list leaves it empty and
  // says how long it is in entry_count instead.
  repeated ContactMessageEntry entries = 15;
  // How many entries the message has. Zero until somebody answers it, because
  // the reader can only write back to an answer.
  int32 entry_count = 16;
}

// One turn of the exchange after a contact message: an answer staff sent, or a
// reply the reader mailed back.
message ContactMessageEntry {
  string id = 1;
  // Who wrote it, one of:
  //   staff  - an answer sent from the console
  //   reader - a reply the reader mailed back to one
  string direction = 2;
  // The member of staff who wrote a staff entry. All three are empty on a
  // reader entry, and on a staff entry whose author's account has been deleted
  // since. author_user_id is the TenantMember.user_id.
  string author_user_id = 3;
  string author_public_id = 4;
  string author_name = 5;
  string body = 6;
  string created_at = 7;
  // The address a reader entry was mailed from, which need not be the
  // message's reply_to_email: a reader may write back from another one, and
  // the next answer still goes to reply_to_email. Empty on a staff entry.
  string from_email = 8;
}

// Cursor pagination. Field shape and token rules: proto/README.md.
message ListContactMessagesRequest {
  publira.types.v1.TenantContext tenant = 1;
  // One of unhandled, in_progress, handled (ContactMessage.status). Empty
  // lists all three, which is how the whole history is read back. Anything
  // else is invalid_argument.
  string status = 2;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 3;
  // Opaque token from a previous response. Empty for the first page.
  string token = 4;
}

message ListContactMessagesResponse {
  // Newest first.
  repeated ContactMessage messages = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

message GetContactMessageRequest {
  publira.types.v1.TenantContext tenant = 1;
  string public_id = 2;
}

message GetContactMessageResponse {
  ContactMessage message = 1;
}

message MarkContactMessageHandledRequest {
  publira.types.v1.TenantContext tenant = 1;
  reserved 2;
  reserved "public_id";
  // True marks the message dealt with, false puts it back among the ones still
  // waiting. The flag is stated rather than toggled, so two members of staff
  // working the same inbox cannot undo each other by pressing at once.
  bool handled = 3;
  // The message's primary key (ContactMessage.id).
  string contact_message_id = 4;
}

message MarkContactMessageHandledResponse {
  ContactMessage message = 1;
}

message AssignContactMessageRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The message's primary key (ContactMessage.id).
  string contact_message_id = 2;
  // The TenantMember.user_id of an active tenant_admin of the tenant, who is
  // the only kind of account that can work the inbox. Empty clears the
  // assignment. Any other account is invalid_argument.
  string assignee_user_id = 3;
}

message AssignContactMessageResponse {
  ContactMessage message = 1;
}

message UpdateContactMessageStaffNoteRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The message's primary key (ContactMessage.id).
  string contact_message_id = 2;
  // The whole note, replacing the one stored. Surrounding whitespace is
  // trimmed; what is left is at most 4000 characters, and empty clears it.
  string staff_note = 3;
}

message UpdateContactMessageStaffNoteResponse {
  ContactMessage message = 1;
}

message ReplyToContactMessageRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The message's primary key (ContactMessage.id).
  string contact_message_id = 2;
  // The answer. Surrounding whitespace is trimmed; what is left is required and
  // at most 4000 characters, the bounds of the reader's own message.
  string body = 3;
}

message ReplyToContactMessageResponse {
  // The message with the answer as its newest entry.
  ContactMessage message = 1;
}

service AdminContactService {
  // Lists the messages readers sent the tenant, newest first.
  //
  // Minimum role: tenant_admin.
  rpc ListContactMessages(ListContactMessagesRequest) returns (ListContactMessagesResponse) {}
  // Reads one message in full.
  //
  // Separate from the list because the list carries every message's whole body
  // already and a detail view is what a member of staff opens to answer from;
  // an inbox that has lost its page can reach one message without walking back
  // to it.
  //
  // Minimum role: tenant_admin.
  rpc GetContactMessage(GetContactMessageRequest) returns (GetContactMessageResponse) {}
  // Marks one message dealt with, or puts it back among the ones waiting. A
  // message put back keeps its assignee, so it is in_progress again when it
  // has one and unhandled when it has none.
  //
  // Marking a message that is already in the state asked for succeeds and
  // leaves the recorded time alone, so a repeated press does not move it.
  //
  // Minimum role: tenant_admin.
  rpc MarkContactMessageHandled(MarkContactMessageHandledRequest) returns (MarkContactMessageHandledResponse) {}
  // Assigns one message to a member of staff, moves it to another, or clears
  // the assignment.
  //
  // The assignee is stated rather than toggled, and it is independent of the
  // handled flag: marking the message handled or reopening it keeps it, so a
  // reopened message that has an assignee is in_progress again.
  //
  // Minimum role: tenant_admin.
  rpc AssignContactMessage(AssignContactMessageRequest) returns (AssignContactMessageResponse) {}
  // Saves, replaces, or clears the internal note on one message.
  //
  // Minimum role: tenant_admin.
  rpc UpdateContactMessageStaffNote(UpdateContactMessageStaffNoteRequest) returns (UpdateContactMessageStaffNoteResponse) {}
  // Answers one message: stores the answer as a staff entry under it, marks the
  // message handled, and queues the mail that takes the answer to the reader's
  // reply-to address.
  //
  // The mail is sent afterwards rather than by this call, so the answer is
  // stored whether or not the mail server is reachable, and it goes out from
  // the tenant's SMTP settings like every other mail of the tenant. The
  // reader's reply reaches the caller's own account address. A message already
  // handled keeps the time and the member of staff it was first marked with.
  //
  // Minimum role: tenant_admin.
  rpc ReplyToContactMessage(ReplyToContactMessageRequest) returns (ReplyToContactMessageResponse) {}
}
