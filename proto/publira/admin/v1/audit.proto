syntax = "proto3";

package publira.admin.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/admin/v1;publiraadminv1";

import "publira/types/v1/types.proto";

message AdminAuditLog {
  string actor_user_public_id = 1;
  string actor_name = 2;
  string actor_role = 3;
  string action = 4;
  string target_type = 5;
  string target_id = 6;
  string outcome = 7;
  string reason = 8;
  string client_ip = 9;
  string created_at = 10;
}

message ListAuditLogsRequest {
  reserved 3;
  reserved "cursor";

  publira.types.v1.TenantContext tenant = 1;
  int32 limit = 2;
  string actor_user_public_id = 4;
  string action = 5;
  string created_from = 6;
  string created_to = 7;
  // Opaque token from a previous response. Empty for the first page.
  string token = 8;
}

message ListAuditLogsResponse {
  reserved 2;
  reserved "next_cursor";

  repeated AdminAuditLog audit_logs = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 3;
  // Token for the next page. Empty on the last page.
  string next_token = 4;
}

service AdminAuditLogService {
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse) {}
}
