syntax = "proto3";

package publira.admin.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/admin/v1;publiraadminv1";

import "publira/types/v1/types.proto";

// Which readers an announcement's notification reaches.
enum AnnouncementDelivery {
  // Read as preferred, the delivery an announcement takes unless it is asked
  // for another.
  ANNOUNCEMENT_DELIVERY_UNSPECIFIED = 0;
  // Every reader whose notification preferences take announcements.
  ANNOUNCEMENT_DELIVERY_PREFERRED = 1;
  // Every reader, whatever their notification preferences say about
  // announcements: for a notice no reader may miss, such as a change of terms
  // or an outage.
  ANNOUNCEMENT_DELIVERY_EVERYONE = 2;
}

// One locale's title and body of an announcement.
message AnnouncementTranslation {
  string locale = 1;
  string title = 2;
  string body = 3;
}

// An announcement is addressed to everyone who opens the tenant's site; a
// message to one person is a notification.
message AdminAnnouncement {
  reserved 5, 6, 7;
  reserved "audience_type", "target_user_public_id", "target_user_name";

  string id = 1;
  // The title and body of the translation in the tenant's default locale, else
  // the oldest.
  string title = 2;
  string body = 3;
  string link_url = 4;
  string created_at = 8;
  // Whether the site shows this announcement as a banner above every page.
  bool pinned = 9;
  // RFC 3339 instant the banner stops at. Empty leaves it up until the console
  // takes it down.
  string pinned_until = 10;
  // Every translation of the announcement, oldest first.
  repeated AnnouncementTranslation translations = 11;
  // Which readers its notification reached. Never unspecified.
  AnnouncementDelivery delivery = 12;
}

// Cursor pagination. Field shape and token rules: proto/README.md.
message ListAnnouncementsRequest {
  // Removed with the move to cursor pagination.
  reserved 3;
  reserved "offset";

  publira.types.v1.TenantContext tenant = 1;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 4;
}

message ListAnnouncementsResponse {
  repeated AdminAnnouncement announcements = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

message CreateAnnouncementRequest {
  // 2 and 3 held the one title and body, before an announcement carried one per
  // locale in translations.
  reserved 2, 3, 5, 6;
  reserved "title", "body", "audience_type", "target_user_public_ids";

  publira.types.v1.TenantContext tenant = 1;
  // The announcement in every locale it is written in, at most one per locale,
  // each with a title and a body. The tenant's default locale is required, since
  // it is what a reader is shown in a locale nothing was written in. An empty
  // locale means the tenant's default locale; a locale the tenant does not
  // offer is invalid_argument. Each reader's notification is rendered once, in
  // the translation their last locale picks, so translations are sent together
  // here rather than added afterwards.
  repeated AnnouncementTranslation translations = 9;
  string link_url = 4;
  bool pinned = 7;
  // RFC 3339 instant the banner stops at. Empty pins it until the console takes
  // it down, and it is ignored when pinned is false.
  string pinned_until = 8;
  // Which readers the announcement's notification reaches. Unspecified is
  // preferred.
  AnnouncementDelivery delivery = 10;
}

message CreateAnnouncementResponse {
  reserved 1;
  reserved "announcements";

  AdminAnnouncement announcement = 2;
}

// Takes the banner down without deleting the announcement, which stays in the
// list it was posted to.
message UnpinAnnouncementRequest {
  publira.types.v1.TenantContext tenant = 1;
  string announcement_id = 2;
}

message UnpinAnnouncementResponse {}

service AdminAnnouncementService {
  // Minimum role: tenant_auditor.
  rpc ListAnnouncements(ListAnnouncementsRequest) returns (ListAnnouncementsResponse) {}
  // Minimum role: tenant_editor.
  rpc CreateAnnouncement(CreateAnnouncementRequest) returns (CreateAnnouncementResponse) {}
  // Minimum role: tenant_editor.
  rpc UnpinAnnouncement(UnpinAnnouncementRequest) returns (UnpinAnnouncementResponse) {}
}
