syntax = "proto3";

package publira.admin.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/admin/v1;publiraadminv1";

import "publira/types/v1/types.proto";

// Why a purchase stopped opening its episode.
enum PurchaseRevocationReason {
  // The purchase has not been revoked.
  PURCHASE_REVOCATION_REASON_UNSPECIFIED = 0;
  // The money went back to the reader in full.
  PURCHASE_REVOCATION_REASON_REFUND = 1;
  // The reader disputed the charge with their bank.
  PURCHASE_REVOCATION_REASON_DISPUTE = 2;
  // Staff refunded it through RefundPurchase.
  PURCHASE_REVOCATION_REASON_STAFF = 3;
}

// A reader's purchase of one episode, of one volume, of the rest of a series,
// or of a pack of the tenant's coins, as tenant staff see it. The episode
// fields are set on a purchase of an episode, the volume fields on a purchase
// of a volume, series_bundle on a purchase of the rest of a series, and
// coin_pack on a purchase of a pack, never two of them; the series fields name
// the series of any of the first three.
message AdminPurchase {
  // The purchase's primary key, a UUID.
  string id = 1;
  string episode_id = 2;
  string episode_public_id = 3;
  string episode_title = 4;
  // Empty on a purchase of a pack of coins, which is of no series.
  string series_public_id = 5;
  string series_title = 6;
  // The buyer. All three are empty once the reader has deleted their account,
  // which keeps the purchase but not who made it.
  string reader_public_id = 7;
  string reader_name = 8;
  string reader_email = 9;
  // What the reader paid, in the minor unit of currency. On a purchase paid
  // with coins it is what the coins spent were worth: each coin its part of
  // what the pack it came from was paid, the pack's bonus coins counting as
  // much as the rest, and a coin granted without a payment nothing. That is
  // the sale a royalty statement pays on.
  int64 price = 10;
  // The ISO 4217 code, in capitals, of the currency the reader paid in.
  string currency = 11;
  // RFC3339.
  string purchased_at = 12;
  // RFC3339; empty when the reading period does not run out.
  string expires_at = 13;
  // The payment provider the reader paid through, as its declaration names
  // it ("stripe", "payjp"), or "coins" for a purchase paid with the tenant's
  // coins. Empty for a purchase made in a store or granted without a payment.
  string provider = 14;
  // The store that charged the reader ("app_store", "google_play"). Empty for
  // every other purchase.
  string store = 15;
  // True for a payment made in the provider's or the store's test mode, which
  // no money reached the tenant through.
  bool test = 16;
  // The total the provider has reported refunded so far, in the minor unit of
  // currency. Zero while no refund has been reported. On a purchase paid with
  // coins it is what the coins from a pack refunded in full or disputed since
  // were worth; the reader keeps the episode, so it never reaches price with
  // refunded_at set.
  int64 refunded_amount = 17;
  // RFC3339; set once the refunded total reaches the price.
  string refunded_at = 18;
  // RFC3339; empty while the purchase still opens its episode, as long as its
  // reading period has not run out.
  string revoked_at = 19;
  PurchaseRevocationReason revocation_reason = 20;
  // True when RefundPurchase would ask the provider for a refund: the reader
  // paid through the tenant's current, enabled payment provider, and the
  // purchase is neither refunded in full, revoked, nor disputed. A store
  // purchase is refunded through the store and never here. While
  // refund_requested_amount is set, only RefundPurchaseInPart for that amount
  // asks.
  bool refundable = 21;
  string volume_id = 22;
  string volume_public_id = 23;
  string volume_title = 24;
  publira.types.v1.SeriesBundle series_bundle = 25;
  // The pack of coins bought, set on a purchase of one, which names no
  // episode, volume, or series. Its coins are revoked once the purchase is
  // refunded in full or disputed.
  publira.types.v1.PurchasedCoinPack coin_pack = 26;
  // The tenant's word for its coins in the tenant's default locale, set
  // beside coin_pack.
  string coin_name = 27;
  // What of a refund in part staff asked for through RefundPurchaseInPart the
  // provider has yet to report, in the minor unit of currency. Zero while no
  // such refund is waiting. The purchase keeps opening its episode meanwhile.
  int64 refund_requested_amount = 28;
}

// Cursor pagination, newest purchase first. Field shape and token rules:
// proto/README.md. Every filter left empty is no filter, and changing one
// starts again from the first page.
message ListPurchasesRequest {
  publira.types.v1.TenantContext tenant = 1;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 3;
  // Only purchases of an episode, a volume, or the rest of this series.
  string series_public_id = 4;
  // Only purchases of this episode.
  string episode_public_id = 5;
  // Only purchases by the reader whose account holds this address, matched
  // whole but regardless of case.
  string reader_email = 6;
  // RFC3339. Only purchases made at or after this instant.
  string purchased_from = 7;
  // RFC3339. Only purchases made before this instant.
  string purchased_to = 8;
}

message ListPurchasesResponse {
  repeated AdminPurchase purchases = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

// Cursor pagination, newest purchase first. Field shape and token rules:
// proto/README.md.
message ListReaderPurchasesRequest {
  publira.types.v1.TenantContext tenant = 1;
  // Required. The reader whose purchases to list, named by AdminReader.id.
  string reader_id = 2;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 3;
  // Opaque token from a previous response. Empty for the first page. A token
  // issued for another reader is invalid_argument.
  string token = 4;
}

message ListReaderPurchasesResponse {
  repeated AdminPurchase purchases = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

message GetPurchaseRequest {
  publira.types.v1.TenantContext tenant = 1;
  string purchase_id = 2;
}

message GetPurchaseResponse {
  AdminPurchase purchase = 1;
}

message RefundPurchaseRequest {
  publira.types.v1.TenantContext tenant = 1;
  string purchase_id = 2;
  // Required. Why staff are giving the reader their money back, recorded on
  // the audit log entry of the refund, which is the only record of who
  // decided it and why.
  string reason = 3;
}

message RefundPurchaseResponse {
  AdminPurchase purchase = 1;
}

message RefundPurchaseInPartRequest {
  publira.types.v1.TenantContext tenant = 1;
  string purchase_id = 2;
  // Required. What to give back, in the minor unit of the purchase's
  // currency: above zero, and at most what the provider has not reported
  // refunded yet.
  int64 amount = 3;
  // Required, as on RefundPurchaseRequest.
  string reason = 4;
}

message RefundPurchaseInPartResponse {
  AdminPurchase purchase = 1;
}

service AdminPurchaseService {
  // Minimum role: tenant_admin.
  rpc ListPurchases(ListPurchasesRequest) returns (ListPurchasesResponse) {}
  // Lists one reader's purchases, as ListPurchases lists the tenant's.
  // not_found for a reader of another tenant, as GetReader answers it, and
  // invalid_argument with a field violation on reader_id for an empty one or
  // one that is not a UUID.
  //
  // Minimum role: tenant_admin.
  rpc ListReaderPurchases(ListReaderPurchasesRequest) returns (ListReaderPurchasesResponse) {}
  // Minimum role: tenant_admin.
  rpc GetPurchase(GetPurchaseRequest) returns (GetPurchaseResponse) {}
  // Asks the provider the reader paid through to refund whatever of the
  // payment it has not refunded yet, and revokes the purchase at once, with
  // staff as the reason; the amount refunded is recorded when the provider's
  // notification of it arrives, and a refund the provider reports failed or
  // canceled takes the revocation back. Asking again after that is a new
  // attempt, which the provider is sent under a new idempotency key.
  //
  // A purchase already refunded in full comes back as it is, without a
  // request to the provider, and so does one the provider reports refunded in
  // full already, which is left for that notification to revoke. One staff
  // revoked already with no refund recorded yet is asked of the provider
  // again under the same idempotency key, which refunds nothing twice and
  // records nothing more. A store purchase, a purchase made without a
  // payment, a disputed one, one paid through a provider the tenant no longer
  // has enabled, and one with a refund in part waiting for the provider are
  // failed_precondition, as is a refund the provider refuses. An empty reason
  // is invalid_argument with a field violation on reason.
  //
  // A purchase of a pack of coins is refunded the same way. Its coins are
  // taken back once the provider reports the refund in full rather than when
  // staff ask, so a refund the provider refuses leaves the reader's coins as
  // they were.
  //
  // Minimum role: tenant_admin.
  rpc RefundPurchase(RefundPurchaseRequest) returns (RefundPurchaseResponse) {}
  // Asks the provider the reader paid through to refund amount of the
  // payment, and leaves the purchase opening its episode, as a refund in part
  // the provider reports does. The purchase shows the amount as
  // refund_requested_amount until the provider's notification of it arrives,
  // which records it as refunded; a refund the provider refuses takes the
  // request back, and asking again after that is a new attempt. An amount
  // that is all the provider has not reported refunded yet is RefundPurchase.
  // It is an RPC of its own rather than an amount on RefundPurchase because a
  // server that predates it answers unimplemented, where one that predates the
  // field would refund the whole payment.
  //
  // While the refund waits, asking again for the same amount is sent under
  // the same idempotency key, which refunds nothing twice; another amount,
  // and RefundPurchase, are failed_precondition until the provider has
  // reported it. A purchase of a pack of coins is failed_precondition, as is
  // every purchase RefundPurchase refuses with it. An amount of zero or less,
  // or above what is left to refund, is invalid_argument with a field
  // violation on amount, and an empty reason one on reason.
  //
  // Minimum role: tenant_admin.
  rpc RefundPurchaseInPart(RefundPurchaseInPartRequest) returns (RefundPurchaseInPartResponse) {}
}
