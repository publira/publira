syntax = "proto3";

package publira.admin.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/admin/v1;publiraadminv1";

import "publira/types/v1/types.proto";

enum RoyaltyCloseMode {
  ROYALTY_CLOSE_MODE_UNSPECIFIED = 0;
  ROYALTY_CLOSE_MODE_MANUAL = 1;
  ROYALTY_CLOSE_MODE_AUTOMATIC = 2;
}

// The tenant's policy for closing completed royalty months.
message RoyaltyConfig {
  RoyaltyCloseMode close_mode = 1;
  // Day 1–28 of the following month when automatic closing runs. It is set
  // only when close_mode is automatic.
  optional int32 auto_close_day = 2;
  // When automatic closing was most recently enabled, as RFC 3339.
  string automatic_since = 3;
}

message GetRoyaltyConfigRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message GetRoyaltyConfigResponse {
  RoyaltyConfig config = 1;
}

message UpdateRoyaltyConfigRequest {
  publira.types.v1.TenantContext tenant = 1;
  RoyaltyCloseMode close_mode = 2;
  optional int32 auto_close_day = 3;
}

message UpdateRoyaltyConfigResponse {
  RoyaltyConfig config = 1;
}

// The figures of one month: its own sales and the subscription payments it
// shares, the refunds it carries of earlier months' sales and payments, and
// what its lines pay out. Amounts are integers in the minor
// unit of the currency of the statement or preview they belong to, and count
// only the sales paid in it.
message RoyaltyStatementTotals {
  // What the month sold, each sale counted once however many creators it is
  // credited to, and the subscription payments it shares, each counted once
  // in the same way. A fully refunded sale or payment is not counted, and
  // neither is a payment shared to no one.
  int64 gross = 1;
  // Partial refunds of the sales and payments in gross.
  int64 refunded = 2;
  // The sum of the lines' payouts, the adjustment lines included, so negative
  // for a month whose refunds of earlier sales outweigh its own. The rest of
  // gross net of refunds and adjustment is the tenant's own.
  int64 payout = 3;
  // The net sales and shared payments of earlier closed months that refunds
  // recorded since their close take back, each sale and payment counted once:
  // zero, or a negative amount. The adjustment lines carry it to the
  // creators.
  int64 adjustment = 4;
}

// A closed month.
message RoyaltyStatement {
  // The month, as YYYY-MM.
  string period = 1;
  // The IANA zone the month was cut in: the tenant's zone at close.
  string time_zone = 2;
  string closed_at = 3;
  // The account that closed the month. Both empty for a close no user started
  // and once the account is deleted.
  string closed_by_user_public_id = 4;
  string closed_by_user_name = 5;
  RoyaltyStatementTotals totals = 6;
  // The ISO 4217 code the totals and lines are in: the tenant's at close. A
  // statement keeps it after the tenant's changes.
  string currency = 7;
}

// What one line of a royalty statement credits.
enum RoyaltyLineSource {
  ROYALTY_LINE_SOURCE_UNSPECIFIED = 0;
  // The episode's sales.
  ROYALTY_LINE_SOURCE_SALE = 1;
  // The parts of subscription payments shared to the episode. A payment is
  // counted in the month its period ends in, and shared evenly among the
  // episodes of its plan its subscriber first finished in that period; one
  // whose subscriber finished none is shared to no one.
  ROYALTY_LINE_SOURCE_SUBSCRIPTION = 2;
}

// One creator's credit on one episode for one role, with that episode's sales
// in the month, or the parts of the month's subscription payments shared to
// it. Names are as they stood at close; a public ID is empty once the
// row it named has been deleted.
//
// A line with adjusted_period set is an adjustment instead: it carries the
// refunds recorded since that earlier month was closed on the sales one of its
// lines counted, with that line's names and share. Its figures are changes and
// never positive: sale_count is minus the sales refunded in full, gross_amount
// minus their price, and refunded_amount the change in what is refunded of the
// sales counted, negative when a sale partly refunded at close was then
// refunded in full. Adjustment lines follow the month's own lines, oldest
// adjusted month first.
//
// On a subscription line, sale_count is the payments shared to the episode,
// gross_amount the parts of them it was given, and refunded_amount the same
// parts of their partial refunds. The month's own sales lines come first,
// then its subscription lines, then the adjustment lines.
message RoyaltyStatementLine {
  // Position in the statement, from 1.
  int32 line_number = 1;
  string creator_public_id = 2;
  string creator_name = 3;
  string series_public_id = 4;
  string series_title = 5;
  string episode_public_id = 6;
  string episode_title = 7;
  // Both empty for a credit that states no role.
  string role_public_id = 8;
  string role_name = 9;
  int32 sale_count = 10;
  int64 gross_amount = 11;
  int64 refunded_amount = 12;
  // The credit's share in basis points (10000 is all of it), as applied.
  int32 share_bps = 13;
  // On a line of sales, (gross_amount - refunded_amount) * share_bps / 10000,
  // floored to the minor unit of the statement's currency. On an adjustment,
  // what its refunds take off the payout of the line it adjusts: that line's
  // payout worked out the same way over its net after them, less the same
  // over its net before them. A line and its adjustments therefore pay
  // nothing once every sale in the line is refunded.
  int64 payout_amount = 14;
  // YYYY-MM of the closed month an adjustment line adjusts. Empty for a line
  // of the month's own sales.
  string adjusted_period = 15;
  // What the line credits. An adjustment line has the source of the line it
  // adjusts.
  RoyaltyLineSource source = 16;
}

message PreviewRoyaltyStatementRequest {
  publira.types.v1.TenantContext tenant = 1;
  // YYYY-MM. The current month and months already over are both accepted.
  string period = 2;
}

message PreviewRoyaltyStatementResponse {
  string period = 1;
  // The tenant's current zone, which the month's own midnights are in.
  string time_zone = 2;
  RoyaltyStatementTotals totals = 3;
  // The month's own lines, then the adjustments for the refunds recorded so
  // far on sales of earlier closed months, which closing the month now would
  // carry.
  repeated RoyaltyStatementLine lines = 4;
  // RFC 3339 instants of the half-open range the month counts sales in. Each
  // is the month's own midnight in time_zone unless the month next to it is
  // closed: the month then starts where the statement before it ended and ends
  // where the statement after it started, so that a zone changed since that
  // close leaves no hour counted twice and none left out.
  string starts_at = 5;
  string ends_at = 6;
  // The ISO 4217 code the totals and lines are in: the tenant's current one,
  // which closing the month now would record.
  string currency = 7;
}

message CloseRoyaltyStatementRequest {
  publira.types.v1.TenantContext tenant = 1;
  // YYYY-MM of a month that is already over in the tenant's zone.
  string period = 2;
}

message CloseRoyaltyStatementResponse {
  RoyaltyStatement statement = 1;
}

// Cursor pagination. Field shape and token rules: proto/README.md.
message ListRoyaltyStatementsRequest {
  publira.types.v1.TenantContext tenant = 1;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 3;
}

message ListRoyaltyStatementsResponse {
  repeated RoyaltyStatement statements = 1;
  string previous_token = 2;
  string next_token = 3;
}

// Cursor pagination over the lines. Field shape and token rules:
// proto/README.md.
message GetRoyaltyStatementRequest {
  publira.types.v1.TenantContext tenant = 1;
  // YYYY-MM.
  string period = 2;
  // Max lines in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 3;
  // Opaque token from a previous response. Empty for the first page. A token
  // issued for another period is invalid_argument.
  string token = 4;
}

message GetRoyaltyStatementResponse {
  RoyaltyStatement statement = 1;
  repeated RoyaltyStatementLine lines = 2;
  string previous_token = 3;
  string next_token = 4;
}

message ExportRoyaltyStatementRequest {
  publira.types.v1.TenantContext tenant = 1;
  // YYYY-MM of a closed month.
  string period = 2;
}

message ExportRoyaltyStatementResponse {
  // The statement as CSV: UTF-8 with a byte order mark, CRLF line endings,
  // RFC 4180 quoting. A header row, then one row per line in line order, with
  // no summary row; the totals are those of GetRoyaltyStatement. Columns:
  //
  //   period            YYYY-MM
  //   creator_id        the creator's ID, as closed
  //   creator_name      as closed
  //   role_id           the role's ID, as closed; empty for a credit with no role
  //   role_name         as closed; empty for a credit with no role
  //   series_id         the series' ID, as closed
  //   series_title      as closed
  //   episode_id        the episode's ID, as closed
  //   episode_title     as closed
  //   sale_count        integer
  //   gross_amount      an integer in the minor unit of currency, no currency
  //                     symbol
  //   refunded_amount   an integer in the minor unit of currency, no currency
  //                     symbol
  //   share_percent     the share with two decimals, 12.50 for 1250 bps
  //   payout_amount     an integer in the minor unit of currency, no currency
  //                     symbol
  //   currency          the statement's ISO 4217 code, the same on every row
  //   adjusted_period   YYYY-MM of the closed month an adjustment line
  //                     adjusts; empty for a line of the month's own sales.
  //                     The amounts of an adjustment line are changes, zero
  //                     or negative, as RoyaltyStatementLine describes
  //   source            sale or subscription, what the line credits, as
  //                     RoyaltyLineSource describes
  //
  // The IDs are the rows' internal IDs, not their public IDs, and they stay
  // on the line after the row is deleted.
  bytes csv = 1;
}

// Creator royalties. Every RPC here is limited to the tenant admin role.
service AdminRoyaltyService {
  // Reads the close policy. Tenants that have not selected one read as manual.
  //
  // Minimum role: tenant_admin.
  rpc GetRoyaltyConfig(GetRoyaltyConfigRequest) returns (GetRoyaltyConfigResponse) {}
  // Updates the close policy. Automatic closing requires a day from 1 through 28.
  //
  // Minimum role: tenant_admin.
  rpc UpdateRoyaltyConfig(UpdateRoyaltyConfigRequest) returns (UpdateRoyaltyConfigResponse) {}
  // Computes a month that is not closed, exactly as closing it now would.
  // failed_precondition for a month already closed, and for a month that has
  // not started yet.
  //
  // Minimum role: tenant_admin.
  rpc PreviewRoyaltyStatement(PreviewRoyaltyStatementRequest) returns (PreviewRoyaltyStatementResponse) {}
  // Closes a month into a statement that never changes afterwards: a later
  // edit of a share, a creator or a catalog row, and a refund recorded after
  // the close, all leave it as it was closed. A closed month is never reopened.
  // A refund recorded after a month was closed is carried instead into the
  // first statement closed after it for a later month, as adjustment lines at
  // the shares the closed month applied, and each part of a refund is carried
  // once. already_exists for a month that is already closed,
  // failed_precondition for a month that is not over yet.
  //
  // Minimum role: tenant_admin.
  rpc CloseRoyaltyStatement(CloseRoyaltyStatementRequest) returns (CloseRoyaltyStatementResponse) {}
  // Lists the closed months, newest first.
  //
  // Minimum role: tenant_admin.
  rpc ListRoyaltyStatements(ListRoyaltyStatementsRequest) returns (ListRoyaltyStatementsResponse) {}
  // Reads a closed month and a page of its lines. not_found for a month that
  // is not closed.
  //
  // Minimum role: tenant_admin.
  rpc GetRoyaltyStatement(GetRoyaltyStatementRequest) returns (GetRoyaltyStatementResponse) {}
  // Exports a closed month as CSV, built from the stored lines alone, so the
  // same month exports the same bytes every time. failed_precondition for a
  // month that is not closed; the console previews an open month instead.
  //
  // Minimum role: tenant_admin.
  rpc ExportRoyaltyStatement(ExportRoyaltyStatementRequest) returns (ExportRoyaltyStatementResponse) {}
}
