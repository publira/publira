syntax = "proto3";

package publira.admin.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/admin/v1;publiraadminv1";

import "publira/types/v1/types.proto";

// Creates the page together with its translation in the tenant's default
// locale, titled title, so a page never exists without a translation.
message CreatePageRequest {
  publira.types.v1.TenantContext tenant = 1;
  string slug = 2;
  string title = 3;
  bool display_in_footer = 4;
}

message CreatePageResponse {
  publira.types.v1.Page page = 1;
}

message UpdatePageRequest {
  publira.types.v1.TenantContext tenant = 1;
  string page_id = 2;
  string title = 3;
  // optional so title-only updates do not clear an existing true value
  // (proto3 non-optional bool maps omitted fields to false).
  optional bool display_in_footer = 4;
  string locale = 5;
}

message UpdatePageResponse {
  publira.types.v1.Page page = 1;
}

// Cursor pagination. Field shape and token rules: proto/README.md.
message ListPagesRequest {
  publira.types.v1.TenantContext tenant = 1;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 3;
}

message ListPagesResponse {
  repeated publira.types.v1.Page pages = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

message GetPageRequest {
  publira.types.v1.TenantContext tenant = 1;
  string page_id = 2;
  string locale = 3;
}

message GetPageResponse {
  publira.types.v1.Page page = 1;
}

message CreateVersionRequest {
  publira.types.v1.TenantContext tenant = 1;
  string page_id = 2;
  string content_markdown = 3;
  string locale = 4;
}

message CreateVersionResponse {
  publira.types.v1.PageVersion version = 1;
}

message ListVersionsRequest {
  publira.types.v1.TenantContext tenant = 1;
  string page_id = 2;
  string locale = 3;
}

message ListVersionsResponse {
  repeated publira.types.v1.PageVersion versions = 1;
}

message PublishVersionRequest {
  publira.types.v1.TenantContext tenant = 1;
  string page_id = 2;
  string version_id = 3;
  string locale = 4;
}

message PublishVersionResponse {
  publira.types.v1.PageVersion version = 1;
}

message UnpublishPageRequest {
  publira.types.v1.TenantContext tenant = 1;
  string page_id = 2;
  string locale = 3;
}

message UnpublishPageResponse {
  publira.types.v1.Page page = 1;
}

message RollbackToVersionRequest {
  publira.types.v1.TenantContext tenant = 1;
  string page_id = 2;
  string version_id = 3;
  string locale = 4;
}

message RollbackToVersionResponse {
  publira.types.v1.PageVersion version = 1;
}

message CreatePageTranslationRequest {
  publira.types.v1.TenantContext tenant = 1;
  string page_id = 2;
  // A supported UI locale the page has no translation in yet.
  string locale = 3;
  string title = 4;
}

message CreatePageTranslationResponse {
  publira.types.v1.PageTranslation translation = 1;
}

message ListPageTranslationsRequest {
  publira.types.v1.TenantContext tenant = 1;
  string page_id = 2;
}

message ListPageTranslationsResponse {
  // Oldest first. Never empty for a page the tenant has.
  repeated publira.types.v1.PageTranslation translations = 1;
}

message DeletePageTranslationRequest {
  publira.types.v1.TenantContext tenant = 1;
  string page_id = 2;
  string locale = 3;
}

message DeletePageTranslationResponse {}

// A request that carries a locale beside a page_id works on that one
// translation. An empty locale means the translation page_translation_for picks
// for the tenant's default locale; any other must name a translation the page
// has, or the call is not_found, so an edit aimed at one language never lands
// on another.
service AdminPagesService {
  rpc CreatePage(CreatePageRequest) returns (CreatePageResponse) {}
  rpc UpdatePage(UpdatePageRequest) returns (UpdatePageResponse) {}
  rpc ListPages(ListPagesRequest) returns (ListPagesResponse) {}
  rpc GetPage(GetPageRequest) returns (GetPageResponse) {}
  rpc CreateVersion(CreateVersionRequest) returns (CreateVersionResponse) {}
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse) {}
  rpc PublishVersion(PublishVersionRequest) returns (PublishVersionResponse) {}
  // Clears the page's published version. The versions themselves are kept, so
  // the page can go back up without its body being entered again.
  rpc UnpublishPage(UnpublishPageRequest) returns (UnpublishPageResponse) {}
  rpc RollbackToVersion(RollbackToVersionRequest) returns (RollbackToVersionResponse) {}
  rpc CreatePageTranslation(CreatePageTranslationRequest) returns (CreatePageTranslationResponse) {}
  rpc ListPageTranslations(ListPageTranslationsRequest) returns (ListPageTranslationsResponse) {}
  // Deletes one translation with its versions. A page's last translation
  // cannot be deleted (failed_precondition).
  rpc DeletePageTranslation(DeletePageTranslationRequest) returns (DeletePageTranslationResponse) {}
}
