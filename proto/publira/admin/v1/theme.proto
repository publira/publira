syntax = "proto3";

package publira.admin.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/admin/v1;publiraadminv1";

import "publira/types/v1/types.proto";

message GetTenantThemeRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message GetTenantThemeResponse {
  publira.types.v1.TenantTheme theme = 1;
}

message UpsertTenantThemeRequest {
  publira.types.v1.TenantContext tenant = 1;
  publira.types.v1.TenantTheme theme = 2;
}

message UpsertTenantThemeResponse {
  publira.types.v1.TenantTheme theme = 1;
}

message GetTenantDarkThemeRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message GetTenantDarkThemeResponse {
  // Absent where the tenant has saved no dark palette.
  publira.types.v1.TenantThemePalette dark_theme = 1;
}

// Every color is required and held to the rules UpsertTenantThemeRequest
// holds the light palette to: a #RRGGBB code, and a contrast of at least 4.5:1
// between each color and its foreground. A violation is invalid_argument on
// the field, named under dark_theme.
message UpsertTenantDarkThemeRequest {
  publira.types.v1.TenantContext tenant = 1;
  publira.types.v1.TenantThemePalette dark_theme = 2;
}

message UpsertTenantDarkThemeResponse {
  publira.types.v1.TenantThemePalette dark_theme = 1;
}

// Deleting leaves the tenant without a dark palette, which is not an error
// for a tenant that has none.
message DeleteTenantDarkThemeRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message DeleteTenantDarkThemeResponse {}

// Uploading again replaces the stored icon, so there is no separate replace
// RPC.
message UploadTenantIconRequest {
  publira.types.v1.TenantContext tenant = 1;
  bytes icon_data = 2;
  string icon_content_type = 3;
}

message UploadTenantIconResponse {
  publira.types.v1.TenantTheme theme = 1;
}

message DeleteTenantIconRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message DeleteTenantIconResponse {
  publira.types.v1.TenantTheme theme = 1;
}

// Uploading again replaces the stored logo, so there is no separate replace
// RPC.
message UploadTenantLogoRequest {
  publira.types.v1.TenantContext tenant = 1;
  bytes logo_data = 2;
  string logo_content_type = 3;
}

message UploadTenantLogoResponse {
  publira.types.v1.TenantTheme theme = 1;
}

message DeleteTenantLogoRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message DeleteTenantLogoResponse {
  publira.types.v1.TenantTheme theme = 1;
}

// Uploading again replaces the stored sign-in image, so there is no separate
// replace RPC.
message UploadTenantSignInImageRequest {
  publira.types.v1.TenantContext tenant = 1;
  bytes image_data = 2;
  string image_content_type = 3;
}

message UploadTenantSignInImageResponse {
  publira.types.v1.TenantTheme theme = 1;
}

message DeleteTenantSignInImageRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message DeleteTenantSignInImageResponse {
  publira.types.v1.TenantTheme theme = 1;
}

service TenantThemeService {
  // Minimum role: tenant_auditor.
  rpc GetTenantTheme(GetTenantThemeRequest) returns (GetTenantThemeResponse) {}
  // Minimum role: tenant_admin.
  rpc UpsertTenantTheme(UpsertTenantThemeRequest) returns (UpsertTenantThemeResponse) {}
  // Minimum role: tenant_admin.
  rpc UploadTenantIcon(UploadTenantIconRequest) returns (UploadTenantIconResponse) {}
  // Minimum role: tenant_admin.
  rpc DeleteTenantIcon(DeleteTenantIconRequest) returns (DeleteTenantIconResponse) {}
  // Minimum role: tenant_admin.
  rpc UploadTenantLogo(UploadTenantLogoRequest) returns (UploadTenantLogoResponse) {}
  // Minimum role: tenant_admin.
  rpc DeleteTenantLogo(DeleteTenantLogoRequest) returns (DeleteTenantLogoResponse) {}
  // Minimum role: tenant_admin.
  rpc UploadTenantSignInImage(UploadTenantSignInImageRequest) returns (UploadTenantSignInImageResponse) {}
  // Minimum role: tenant_admin.
  rpc DeleteTenantSignInImage(DeleteTenantSignInImageRequest) returns (DeleteTenantSignInImageResponse) {}
  // Minimum role: tenant_auditor.
  rpc GetTenantDarkTheme(GetTenantDarkThemeRequest) returns (GetTenantDarkThemeResponse) {}
  // Minimum role: tenant_admin.
  rpc UpsertTenantDarkTheme(UpsertTenantDarkThemeRequest) returns (UpsertTenantDarkThemeResponse) {}
  // Minimum role: tenant_admin.
  rpc DeleteTenantDarkTheme(DeleteTenantDarkThemeRequest) returns (DeleteTenantDarkThemeResponse) {}
}
