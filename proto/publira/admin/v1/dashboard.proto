syntax = "proto3";

package publira.admin.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/admin/v1;publiraadminv1";

import "publira/types/v1/types.proto";

message GetDashboardRequest {
  publira.types.v1.TenantContext tenant = 1;
}

message DashboardStats {
  int32 published_series_count = 1;
  int32 draft_episode_count = 2;
  int32 scheduled_episode_count = 3;
}

message DashboardQueueItem {
  string series_public_id = 1;
  string series_title = 2;
  string episode_public_id = 3;
  string episode_title = 4;
  string status = 5;
  string scheduled_at = 6;
}

message GetDashboardResponse {
  DashboardStats stats = 1;
  repeated DashboardQueueItem queue = 2;
}

service AdminDashboardService {
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);
}
