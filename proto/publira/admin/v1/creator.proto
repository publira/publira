syntax = "proto3";

package publira.admin.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/admin/v1;publiraadminv1";

import "publira/admin/v1/user.proto";
import "publira/types/v1/types.proto";

// Cursor pagination. Field shape and token rules: proto/README.md.
message ListCreatorsRequest {
  // Removed with the move to cursor pagination.
  reserved 3;
  reserved "offset";

  publira.types.v1.TenantContext tenant = 1;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 4;
}

message ListCreatorsResponse {
  repeated publira.types.v1.Creator creators = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

message GetCreatorRequest {
  publira.types.v1.TenantContext tenant = 1;
  string public_id = 2;
}

message GetCreatorResponse {
  publira.types.v1.Creator creator = 1;
  // The reader accounts linked to the creator, oldest link first. Readers are
  // the tenant admin's to see, so it is empty for any other role.
  repeated CreatorAccount accounts = 2;
}

// A reader account linked to a creator: the tenant's record that this account
// belongs to the person credited under that creator.
message CreatorAccount {
  // birth_date is always empty here, as it is in ListReaders.
  AdminReader reader = 1;
  // When the link was made, RFC3339.
  string linked_at = 2;
}

// Cursor pagination. Field shape and token rules: proto/README.md.
message ListCreatorCreditsRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The creator's primary key (Creator.id).
  string creator_id = 2;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 3;
  // Opaque token from a previous response. Empty for the first page.
  string token = 4;
}

message ListCreatorCreditsResponse {
  // Grouped by series, the series in the order they were created: the credit
  // on the series itself first, then those on its episodes in reading order,
  // and two roles held on one of them in a fixed order of their own.
  repeated CreatorCredit credits = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

// One credit naming a creator: on a series when episode is unset, on that
// episode of the series when it is set. A person credited in two roles on the
// same series or episode is two credits.
message CreatorCredit {
  // The series the credit is on, or the series of the episode it is on.
  CreditedSeries series = 1;
  // The episode the credit is on. Unset for a credit on the series itself.
  CreditedEpisode episode = 2;
  // The role the credit is held in. Unset for a credit written before the
  // tenant had roles, which states none.
  publira.types.v1.CreatorRole role = 3;
  // Where an episode credit was written: baked from the series, which a range
  // edit with BulkEditEpisodeCredits reaches, or added on the episode alone,
  // which only ReplaceEpisodeCredits does. Unspecified for a series credit.
  publira.types.v1.CreatorCreditSource source = 4;
}

// The series a credit names, in as much as the console needs to link to it.
message CreditedSeries {
  // The series' primary key, which the admin API addresses it by.
  string id = 1;
  string public_id = 2;
  // In the tenant's default locale, or the series' oldest translation when
  // it has none in that locale.
  string title = 3;
}

// The episode a credit names, in as much as the console needs to link to it.
message CreditedEpisode {
  // The episode's primary key, which the admin API addresses it by.
  string id = 1;
  string public_id = 2;
  // In the tenant's default locale, or the episode's oldest translation when
  // it has none in that locale.
  string title = 3;
}

message CreateCreatorRequest {
  publira.types.v1.TenantContext tenant = 1;
  string name = 2;
  string profile_text = 3;
  bytes icon_image_data = 4;
  string icon_image_content_type = 5;
  // Where in the upload the square icon is cut. Omitted, the image is cut
  // from its centre as it always has been.
  publira.types.v1.ImageCropRect icon_image_crop = 6;
}

message CreateCreatorResponse {
  publira.types.v1.Creator creator = 1;
}

message UpdateCreatorRequest {
  publira.types.v1.TenantContext tenant = 1;
  reserved 2;
  reserved "public_id";
  string name = 3;
  string profile_text = 4;
  bytes icon_image_data = 5;
  string icon_image_content_type = 6;
  bool clear_icon_image = 7;
  // Where in the upload the square icon is cut. Omitted, the image is cut
  // from its centre as it always has been.
  publira.types.v1.ImageCropRect icon_image_crop = 8;
  // The creator's primary key (Creator.id).
  string creator_id = 9;
}

message UpdateCreatorResponse {
  publira.types.v1.Creator creator = 1;
}

// Deletes a creator that nothing refers to: one entered with a typo, or one
// entered twice for the same person. Their icon goes with them, and so do the
// reader follows of them. They leave the creator list, their page, the
// sitemap, and the search index, and the objects of their icon are reclaimed
// by the orphan image sweep. The audit log keeps the creator's public id and
// name.
//
// A creator something refers to is failed_precondition with an ErrorInfo
// reason naming the first of these, in this order:
//
//   - CREATOR_CREDITED: a credit on a series or an episode, whatever its
//     state. Remove it with UpdateSeries, ReplaceEpisodeCredits, or
//     BulkEditEpisodeCredits first.
//   - CREATOR_ON_ROYALTY_STATEMENT: a line of a royalty statement, which is
//     kept as it was closed.
//   - CREATOR_HAS_LINKED_ACCOUNT: a reader account linked to them. Remove the
//     link with UnlinkCreatorAccount first.
//
// Nothing is deleted with the refusal.
// A creator that does not exist, a second request for one deleted already
// included, is not_found.
message DeleteCreatorRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The creator's primary key (Creator.id).
  string creator_id = 2;
}

message DeleteCreatorResponse {}

message LinkCreatorAccountRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The creator's primary key (Creator.id).
  string creator_id = 2;
  // The reader's primary key (AdminReader.id).
  string reader_id = 3;
}

message LinkCreatorAccountResponse {
  // Every account linked to the creator after the write, oldest link first.
  repeated CreatorAccount accounts = 1;
}

message UnlinkCreatorAccountRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The creator's primary key (Creator.id).
  string creator_id = 2;
  // The reader's primary key (AdminReader.id).
  string reader_id = 3;
}

message UnlinkCreatorAccountResponse {
  // Every account linked to the creator after the write, oldest link first.
  repeated CreatorAccount accounts = 1;
}

service AdminCreatorService {
  // Minimum role: tenant_auditor.
  rpc ListCreators(ListCreatorsRequest) returns (ListCreatorsResponse) {}
  // Minimum role: tenant_auditor.
  rpc GetCreator(GetCreatorRequest) returns (GetCreatorResponse) {}
  // Every credit naming the creator, on a series or on an episode, whatever
  // the state of the series or the episode: what DeleteCreator refuses with
  // CREATOR_CREDITED while any is left. not_found for a creator that does not
  // exist or belongs to another tenant.
  //
  // Minimum role: tenant_auditor.
  rpc ListCreatorCredits(ListCreatorCreditsRequest) returns (ListCreatorCreditsResponse) {}
  // Minimum role: tenant_editor.
  rpc CreateCreator(CreateCreatorRequest) returns (CreateCreatorResponse) {}
  // Minimum role: tenant_editor.
  rpc UpdateCreator(UpdateCreatorRequest) returns (UpdateCreatorResponse) {}
  // Minimum role: tenant_admin.
  rpc DeleteCreator(DeleteCreatorRequest) returns (DeleteCreatorResponse) {}
  // Links a reader account to a creator. One account may be linked to several
  // creators and one creator to several accounts. Linking a pair that is
  // already linked changes nothing and records nothing. not_found for a
  // creator or an account of another tenant and for a staff account;
  // failed_precondition for a reader who is not active.
  //
  // Minimum role: tenant_admin.
  rpc LinkCreatorAccount(LinkCreatorAccountRequest) returns (LinkCreatorAccountResponse) {}
  // Removes a link. Unlinking a pair that is not linked changes nothing and
  // records nothing. not_found for a creator of another tenant.
  //
  // Minimum role: tenant_admin.
  rpc UnlinkCreatorAccount(UnlinkCreatorAccountRequest) returns (UnlinkCreatorAccountResponse) {}
}
