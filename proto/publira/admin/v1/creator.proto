syntax = "proto3";

package publira.admin.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/admin/v1;publiraadminv1";

import "publira/admin/v1/user.proto";
import "publira/types/v1/types.proto";

// Cursor pagination. Field shape and token rules: proto/README.md.
message ListCreatorsRequest {
  // Removed with the move to cursor pagination.
  reserved 3;
  reserved "offset";

  publira.types.v1.TenantContext tenant = 1;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 4;
}

message ListCreatorsResponse {
  repeated publira.types.v1.Creator creators = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

message GetCreatorRequest {
  publira.types.v1.TenantContext tenant = 1;
  string public_id = 2;
}

message GetCreatorResponse {
  publira.types.v1.Creator creator = 1;
  // The reader accounts linked to the creator, oldest link first. Readers are
  // the tenant admin's to see, so it is empty for any other role.
  repeated CreatorAccount accounts = 2;
}

// A reader account linked to a creator: the tenant's record that this account
// belongs to the person credited under that creator.
message CreatorAccount {
  // birth_date is always empty here, as it is in ListReaders.
  AdminReader reader = 1;
  // When the link was made, RFC3339.
  string linked_at = 2;
}

message CreateCreatorRequest {
  publira.types.v1.TenantContext tenant = 1;
  string name = 2;
  string profile_text = 3;
  bytes icon_image_data = 4;
  string icon_image_content_type = 5;
  // Where in the upload the square icon is cut. Omitted, the image is cut
  // from its centre as it always has been.
  publira.types.v1.ImageCropRect icon_image_crop = 6;
}

message CreateCreatorResponse {
  publira.types.v1.Creator creator = 1;
}

message UpdateCreatorRequest {
  publira.types.v1.TenantContext tenant = 1;
  reserved 2;
  reserved "public_id";
  string name = 3;
  string profile_text = 4;
  bytes icon_image_data = 5;
  string icon_image_content_type = 6;
  bool clear_icon_image = 7;
  // Where in the upload the square icon is cut. Omitted, the image is cut
  // from its centre as it always has been.
  publira.types.v1.ImageCropRect icon_image_crop = 8;
  // The creator's primary key (Creator.id).
  string creator_id = 9;
}

message UpdateCreatorResponse {
  publira.types.v1.Creator creator = 1;
}

message LinkCreatorAccountRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The creator's primary key (Creator.id).
  string creator_id = 2;
  // The reader's primary key (AdminReader.id).
  string reader_id = 3;
}

message LinkCreatorAccountResponse {
  // Every account linked to the creator after the write, oldest link first.
  repeated CreatorAccount accounts = 1;
}

message UnlinkCreatorAccountRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The creator's primary key (Creator.id).
  string creator_id = 2;
  // The reader's primary key (AdminReader.id).
  string reader_id = 3;
}

message UnlinkCreatorAccountResponse {
  // Every account linked to the creator after the write, oldest link first.
  repeated CreatorAccount accounts = 1;
}

service AdminCreatorService {
  // Minimum role: tenant_auditor.
  rpc ListCreators(ListCreatorsRequest) returns (ListCreatorsResponse) {}
  // Minimum role: tenant_auditor.
  rpc GetCreator(GetCreatorRequest) returns (GetCreatorResponse) {}
  // Minimum role: tenant_editor.
  rpc CreateCreator(CreateCreatorRequest) returns (CreateCreatorResponse) {}
  // Minimum role: tenant_editor.
  rpc UpdateCreator(UpdateCreatorRequest) returns (UpdateCreatorResponse) {}
  // Links a reader account to a creator. One account may be linked to several
  // creators and one creator to several accounts. Linking a pair that is
  // already linked changes nothing and records nothing. not_found for a
  // creator or an account of another tenant and for a staff account;
  // failed_precondition for a reader who is not active.
  //
  // Minimum role: tenant_admin.
  rpc LinkCreatorAccount(LinkCreatorAccountRequest) returns (LinkCreatorAccountResponse) {}
  // Removes a link. Unlinking a pair that is not linked changes nothing and
  // records nothing. not_found for a creator of another tenant.
  //
  // Minimum role: tenant_admin.
  rpc UnlinkCreatorAccount(UnlinkCreatorAccountRequest) returns (UnlinkCreatorAccountResponse) {}
}
