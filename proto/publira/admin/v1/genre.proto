syntax = "proto3";

package publira.admin.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/admin/v1;publiraadminv1";

import "publira/types/v1/types.proto";

// Cursor pagination. Field shape and token rules: proto/README.md.
message ListGenresRequest {
  publira.types.v1.TenantContext tenant = 1;
  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 3;
}

message ListGenresResponse {
  // In the tenant's own order, which is what ReorderGenres writes.
  repeated publira.types.v1.Genre genres = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

message CreateGenreRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The genre's first name, in `locale`. The slug is derived from it, so a
  // name that collides with an existing genre's slug on nothing but case or
  // spacing is refused with already_exists.
  string name = 2;
  // Cropped into every ratio of the eye-catch. Empty leaves the genre without
  // one.
  bytes eye_catch_image_data = 3;
  string eye_catch_image_content_type = 4;
  // The locale name is written in. Empty means the tenant's default locale; a
  // locale the tenant does not offer is invalid_argument.
  string locale = 5;
}

message CreateGenreResponse {
  // Created at the end of the list. ReorderGenres is how it moves.
  publira.types.v1.Genre genre = 1;
}

message UpdateGenreRequest {
  publira.types.v1.TenantContext tenant = 1;
  reserved 2;
  reserved "public_id";
  // The name in `locale`. A locale the genre has no name in yet gets one.
  // The slug is re-derived from the name a reader in the tenant's default
  // locale is shown, so a save that changes that name can be refused with
  // already_exists. The public_id does not move, so whatever addresses this
  // genre keeps addressing it.
  string name = 3;
  // Replaces the whole eye-catch. Empty keeps the one the genre has.
  bytes eye_catch_image_data = 4;
  string eye_catch_image_content_type = 5;
  // Removes the eye-catch. Refused alongside eye_catch_image_data.
  bool clear_eye_catch_image = 6;
  // The genre's primary key (Genre.id).
  string genre_id = 7;
  // The locale name is written in. Empty means the tenant's default locale; a
  // locale the tenant does not offer is invalid_argument.
  string locale = 8;
}

message UpdateGenreResponse {
  publira.types.v1.Genre genre = 1;
}

message ReorderGenresRequest {
  publira.types.v1.TenantContext tenant = 1;
  reserved 2, 3;
  reserved "genre_public_ids", "expected_genre_public_ids";
  // Desired order after the write, by primary key (Genre.id). Must be a
  // permutation of expected_genre_ids.
  repeated string genre_ids = 4;
  // The order the client read before composing genre_ids. The RPC locks the
  // tenant's genres, re-reads the current order, and rejects the write with
  // failed_precondition when this no longer matches.
  repeated string expected_genre_ids = 5;
}

message ReorderGenresResponse {
  repeated publira.types.v1.Genre genres = 1;
}

// Removes a genre no series carries. One that is still assigned is refused
// with failed_precondition: dropping it would silently reclassify every series
// holding it, so the editor is told to unassign it first.
message DeleteGenreRequest {
  publira.types.v1.TenantContext tenant = 1;
  reserved 2;
  reserved "public_id";
  // The genre's primary key (Genre.id).
  string genre_id = 3;
}

message DeleteGenreResponse {}

// Deletes one locale's name of a genre. The last name of a genre cannot be
// deleted (failed_precondition), and a locale the genre has no name in is
// not_found. The locale need not be one the tenant still offers, so a name
// left in a language the site has stopped offering can still be deleted. The
// slug is re-derived as UpdateGenre re-derives it, so a deletion that leaves
// the default locale's reader a name another genre's slug holds is refused
// with already_exists.
message DeleteGenreTranslationRequest {
  publira.types.v1.TenantContext tenant = 1;
  // The genre's primary key (Genre.id).
  string genre_id = 2;
  string locale = 3;
}

message DeleteGenreTranslationResponse {
  publira.types.v1.Genre genre = 1;
}

// Replaces the image of one aspect ratio of a genre eye-catch. The other
// ratios keep the images they already hold.
message UploadGenreEyeCatchAspectImageRequest {
  publira.types.v1.TenantContext tenant = 1;
  reserved 2;
  reserved "public_id";
  // portrait / square / landscape / og
  string variant_type = 3;
  bytes image_data = 4;
  string image_content_type = 5;
  // Where in the upload the cut is taken. Omitted, the image is cut from its
  // centre.
  publira.types.v1.ImageCropRect crop = 6;
  // The genre's primary key (Genre.id).
  string genre_id = 7;
}

message UploadGenreEyeCatchAspectImageResponse {
  publira.types.v1.Genre genre = 1;
}

service AdminGenreService {
  // Minimum role: tenant_auditor.
  rpc ListGenres(ListGenresRequest) returns (ListGenresResponse) {}
  // Minimum role: tenant_editor.
  rpc CreateGenre(CreateGenreRequest) returns (CreateGenreResponse) {}
  // Minimum role: tenant_editor.
  rpc UpdateGenre(UpdateGenreRequest) returns (UpdateGenreResponse) {}
  // Minimum role: tenant_editor.
  rpc ReorderGenres(ReorderGenresRequest) returns (ReorderGenresResponse) {}
  // Minimum role: tenant_editor.
  rpc DeleteGenre(DeleteGenreRequest) returns (DeleteGenreResponse) {}
  // Minimum role: tenant_editor.
  rpc DeleteGenreTranslation(DeleteGenreTranslationRequest) returns (DeleteGenreTranslationResponse) {}
  // Minimum role: tenant_editor.
  rpc UploadGenreEyeCatchAspectImage(UploadGenreEyeCatchAspectImageRequest) returns (UploadGenreEyeCatchAspectImageResponse) {}
}
