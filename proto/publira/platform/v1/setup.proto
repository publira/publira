syntax = "proto3";

package publira.platform.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/platform/v1;publirasplatformv1";

// Request to check the platform setup status.
message CheckSetupStatusRequest {}

// Response carrying the platform setup status.
message CheckSetupStatusResponse {
  // True once the platform has been set up, meaning at least one user exists.
  bool setup_completed = 1;
  // UI locale code (ja, en) the console renders in for a visitor who has not
  // signed in. The login screen has no session to read the platform settings
  // with, and this RPC is the unauthenticated read it already makes, so the
  // saved language travels with the status rather than being guessed there.
  //
  // Empty until the platform is set up: the settings row is created with the
  // first operator, so before that there is no saved language to report and
  // the setup screen negotiates one from Accept-Language instead.
  string default_locale = 2;
}

// Request to create the first operator account.
message CreateInitialUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  // UI locale code (ja, en) the platform starts on, chosen by the operator on
  // the setup screen. Required: the settings row is created here and has no
  // column default for the locale, so the first language is never left unstated.
  string default_locale = 4;
  // ISO 4217 code of the currency every tenant that has saved no payment
  // settings of its own sells in, as UpdatePlatformSettingsRequest takes it:
  // three letters that name no currency are INVALID_ARGUMENT and create
  // nothing. Empty keeps the stored currency, which is USD on a platform that
  // has saved none.
  string default_currency = 5;
  // IANA time zone every tenant created without one starts on, as
  // UpdatePlatformSettingsRequest takes it: a name that is not a usable zone is
  // INVALID_ARGUMENT and creates nothing. Empty keeps the stored zone, which is
  // UTC on a platform that has saved none.
  string default_timezone = 6;
}

// Response returned after the first operator account is created.
message CreateInitialUserResponse {}

// Initial platform setup, served without an operator session.
service PlatformSetupService {
  // Reports whether the platform has already been set up. It needs no
  // credential, since the setup screen asks it before anyone has signed in.
  rpc CheckSetupStatus(CheckSetupStatusRequest) returns (CheckSetupStatusResponse) {}
  // Creates the first operator account, allowed only while no user exists.
  // The request carries the web service token as
  // `Authorization: Bearer <token>`, which the Platform Console's setup screen
  // sends from its server; without it the call is UNAUTHENTICATED, because
  // whoever reaches the server first, from the private network or through an
  // edge that forwards the Platform Console's API after all, would otherwise
  // claim the platform.
  rpc CreateInitialUser(CreateInitialUserRequest) returns (CreateInitialUserResponse) {}
}
