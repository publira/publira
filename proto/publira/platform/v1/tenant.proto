syntax = "proto3";

package publira.platform.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/platform/v1;publirasplatformv1";

// A tenant as the platform operator sees it.
message Tenant {
  string public_id = 1;
  string name = 2;
  string status = 3;
  string created_at = 4;
  string domain = 5;
  string admin_domain = 7;
  // IANA time zone name used for tenant wall-clock display (e.g. Asia/Tokyo).
  // Read-only here; tenant admins change it through the admin API.
  string timezone = 8;
  // Primary key (UUID). Every request that acts on the tenant names it by
  // this; public_id only resolves the tenant a URL names.
  string id = 9;
  reserved 6;
}

message ListTenantsRequest {
  // Removed with the move to cursor pagination.
  reserved 2;
  reserved "offset";

  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 1;
  // Filters.
  string name = 3;
  string status = 5;
  // Removed with the move to internal IDs: no URL names a tenant by it.
  reserved 4;
  reserved "public_id";
  // Opaque token from a previous response. Empty for the first page.
  string token = 6;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

message GetTenantRequest {
  string public_id = 1;
}

message GetTenantResponse {
  Tenant tenant = 1;
}

message CreateTenantRequest {
  string name = 1;
  string domain = 3;
  repeated string initial_admin_emails = 4;
  string admin_domain = 5;
  // UI locale code (ja, en) the new tenant starts on. Required: the server
  // never picks a language on the caller's behalf, so a blank or unsupported
  // code is rejected instead of falling back to a default.
  string default_locale = 6;
  reserved 2;
}

message CreateTenantResponse {
  Tenant tenant = 1;
}

message SuspendTenantRequest {
  string tenant_id = 2;
  reserved 1;
  reserved "public_id";
}

message SuspendTenantResponse {
  Tenant tenant = 1;
}

message ResumeTenantRequest {
  string tenant_id = 2;
  reserved 1;
  reserved "public_id";
}

message ResumeTenantResponse {
  Tenant tenant = 1;
}

// A member of a tenant.
message TenantMember {
  string user_public_id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
  string status = 5;
  string created_at = 6;
  string user_id = 7;
}

// Cursor pagination. Field shape and token rules: proto/README.md.
message ListTenantMembersRequest {
  // Removed with the move to cursor pagination.
  reserved 3;
  reserved "offset";

  reserved 1;
  reserved "tenant_public_id";

  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 4;
  string tenant_id = 5;
}

message ListTenantMembersResponse {
  repeated TenantMember members = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

message AddTenantMemberRequest {
  string role = 3;
  string email = 4;
  string tenant_id = 5;
  string user_id = 6;
  reserved 1, 2;
  reserved "tenant_public_id", "user_public_id";
}

message AddTenantMemberResponse {
  TenantMember member = 1;
}

message UpdateTenantMemberRoleRequest {
  string role = 3;
  string tenant_id = 4;
  string user_id = 5;
  reserved 1, 2;
  reserved "tenant_public_id", "user_public_id";
}

message UpdateTenantMemberRoleResponse {
  TenantMember member = 1;
}

message RemoveTenantMemberRequest {
  string tenant_id = 3;
  string user_id = 4;
  reserved 1, 2;
  reserved "tenant_public_id", "user_public_id";
}

message RemoveTenantMemberResponse {
  string user_public_id = 1;
  string user_id = 2;
}

message TenantAdminInvitation {
  string id = 1;
  string email = 2;
  string status = 3;
  string created_at = 4;
  string expires_at = 5;
  string accepted_at = 6;
  string canceled_at = 7;
  // The role accepting the invitation grants:
  // tenant_admin | tenant_editor | tenant_auditor
  string role = 8;
}

// Cursor pagination. Field shape and token rules: proto/README.md.
message ListTenantAdminInvitationsRequest {
  // Removed with the move to cursor pagination.
  reserved 3;
  reserved "offset";

  reserved 1;
  reserved "tenant_public_id";

  // Max items in one page. <= 0 or > 100 falls back to 20.
  int32 limit = 2;
  // Opaque token from a previous response. Empty for the first page.
  string token = 4;
  string tenant_id = 5;
}

message ListTenantAdminInvitationsResponse {
  repeated TenantAdminInvitation invitations = 1;
  // Token for the previous page. Empty on the first page.
  string previous_token = 2;
  // Token for the next page. Empty on the last page.
  string next_token = 3;
}

message CreateTenantAdminInvitationRequest {
  string email = 2;
  string tenant_id = 3;
  reserved 1;
  reserved "tenant_public_id";
}

message CreateTenantAdminInvitationResponse {
  TenantAdminInvitation invitation = 1;
  bool role_granted_immediately = 2;
}

message ResendTenantAdminInvitationRequest {
  string invitation_id = 2;
  string tenant_id = 3;
  reserved 1;
  reserved "tenant_public_id";
}

message ResendTenantAdminInvitationResponse {
  TenantAdminInvitation invitation = 1;
}

message CancelTenantAdminInvitationRequest {
  string invitation_id = 2;
  string tenant_id = 3;
  reserved 1;
  reserved "tenant_public_id";
}

message CancelTenantAdminInvitationResponse {
  TenantAdminInvitation invitation = 1;
}

// Only the fields a request carries change: an absent one keeps the tenant's
// value, and a present empty admin_domain moves the console back to
// admin.<domain>.
message UpdateTenantRequest {
  optional string name = 2;
  optional string domain = 4;
  optional string admin_domain = 5;
  string tenant_id = 6;
  reserved 1, 3;
  reserved "public_id";
}

message UpdateTenantResponse {
  Tenant tenant = 1;
}

// Tenant administration for the platform operator.
service PlatformTenantService {
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse) {}
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse) {}
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse) {}
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse) {}
  // Stops serving the tenant, and leaves its data as it is. The public API,
  // the admin API, and the image routes refuse it from then on, as
  // TenantContext describes; this service keeps managing it — its details,
  // members, and invitations included.
  //
  // The worker treats it as follows while it is suspended:
  //
  // - Mail and push notifications to its readers and staff are dropped,
  //   whether queued before the suspension or produced during it: what they
  //   link to is refused, and holding them until the tenant is resumed would
  //   deliver news that is no longer new and links whose tokens have expired.
  //   An invitation to administer it is the exception: an operator sends it
  //   from here on purpose, and it goes out. Its link is refused until the
  //   tenant is resumed, and once it has expired, Resend issues another.
  // - Every other outbox event runs: cache invalidations, search index
  //   updates, and the follow-up calls to the app stores and sign-in providers
  //   keep the tenant's data and the outside world's in step, and a sign-up,
  //   password reset, or verification request accepted before the suspension
  //   is still carried out, so an account it opens is not lost. Only the mail
  //   it queues is dropped.
  // - Its scheduled jobs run as they do for an active tenant — scheduled
  //   publications, free windows, royalty closing, the daily statistics and
  //   the retention purges — so a resumed tenant is where its own schedule
  //   would have put it.
  rpc SuspendTenant(SuspendTenantRequest) returns (SuspendTenantResponse) {}
  // Serves a suspended tenant again, at once and with nothing else to do:
  // its sessions are honoured again, and its data is what it was.
  rpc ResumeTenant(ResumeTenantRequest) returns (ResumeTenantResponse) {}
  rpc ListTenantMembers(ListTenantMembersRequest) returns (ListTenantMembersResponse) {}
  rpc AddTenantMember(AddTenantMemberRequest) returns (AddTenantMemberResponse) {}
  rpc UpdateTenantMemberRole(UpdateTenantMemberRoleRequest) returns (UpdateTenantMemberRoleResponse) {}
  rpc RemoveTenantMember(RemoveTenantMemberRequest) returns (RemoveTenantMemberResponse) {}
  rpc ListTenantAdminInvitations(ListTenantAdminInvitationsRequest) returns (ListTenantAdminInvitationsResponse) {}
  rpc CreateTenantAdminInvitation(CreateTenantAdminInvitationRequest) returns (CreateTenantAdminInvitationResponse) {}
  rpc ResendTenantAdminInvitation(ResendTenantAdminInvitationRequest) returns (ResendTenantAdminInvitationResponse) {}
  rpc CancelTenantAdminInvitation(CancelTenantAdminInvitationRequest) returns (CancelTenantAdminInvitationResponse) {}
}
