syntax = "proto3";

package publira.platform.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/platform/v1;publirasplatformv1";

// The installation's Web Push identity. The key pair is generated by the
// server, so the only value an operator states is the subject.
message PlatformWebPushSettings {
  // The VAPID public key browsers subscribe with, as base64url without
  // padding. The private key that goes with it is never returned.
  string vapid_public_key = 1;
  // Whether a subject is saved. Web Push is not configured until one is: the
  // storefront offers no browser notifications and the worker sends none.
  bool has_subject = 2;
  // The contact a push service may reach the sender at, a mailto: or https:
  // URI. Empty while has_subject is false.
  string subject = 3;
  // Version of the settings row these values were read at. It moves with every
  // write, so a caller can state which version its save is based on.
  int64 revision = 4;
}

// Reading the settings generates the key pair when none is stored yet, so the
// answer always carries a public key.
message GetPlatformWebPushSettingsRequest {}

message GetPlatformWebPushSettingsResponse {
  PlatformWebPushSettings settings = 1;
}

message UpdatePlatformWebPushSubjectRequest {
  // A mailto: URI with an address, or an absolute https: URL.
  string subject = 1;
  // Required: the revision the request was derived from, as read from
  // PlatformWebPushSettings.revision. The write is refused with
  // FAILED_PRECONDITION when the stored row moved on.
  int64 expected_revision = 2;
}

message UpdatePlatformWebPushSubjectResponse {
  PlatformWebPushSettings settings = 1;
}

service PlatformWebPushSettingsService {
  rpc GetPlatformWebPushSettings(GetPlatformWebPushSettingsRequest) returns (GetPlatformWebPushSettingsResponse) {}
  rpc UpdatePlatformWebPushSubject(UpdatePlatformWebPushSubjectRequest) returns (UpdatePlatformWebPushSubjectResponse) {}
}
