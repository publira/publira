syntax = "proto3";

package publira.platform.v1;

option go_package = "github.com/publira/publira/server/internal/proto/gen/publira/platform/v1;publirasplatformv1";

import "publira/types/v1/types.proto";

message PlatformAuthServiceLoginRequest {
  string email = 1;
  string password = 2;
}

message PlatformAuthServiceLoginResponse {
  publira.types.v1.User user = 1;
  publira.types.v1.AccessToken access_token = 2;
}

message PlatformAuthServiceLogoutRequest {}

message PlatformAuthServiceLogoutResponse {}

message PlatformAuthServiceRequestPasswordResetRequest {
  string email = 1;
}

message PlatformAuthServiceRequestPasswordResetResponse {
  bool requested = 1;
}

message PlatformAuthServiceVerifyPasswordResetTokenRequest {
  string token = 1;
}

message PlatformAuthServiceVerifyPasswordResetTokenResponse {
  bool valid = 1;
}

message PlatformAuthServiceConfirmPasswordResetRequest {
  string token = 1;
  string new_password = 2;
}

message PlatformAuthServiceConfirmPasswordResetResponse {
  bool confirmed = 1;
}

message PlatformAuthServiceRequestEmailChangeRequest {
  string current_email = 1;
  string new_email = 2;
  string current_password = 3;
}

message PlatformAuthServiceRequestEmailChangeResponse {
  bool requested = 1;
}

message PlatformAuthServiceVerifyEmailChangeTokenRequest {
  string token = 1;
}

message PlatformAuthServiceVerifyEmailChangeTokenResponse {
  bool valid = 1;
}

message PlatformAuthServiceConfirmEmailChangeRequest {
  string token = 1;
}

message PlatformAuthServiceConfirmEmailChangeResponse {
  bool confirmed = 1;
  bool changed = 2;
  string pending_confirmation_for = 3;
}

message PlatformAuthServiceGetMeRequest {}

message PlatformAuthServiceGetMeResponse {
  publira.types.v1.User user = 1;
}

service PlatformAuthService {
  rpc Login(PlatformAuthServiceLoginRequest) returns (PlatformAuthServiceLoginResponse) {}
  rpc Logout(PlatformAuthServiceLogoutRequest) returns (PlatformAuthServiceLogoutResponse) {}
  rpc RequestPasswordReset(PlatformAuthServiceRequestPasswordResetRequest) returns (PlatformAuthServiceRequestPasswordResetResponse) {}
  rpc VerifyPasswordResetToken(PlatformAuthServiceVerifyPasswordResetTokenRequest) returns (PlatformAuthServiceVerifyPasswordResetTokenResponse) {}
  rpc ConfirmPasswordReset(PlatformAuthServiceConfirmPasswordResetRequest) returns (PlatformAuthServiceConfirmPasswordResetResponse) {}
  rpc RequestEmailChange(PlatformAuthServiceRequestEmailChangeRequest) returns (PlatformAuthServiceRequestEmailChangeResponse) {}
  rpc VerifyEmailChangeToken(PlatformAuthServiceVerifyEmailChangeTokenRequest) returns (PlatformAuthServiceVerifyEmailChangeTokenResponse) {}
  rpc ConfirmEmailChange(PlatformAuthServiceConfirmEmailChangeRequest) returns (PlatformAuthServiceConfirmEmailChangeResponse) {}
  rpc GetMe(PlatformAuthServiceGetMeRequest) returns (PlatformAuthServiceGetMeResponse) {}
}
