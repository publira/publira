# Dependency services for local development: PostgreSQL, Valkey (Redis
# protocol), RustFS (S3), Mailpit, and Jaeger, and the Traefik edge in front of
# a host-side `task dev`.
#
# `docker compose up -d` from the repository root brings the whole stack up and
# publishes every port on 127.0.0.1, so `task dev` also works for a developer
# who does not use the Dev Container.
#
# OpenSearch, the optional catalog search engine, is in the `search` profile
# and starts only when that profile is named:
# `docker compose --profile search up -d`.
#
# The Dev Container layers `.devcontainer/compose.yaml` on top of this file
# (`dockerComposeFile` in devcontainer.json). That overlay adds `app`, points
# `traefik` at it, and resets the published ports below, because a container
# reaches these services by service name.
#
# Loopback only, like `e2e/compose.yaml`: none of these services authenticates
# a caller, so a bare `<port>:<port>` would hand the whole dev stack to anyone
# on the same network.
#
# `name:` is fixed so the containers and volumes keep their names when the
# checkout directory or the compose file layout changes; a derived name would
# start an empty stack and orphan the old volumes. `-p` and
# `COMPOSE_PROJECT_NAME` still outrank it.
name: publira

services:
  db:
    image: postgres:18.6-alpine3.23@sha256:1a0c23d53c1ad77468c8653fa6eed4f4105cfbef9e6f027bc1dfeb16949a8c29
    restart: unless-stopped
    environment:
      POSTGRES_DB: publira
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  # Trace collector and UI for the Go servers. All-in-one, in memory: the
  # spans are a debugging aid for the current session, not a record worth
  # surviving a restart.
  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    restart: unless-stopped
    ports:
      # OTLP intake (http/protobuf, the protocol the SDKs are configured for)
      # and the query UI.
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:16686:16686"

  # SMTP sink and UI for the mail the app sends. `MP_DATABASE` is what makes
  # the mailbox a file instead of the temporary one Mailpit deletes on exit,
  # so a message stays readable across a restart or a Dev Container rebuild.
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      # SMTP intake and the web UI.
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data

  # Shared backend for Next.js cacheHandler / cacheHandlers (multi-instance).
  # Valkey is Redis-protocol compatible; keep service name / PUBLIRA_REDIS_URL as redis://...
  redis:
    image: valkey/valkey:9.1.3-alpine3.24@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-compatible local object storage (RustFS).
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.2@sha256:7d6d361c49c08d427250fb59aae5d78df83d644c3405d9ccf4b21cda0b0692d0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: publira
      RUSTFS_SECRET_KEY: publirapass
    ports:
      # S3 endpoint and the console UI.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The optional catalog search engine (`publiractl search set --engine
  # opensearch`), built with the analysis plugins a language's own text
  # analysis is built on; the default needs none. Single node, with
  # the security plugin off, so it answers plain HTTP without credentials:
  # that is why it is published on loopback alone, like everything here.
  opensearch:
    profiles: [search]
    build:
      context: .
      dockerfile: infra/docker/opensearch/Dockerfile
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # The heap the JVM would otherwise size from the machine's memory.
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      # Yellow, not green: a single node has nowhere to put a replica.
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # The edge in front of a host-side `task dev`: the three apps and the images
  # under one origin on `localhost:3080`, as in the Dev Container, routed by the
  # committed infra/proxy/traefik/dynamic with the host's backend addresses.
  traefik:
    image: traefik:v3.7.16@sha256:1336e85aaed293bd63d005086e0dd013b04078b26aaeb1c18b26a2f928af7e65
    restart: unless-stopped
    command:
      - "--entrypoints.web.address=:3080"
      - "--entrypoints.web.http.middlewares=strip-trace-context@file,strip-forwarded@file"
      - "--entrypoints.web.transport.respondingTimeouts.readTimeout=300s"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    environment:
      # Where services.yaml sends every backend: the host's processes.
      PUBLIRA_EDGE_BACKEND_HOST: host.docker.internal
      # The hosts routes.yaml serves: the development seed's tenant site and
      # console (db/seeds/dev), and the Platform Console. A host in no list
      # reaches no app, so a tenant added by hand needs its two hosts here.
      PUBLIRA_EDGE_SITE_HOSTS: localhost
      PUBLIRA_EDGE_ADMIN_HOSTS: admin.localhost
      PUBLIRA_EDGE_PLATFORM_HOSTS: platform.localhost
    # Docker Desktop resolves host.docker.internal itself; Docker Engine on
    # Linux resolves it through this mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3080:3080"
    volumes:
      - ./infra/proxy/traefik/dynamic:/etc/traefik/dynamic:ro

volumes:
  mailpit-data:
  opensearch-data:
  postgres-data:
  rustfs-data:
