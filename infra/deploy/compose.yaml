# A whole Publira install on one host, from the repository's own images: the
# processes and variables README.md describes, wired together.
#
# Every value comes from `.env` beside this file, which `.env.example` lists;
# a required one left empty stops `docker compose` before anything starts. The
# images are referenced, never built: a deployment pulls the ones every release
# publishes to ghcr.io/publira, or names its own, such as the
# `publira/<name>:local` that `task docker:verify:full` builds.
#
# `name:` is fixed, unlike the root compose.yaml, since a host runs one install
# whose volumes keep their names across every command; `publira` would share
# them with the development stack, which the root compose.yaml names that.
#
# The proxy is alone on the `edge` network with what it forwards to, and every
# other service is on `default`, so the proxy reaches neither the database nor
# Valkey.

name: publira-deploy

x-secret-encryption: &secret-encryption
  PUBLIRA_SECRET_ENCRYPTION_KEYS: ${PUBLIRA_SECRET_ENCRYPTION_KEYS:?}
  PUBLIRA_SECRET_ENCRYPTION_PRIMARY_KEY_ID: ${PUBLIRA_SECRET_ENCRYPTION_PRIMARY_KEY_ID:?}

x-tenant-url: &tenant-url
  PUBLIRA_TENANT_URL_SCHEME: ${PUBLIRA_TENANT_URL_SCHEME:-}

# Tracing, on every process that traces. Each value is empty unless `.env`
# sets it, and an empty one is read as unset, so tracing stays off and every
# other value keeps its default.
x-tracing: &tracing
  PUBLIRA_TRACING_ENABLED: ${PUBLIRA_TRACING_ENABLED:-}
  PUBLIRA_DEPLOYMENT_ENVIRONMENT: ${PUBLIRA_DEPLOYMENT_ENVIRONMENT:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}

x-web-app: &web-app
  PUBLIRA_GRPC_URL: http://server:8000/rpc
  PNCH_REDIS_URL: redis://valkey:6379
  PUBLIRA_REVALIDATE_TOKEN: ${PUBLIRA_REVALIDATE_TOKEN:?}

services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:dec395d8c09c45609d6deb5c2388a07882d64fa59b1d98c1895792e085f57888
    restart: unless-stopped
    environment:
      POSTGRES_DB: publira
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PUBLIRA_POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d publira"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # Holds caches and rate limit counters only, so nothing is persisted.
  valkey:
    image: valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The object store. An install on an external store drops this service and
  # gives `publiractl setup` that store instead.
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.2@sha256:7d6d361c49c08d427250fb59aae5d78df83d644c3405d9ccf4b21cda0b0692d0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${PUBLIRA_RUSTFS_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${PUBLIRA_RUSTFS_SECRET_KEY:?}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The edge: Caddy, running the repository's own Caddyfile, which the
  # Caddyfile beside this file links to. The backend addresses are this file's,
  # and the hosts each app answers come from .env. A host in no list reaches
  # nothing.
  #
  # With an ACME contact in .env, Caddy is given the host lists as the hosts
  # it serves over HTTPS, with certificates it obtains and renews and keeps in
  # `caddy-data`, and plain HTTP to them is redirected there. Without one, it
  # serves plain HTTP alone, for a hop in front that terminates TLS or for
  # trying the install on one machine. The addresses of such a hop,
  # which the edge trusts to name the client address, come from .env too.
  # Empty, it trusts no one.
  proxy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    environment:
      PUBLIRA_EDGE_SITE_HOSTS: ${PUBLIRA_EDGE_SITE_HOSTS:?}
      PUBLIRA_EDGE_ADMIN_HOSTS: ${PUBLIRA_EDGE_ADMIN_HOSTS:?}
      PUBLIRA_EDGE_PLATFORM_HOSTS: ${PUBLIRA_EDGE_PLATFORM_HOSTS:-}
      PUBLIRA_EDGE_IMAGE_HOSTS: ${PUBLIRA_EDGE_IMAGE_HOSTS:-}
      PUBLIRA_EDGE_TLS_HOSTS: ${PUBLIRA_EDGE_ACME_EMAIL:+${PUBLIRA_EDGE_SITE_HOSTS} ${PUBLIRA_EDGE_ADMIN_HOSTS} ${PUBLIRA_EDGE_PLATFORM_HOSTS} ${PUBLIRA_EDGE_IMAGE_HOSTS}}
      PUBLIRA_EDGE_ACME_EMAIL: ${PUBLIRA_EDGE_ACME_EMAIL:-}
      PUBLIRA_EDGE_TRUSTED_PROXIES: ${PUBLIRA_EDGE_TRUSTED_PROXIES:-}
      PUBLIRA_UPSTREAM_API: server:8000
      PUBLIRA_UPSTREAM_WEB_STOREFRONT: web-storefront:3000
      PUBLIRA_UPSTREAM_WEB_ADMIN: web-admin:4000
      # Answers only when its profile runs; without it the platform host is a
      # 502 and every other route is unaffected.
      PUBLIRA_UPSTREAM_WEB_PLATFORM: web-platform:4100
    ports:
      # Every interface: the proxy is what the internet reaches. The
      # certificate authority checks a name on port 80 or 443, so an install
      # that terminates TLS here keeps both; UDP carries HTTP/3.
      - "${PUBLIRA_EDGE_HTTP_PORT:?}:80"
      - "${PUBLIRA_EDGE_HTTPS_PORT:?}:443"
      - "${PUBLIRA_EDGE_HTTPS_PORT:?}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [edge]
    depends_on:
      - server
      - web-storefront
      - web-admin

  # `publira server` with the worker hosted in the same process: the API and
  # image delivery on :8000, and the Outbox drain and every scheduled job,
  # whose /livez and /readyz answer on :8003. It therefore holds all six
  # logins and reads the variables of both. An install that scales the two
  # apart, or keeps the worker's logins out of the process the proxy forwards
  # to, runs `worker` as a service of its own instead.
  server:
    image: ${PUBLIRA_IMAGE_REGISTRY:?}/publira:${PUBLIRA_IMAGE_TAG:?}
    command: ["server", "--with-worker"]
    restart: unless-stopped
    environment:
      <<: [*secret-encryption, *tenant-url, *tracing]
      PUBLIRA_AUTH_JWT_SECRET: ${PUBLIRA_AUTH_JWT_SECRET:?}
      PUBLIRA_WEB_SERVICE_TOKEN: ${PUBLIRA_WEB_SERVICE_TOKEN:?}
      PUBLIRA_PUBLIC_DB_URL: postgres://publira_public:${PUBLIRA_PUBLIC_DB_PASSWORD:?}@postgres:5432/publira?sslmode=disable
      PUBLIRA_ADMIN_DB_URL: postgres://publira_admin:${PUBLIRA_ADMIN_DB_PASSWORD:?}@postgres:5432/publira?sslmode=disable
      PUBLIRA_PLATFORM_DB_URL: postgres://publira_platform:${PUBLIRA_PLATFORM_DB_PASSWORD:?}@postgres:5432/publira?sslmode=disable
      PUBLIRA_WORKER_DB_URL: postgres://publira_outbox:${PUBLIRA_OUTBOX_DB_PASSWORD:?}@postgres:5432/publira?sslmode=disable
      PUBLIRA_TICKER_DB_URL: postgres://publira_ticker:${PUBLIRA_TICKER_DB_PASSWORD:?}@postgres:5432/publira?sslmode=disable
      PUBLIRA_CONTENT_STATS_DB_URL: postgres://publira_content_stats:${PUBLIRA_CONTENT_STATS_DB_PASSWORD:?}@postgres:5432/publira?sslmode=disable
      PUBLIRA_REDIS_URL: redis://valkey:6379
      PUBLIRA_EMAIL_RENDERER_URL: ${PUBLIRA_EMAIL_RENDERER_URL:-}
      PUBLIRA_PLATFORM_APP_URL: ${PUBLIRA_PLATFORM_APP_URL:-}
      # Where cache revalidation is sent. The Platform Console's URL is left
      # empty unless it runs, since a destination that never answers keeps the
      # worker retrying the event.
      PUBLIRA_REVALIDATE_TOKEN: ${PUBLIRA_REVALIDATE_TOKEN:?}
      PUBLIRA_WEB_STOREFRONT_INTERNAL_URL: http://web-storefront:3000
      PUBLIRA_WEB_ADMIN_INTERNAL_URL: http://web-admin:4000
      PUBLIRA_WEB_PLATFORM_INTERNAL_URL: ${PUBLIRA_WEB_PLATFORM_INTERNAL_URL:-}
      # Metrics, which only this process exports.
      PUBLIRA_METRICS_ENABLED: ${PUBLIRA_METRICS_ENABLED:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_EXPORTER_PROMETHEUS_HOST: ${OTEL_EXPORTER_PROMETHEUS_HOST:-}
    networks: [default, edge]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  web-storefront:
    image: ${PUBLIRA_IMAGE_REGISTRY:?}/web-storefront:${PUBLIRA_IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      <<: [*web-app, *tenant-url, *tracing]
      PUBLIRA_AUTH_SECRET: ${PUBLIRA_WEB_STOREFRONT_AUTH_SECRET:?}
    networks: [default, edge]
    depends_on:
      - server
      - valkey

  web-admin:
    image: ${PUBLIRA_IMAGE_REGISTRY:?}/web-admin:${PUBLIRA_IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      <<: [*web-app, *tenant-url, *tracing]
      PUBLIRA_AUTH_SECRET: ${PUBLIRA_WEB_ADMIN_AUTH_SECRET:?}
      PUBLIRA_WEB_SERVICE_TOKEN: ${PUBLIRA_WEB_SERVICE_TOKEN:?}
    networks: [default, edge]
    depends_on:
      - server
      - valkey

  # Optional: the Platform Console. Runs when COMPOSE_PROFILES names
  # `web-platform`, together with PUBLIRA_WEB_PLATFORM_INTERNAL_URL and
  # PUBLIRA_PLATFORM_APP_URL in .env.
  web-platform:
    image: ${PUBLIRA_IMAGE_REGISTRY:?}/web-platform:${PUBLIRA_IMAGE_TAG:?}
    profiles: [web-platform]
    restart: unless-stopped
    environment:
      <<: [*web-app, *tracing]
      PUBLIRA_AUTH_SECRET: ${PUBLIRA_WEB_PLATFORM_AUTH_SECRET:-}
      PUBLIRA_WEB_SERVICE_TOKEN: ${PUBLIRA_WEB_SERVICE_TOKEN:?}
    networks: [default, edge]
    depends_on:
      - server
      - valkey

  # Optional: the HTML part of every mail. Runs when COMPOSE_PROFILES names
  # `email-renderer`, together with PUBLIRA_EMAIL_RENDERER_URL in .env.
  email-renderer:
    image: ${PUBLIRA_IMAGE_REGISTRY:?}/email-renderer:${PUBLIRA_IMAGE_TAG:?}
    profiles: [email-renderer]
    restart: unless-stopped

  # Run by hand, never kept running: `docker compose run --rm publiractl <command>`.
  # The `db` commands connect as the superuser; every other command as the
  # role it names. The role passwords are mounted as files for
  # `db roles`, and the object store's secret key for `setup`, since
  # publiractl never takes a secret from its environment.
  publiractl:
    image: ${PUBLIRA_IMAGE_REGISTRY:?}/publiractl:${PUBLIRA_IMAGE_TAG:?}
    profiles: [publiractl]
    environment:
      <<: [*secret-encryption, *tenant-url]
      PUBLIRA_DB_URL: postgres://postgres:${PUBLIRA_POSTGRES_PASSWORD:?}@postgres:5432/publira?sslmode=disable
      PUBLIRA_PLATFORM_DB_URL: postgres://publira_platform:${PUBLIRA_PLATFORM_DB_PASSWORD:?}@postgres:5432/publira?sslmode=disable
      PUBLIRA_CONTENT_STATS_DB_URL: postgres://publira_content_stats:${PUBLIRA_CONTENT_STATS_DB_PASSWORD:?}@postgres:5432/publira?sslmode=disable
    secrets:
      - public-db-password
      - admin-db-password
      - platform-db-password
      - outbox-db-password
      - ticker-db-password
      - content-stats-db-password
      - rustfs-secret-key
    depends_on:
      postgres:
        condition: service_healthy

  # `publiractl setup` with what this file already knows given as flags, run
  # by hand: `docker compose run --rm setup`, followed by any other flag of
  # `setup`. It applies the migrations and the roles with the passwords above,
  # creates the bucket in RustFS, and asks on the terminal for the rest. Run
  # again, it changes nothing that is already set up.
  setup:
    extends: publiractl
    entrypoint:
      - /app/publiractl
      - setup
      - --db-public-password-file=/run/secrets/public-db-password
      - --db-admin-password-file=/run/secrets/admin-db-password
      - --db-platform-password-file=/run/secrets/platform-db-password
      - --db-outbox-password-file=/run/secrets/outbox-db-password
      - --db-ticker-password-file=/run/secrets/ticker-db-password
      - --db-content-stats-password-file=/run/secrets/content-stats-db-password
      - --bucket=publira
      - --region=us-east-1
      - --endpoint=http://rustfs:9000
      - --force-path-style
      - --public-base-url=
      - --access-key-id=${PUBLIRA_RUSTFS_ACCESS_KEY:?}
      - --secret-access-key-file=/run/secrets/rustfs-secret-key
      - --create-bucket
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

secrets:
  public-db-password:
    environment: PUBLIRA_PUBLIC_DB_PASSWORD
  admin-db-password:
    environment: PUBLIRA_ADMIN_DB_PASSWORD
  platform-db-password:
    environment: PUBLIRA_PLATFORM_DB_PASSWORD
  outbox-db-password:
    environment: PUBLIRA_OUTBOX_DB_PASSWORD
  ticker-db-password:
    environment: PUBLIRA_TICKER_DB_PASSWORD
  content-stats-db-password:
    environment: PUBLIRA_CONTENT_STATS_DB_PASSWORD
  rustfs-secret-key:
    environment: PUBLIRA_RUSTFS_SECRET_KEY

networks:
  edge:

volumes:
  postgres-data:
  rustfs-data:
  caddy-data:
