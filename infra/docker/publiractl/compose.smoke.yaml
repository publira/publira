# Smoke check for the publiractl image: `task docker:smoke:publiractl` migrates
# an empty database and creates its roles with nothing but PUBLIRA_DB_URL set,
# which only works when the image carries db/migrations and db/seeds/baseline.

services:
  db:
    image: postgres:18.6-alpine3.23@sha256:f1031bf693d8d60b0a0380c51a3510607c7a93c7c1d18bf7af94a3a8dbeb40b8
    environment:
      POSTGRES_DB: publira
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d publira"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  publiractl:
    image: publira/publiractl:local
    environment:
      PUBLIRA_DB_URL: postgres://postgres:password@db:5432/publira?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
