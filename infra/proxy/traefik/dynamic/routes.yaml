# The routing in infra/proxy/README.md for Traefik: routers and middlewares,
# identical in the Dev Container, the E2E stack, and each dev-env profile, and a
# sample a deployment adapts. The backend addresses live next to this file in
# services.yaml, which is the half that changes per deployment; the file
# provider reads the whole directory and merges the two.
#
# Router and service names have to match across the two files. `task
# e2e:routing` fails on a mismatch, because a router whose service is missing
# answers 503.
#
# The file is a Go template the file provider renders when it loads it. The
# hosts come from the environment of the Traefik process:
# PUBLIRA_EDGE_SITE_HOSTS, PUBLIRA_EDGE_ADMIN_HOSTS, and
# PUBLIRA_EDGE_PLATFORM_HOSTS, and the tenants' image hosts,
# PUBLIRA_EDGE_IMAGE_HOSTS, each a list of host names separated by spaces.
# A Host matcher names one host, so each list is split below and joined back
# into one rule per app. An empty list leaves its routers out, since Traefik
# refuses an empty rule.
#
# A host in no list matches no router, so Traefik answers it with its own 404
# and no backend sees the request. /rpc and /images are routed on the listed
# hosts alone for the same reason. An image host is in the images router
# alone, so every other path on it, /rpc included, gets the same 404.
#
# The rest of /rpc, past the public API's publira.v1 prefix, is answered the
# same way: the host routers leave it out, and no other router takes it. What
# the server answers there is the consoles' APIs, which web-admin and
# web-platform call over the private network, so no host needs them.
#
# The reader's region reaches web-storefront in X-Forwarded-CountryRegion from
# a trusted hop alone. Traefik keeps a trusted hop's X-Forwarded-* headers and
# drops a caller's only for the ones it writes itself, which this is not, so a
# router of its own takes the requests from the hop:
# PUBLIRA_EDGE_TRUSTED_PROXIES lists the hop's addresses or CIDR ranges,
# separated by spaces, the same ones as forwardedHeaders.trustedIPs in
# traefik.yaml. Every other router removes the header. Traefik looks up no
# region of its own.
#
# How many requests one client may send, as infra/proxy/README.md lists them,
# is a rateLimit middleware per allowance, on the routers of a tenant's site
# and image hosts; the console hosts have routers of their own without one,
# since they are left to the server's own limits. Each lets a client send its
# burst at once and refills at its average, and answers a request past that
# with a 429 of its own, which no backend sees. Traefik keeps the count per
# router, so each allowance is one router's. A rateLimit counts a client by the
# address that connected unless told otherwise, which behind a trusted hop is
# the hop's for every reader. Told to read X-Forwarded-For past the hop's
# addresses instead, it counts every request that did not come through the hop
# as one client, since Traefik has already removed theirs, so the requests from
# the hop have routers of their own again, with a `-trusted-hop` copy of each
# middleware that reads the header.
{{- define "hosts" -}}
  {{- range $i, $host := . }}{{ if $i }} || {{ end }}Host(`{{ $host }}`){{ end -}}
{{- end -}}
{{- define "clientIPs" -}}
  {{- range $i, $address := . }}{{ if $i }} || {{ end }}ClientIP(`{{ $address }}`){{ end -}}
{{- end -}}
{{- $site := regexSplit "\\s+" (env "PUBLIRA_EDGE_SITE_HOSTS") -1 | compact -}}
{{- $admin := regexSplit "\\s+" (env "PUBLIRA_EDGE_ADMIN_HOSTS") -1 | compact -}}
{{- $platform := regexSplit "\\s+" (env "PUBLIRA_EDGE_PLATFORM_HOSTS") -1 | compact -}}
{{- $image := regexSplit "\\s+" (env "PUBLIRA_EDGE_IMAGE_HOSTS") -1 | compact -}}
{{- $hops := regexSplit "\\s+" (env "PUBLIRA_EDGE_TRUSTED_PROXIES") -1 | compact -}}
{{- define "rateLimit" }}
      rateLimit:
        average: {{ .average }}
        period: 1s
        burst: {{ .burst }}
{{- if .hops }}
        sourceCriterion:
          ipStrategy:
            excludedIPs:
{{- range .hops }}
              - '{{ . }}'
{{- end }}
{{- end }}
{{- end -}}
{{- $consoles := concat $admin $platform }}
{{- $limitedImages := concat $site $image }}
{{- $listed := concat $site $consoles $image }}
{{- $appPaths := "!PathRegexp(`^/rpc(/.*)?$`)" }}
{{- $searchPage := "PathRegexp(`^(/[a-z]{2}(-[A-Za-z]{4})?)?/search/?$`)" }}
{{- $searchRPC := "PathPrefix(`/rpc/publira.v1.CatalogService/SearchPublished`)" }}
{{- $allowances := list
  (dict "name" "api" "average" 20 "burst" 120)
  (dict "name" "search-rpc" "average" 2 "burst" 20)
  (dict "name" "search-page" "average" 2 "burst" 20)
  (dict "name" "images" "average" 60 "burst" 600) }}
http:
  middlewares:
    # The trust boundary for W3C Trace Context. Traefik drops a request header
    # whose configured value is empty, which is what an empty value here means.
    # Attached to the `web` entrypoint in the static configuration, so it runs
    # ahead of every router and a new router inherits it without having to
    # remember it.
    strip-trace-context:
      headers:
        customRequestHeaders:
          traceparent: ""
          tracestate: ""
          baggage: ""
    # publira server reads Forwarded ahead of X-Forwarded-For. Traefik writes
    # only the latter and passes a Forwarded header through, so one that
    # arrived is the caller's. Attached to the `web` entrypoint beside
    # strip-trace-context.
    strip-forwarded:
      headers:
        customRequestHeaders:
          Forwarded: ""
    # Attached to every router but web-storefront-trusted-hop, which is the
    # one that keeps the header, so it cannot sit on the entry point.
    strip-country-region:
      headers:
        customRequestHeaders:
          X-Forwarded-CountryRegion: ""
{{- range $allowances }}
    rate-limit-{{ .name }}:{{ template "rateLimit" (dict "average" .average "burst" .burst) }}
{{- if $hops }}
    rate-limit-{{ .name }}-trusted-hop:{{ template "rateLimit" (dict "average" .average "burst" .burst "hops" $hops) }}
{{- end }}
{{- end }}
{{- if $listed }}

  routers:
{{- if $site }}
    web-storefront:
      rule: '({{ template "hosts" $site }}) && {{ $appPaths }}'
      priority: 100
      entryPoints: [web]
      service: web-storefront
      middlewares: [strip-country-region]
{{- if $hops }}

    # The same requests from a trusted hop, which keep the reader's region the
    # hop names. Priority 101 puts it above web-storefront, and the paths
    # keep it below rpc and images.
    web-storefront-trusted-hop:
      rule: '({{ template "hosts" $site }}) && {{ $appPaths }} && ({{ template "clientIPs" $hops }})'
      priority: 101
      entryPoints: [web]
      service: web-storefront
{{- end }}

    # The storefront's search page, with or without a locale prefix, which runs
    # the catalog search on the server, so it has an allowance of its own.
    web-storefront-search:
      rule: '({{ template "hosts" $site }}) && {{ $searchPage }}'
      priority: 102
      entryPoints: [web]
      service: web-storefront
      middlewares: [strip-country-region, rate-limit-search-page]
{{- if $hops }}

    web-storefront-search-trusted-hop:
      rule: '({{ template "hosts" $site }}) && {{ $searchPage }} && ({{ template "clientIPs" $hops }})'
      priority: 103
      entryPoints: [web]
      service: web-storefront
      middlewares: [rate-limit-search-page-trusted-hop]
{{- end }}

    # The public API on a tenant's site, and rpc-console below on a console
    # host, so priority 105 puts it above the host routers. The prefix ends at
    # the dot after v1, so that publira.v1.<Service>/<Method> is all it
    # matches. No prefix removal, because the server's own routes carry /rpc.
    rpc:
      rule: '({{ template "hosts" $site }}) && PathPrefix(`/rpc/publira.v1.`)'
      priority: 105
      entryPoints: [web]
      service: api
      middlewares: [strip-country-region, rate-limit-api]
{{- if $hops }}

    rpc-trusted-hop:
      rule: '({{ template "hosts" $site }}) && PathPrefix(`/rpc/publira.v1.`) && ({{ template "clientIPs" $hops }})'
      priority: 106
      entryPoints: [web]
      service: api
      middlewares: [strip-country-region, rate-limit-api-trusted-hop]
{{- end }}

    # The catalog search, which costs the database more than any other read,
    # has an allowance of its own rather than the rest of the public API's.
    rpc-search:
      rule: '({{ template "hosts" $site }}) && {{ $searchRPC }}'
      priority: 107
      entryPoints: [web]
      service: api
      middlewares: [strip-country-region, rate-limit-search-rpc]
{{- if $hops }}

    rpc-search-trusted-hop:
      rule: '({{ template "hosts" $site }}) && {{ $searchRPC }} && ({{ template "clientIPs" $hops }})'
      priority: 108
      entryPoints: [web]
      service: api
      middlewares: [strip-country-region, rate-limit-search-rpc-trusted-hop]
{{- end }}
{{- end }}
{{- if $admin }}

    web-admin:
      rule: '({{ template "hosts" $admin }}) && {{ $appPaths }}'
      priority: 100
      entryPoints: [web]
      service: web-admin
      middlewares: [strip-country-region]
{{- end }}
{{- if $platform }}

    web-platform:
      rule: '({{ template "hosts" $platform }}) && {{ $appPaths }}'
      priority: 100
      entryPoints: [web]
      service: web-platform
      middlewares: [strip-country-region]
{{- end }}
{{- if $consoles }}

    # The public API and image delivery on a console host, without the
    # allowances of a tenant's site.
    rpc-console:
      rule: '({{ template "hosts" $consoles }}) && PathPrefix(`/rpc/publira.v1.`)'
      priority: 105
      entryPoints: [web]
      service: api
      middlewares: [strip-country-region]

    images-console:
      rule: '({{ template "hosts" $consoles }}) && PathPrefix(`/images`)'
      priority: 110
      entryPoints: [web]
      service: api
      middlewares: [strip-country-region]
{{- end }}
{{- if $limitedImages }}

    # On a tenant's site and image hosts, and answered by the same process as
    # the API: the server picks the rules it applies to an image from the
    # host name it was given. No prefix removal, like the API.
    images:
      rule: '({{ template "hosts" $limitedImages }}) && PathPrefix(`/images`)'
      priority: 110
      entryPoints: [web]
      service: api
      middlewares: [strip-country-region, rate-limit-images]
{{- if $hops }}

    images-trusted-hop:
      rule: '({{ template "hosts" $limitedImages }}) && PathPrefix(`/images`) && ({{ template "clientIPs" $hops }})'
      priority: 111
      entryPoints: [web]
      service: api
      middlewares: [strip-country-region, rate-limit-images-trusted-hop]
{{- end }}
{{- end }}
{{- end }}
