# The routing contract: routers and middlewares, identical in every
# environment. The backend addresses live next to this file in services.yaml,
# which is the half that changes per deployment; the file provider reads the
# whole directory and merges the two.
#
# Router and service names have to match across the two files. `task
# e2e:routing` fails on a mismatch, because a router whose service is missing
# answers 503.
#
# A rule carrying a regular expression is single-quoted, so YAML leaves its
# backslashes alone.
http:
  middlewares:
    # The trust boundary for W3C Trace Context. Traefik drops a request header
    # whose configured value is empty, which is what an empty value here means.
    # Attached to the `web` entrypoint in the static configuration, so it runs
    # ahead of every router and a new router inherits it without having to
    # remember it.
    strip-trace-context:
      headers:
        customRequestHeaders:
          traceparent: ""
          tracestate: ""
          baggage: ""

    api-strip:
      stripPrefix:
        prefixes:
          - /api

  routers:
    # The catch-all. Priority 1 keeps it under every other router.
    web-host:
      rule: "PathPrefix(`/`)"
      priority: 1
      entryPoints: [web]
      service: web-host

    web-admin:
      rule: 'HostRegexp(`^admin\d*\..*$`)'
      priority: 100
      entryPoints: [web]
      service: web-admin

    web-platform:
      rule: 'HostRegexp(`^platform\..*$`)'
      priority: 100
      entryPoints: [web]
      service: web-platform

    # The public API is host-agnostic, so priority 105 puts it above the
    # admin and platform hosts. `/api/v1` is excluded: that space belongs to
    # the Next.js Route Handlers of whichever app the host rules picked.
    api:
      rule: "PathRegexp(`^/api(/.*)?$`) && !PathRegexp(`^/api/v1(/.*)?$`)"
      priority: 105
      entryPoints: [web]
      middlewares: [api-strip]
      service: api

    image-server:
      rule: "PathPrefix(`/images`)"
      priority: 110
      entryPoints: [web]
      service: image-server

    admin-image-server:
      rule: 'HostRegexp(`^admin\d*\..*$`) && PathPrefix(`/images`)'
      priority: 130
      entryPoints: [web]
      service: admin-image-server
