# Backend addresses: the half of the dynamic configuration that changes per
# environment. The names have to be the ones routes.yaml references.
#
# These are the Dev Container's, where every backend is a process inside the
# one `app` container. Another deployment replaces this file with its own
# addresses and keeps routes.yaml as it is; the E2E stack writes its own into
# the run directory, naming the host ports its processes listen on.
http:
  services:
    web-host:
      loadBalancer:
        servers:
          - url: "http://app:3000"

    web-admin:
      loadBalancer:
        servers:
          - url: "http://app:4000"

    web-platform:
      loadBalancer:
        servers:
          - url: "http://app:4100"

    api:
      loadBalancer:
        servers:
          - url: "http://app:8000"

    image-server:
      loadBalancer:
        servers:
          - url: "http://app:8200"

    admin-image-server:
      loadBalancer:
        servers:
          - url: "http://app:8201"
