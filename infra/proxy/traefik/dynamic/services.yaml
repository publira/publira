# Backend addresses: the half of the dynamic configuration that changes per
# environment. The names have to be the ones routes.yaml references.
#
# Every backend is a process on one host: the Dev Container's `app` container,
# or, for the edge the repository-root compose.yaml starts in front of a
# host-side `task dev`, the machine running Docker. PUBLIRA_EDGE_BACKEND_HOST
# names it, `app` when unset. Another deployment replaces this file with its own
# addresses and adapts routes.yaml only where its hosts differ; the E2E stack
# writes its own into the run directory, naming the host ports its processes
# listen on.
http:
  services:
    web-host:
      loadBalancer:
        servers:
          - url: 'http://{{ env "PUBLIRA_EDGE_BACKEND_HOST" | default "app" }}:3000'

    web-admin:
      loadBalancer:
        servers:
          - url: 'http://{{ env "PUBLIRA_EDGE_BACKEND_HOST" | default "app" }}:4000'

    web-platform:
      loadBalancer:
        servers:
          - url: 'http://{{ env "PUBLIRA_EDGE_BACKEND_HOST" | default "app" }}:4100'

    # The server's edge listener, which /api and /images reach as they are.
    api:
      loadBalancer:
        servers:
          - url: 'http://{{ env "PUBLIRA_EDGE_BACKEND_HOST" | default "app" }}:8000'
