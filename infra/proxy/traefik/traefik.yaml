# Traefik static configuration.
#
# The Dev Container and the E2E stack pass the same settings on the command
# line instead of mounting this file, because each of them listens on a
# different address and only the Dev Container exposes the dashboard. What is
# not environment-specific is here, and this is the file a deployment mounts.

entryPoints:
  web:
    address: ":80"
    http:
      middlewares:
        # Run before any router, so every route on this entrypoint loses its
        # inbound W3C Trace Context and Forwarded header. `@file` is the
        # provider namespace; the middlewares themselves are defined in
        # dynamic/routes.yaml.
        - strip-trace-context@file
        - strip-forwarded@file
    # A load balancer, a CDN, or a TLS terminator in front of this entry
    # point is the peer of every request, so without this every request is
    # recorded with that hop's address. Listing the hop's own addresses, and
    # no others, makes Traefik keep the X-Forwarded-* headers a request from
    # them carries and append the hop's address to X-Forwarded-For, so the
    # client address the hop named stays first, where a backend reads it. The
    # hop has to set those headers rather than append to the caller's.
    # Requests from anywhere else lose theirs, as they do without this.
    #
    # forwardedHeaders:
    #   trustedIPs:
    #     - 192.0.2.0/24

  # TLS termination is a deployment decision — which certificate source, which
  # listen address — so only the shape is here.
  #
  # websecure:
  #   address: ":443"
  #   http:
  #     middlewares:
  #       - strip-trace-context@file
  #       - strip-forwarded@file
  #     tls: {}

providers:
  file:
    # routes.yaml (the contract) and services.yaml (this environment's backend
    # addresses) are merged from this one directory.
    directory: /etc/traefik/dynamic
    # Editing either file takes effect without restarting Traefik. A bind
    # mount that delivers no file events needs a restart instead.
    watch: true
