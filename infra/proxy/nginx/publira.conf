# The routing contract for nginx. Drop this directory in as /etc/nginx/conf.d,
# where the stock nginx.conf includes every *.conf inside `http` — upstreams.conf
# with it, and snippets/ left alone because the glob does not descend.
#
# nginx has no equivalent of Traefik's numeric router priorities. The same
# precedence comes from the server block a host selects and, inside it, from
# nginx's own location ordering; snippets/app-routes.conf carries the paths that
# resolve identically on every host.
#
# server_name matching ignores the port the Host header carries, so
# admin.localhost:3080 selects the admin block.

# The public tenant site: every host that is not an admin or a platform host.
server {
    listen 80 default_server;
    # TLS terminates here in a deployment:
    #   listen 443 ssl default_server;
    #   ssl_certificate     /etc/nginx/tls/fullchain.pem;
    #   ssl_certificate_key /etc/nginx/tls/privkey.pem;
    server_name _;

    set $publira_app publira_web_host;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;

    location ^~ /images {
        proxy_pass http://publira_image_server;
    }

    include /etc/nginx/conf.d/snippets/app-routes.conf;
}

# The tenant console. `\d*` is zero or more digits, so admin.example.com and
# admin2.example.com are both consoles while administrator.example.com is a
# tenant site.
server {
    listen 80;
    server_name ~^admin\d*\..*$;

    set $publira_app publira_web_admin;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;

    # The one path that differs from the public site: the console's images come
    # from its own server.
    location ^~ /images {
        proxy_pass http://publira_admin_image_server;
    }

    include /etc/nginx/conf.d/snippets/app-routes.conf;
}

# The platform console.
server {
    listen 80;
    server_name ~^platform\..*$;

    set $publira_app publira_web_platform;
    include /etc/nginx/conf.d/snippets/proxy-headers.conf;

    location ^~ /images {
        proxy_pass http://publira_image_server;
    }

    include /etc/nginx/conf.d/snippets/app-routes.conf;
}
