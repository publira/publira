# The paths that resolve the same way on every host an app answers, included
# once per app's server block. `$publira_app` is the app that block set for
# itself, so the two locations that end at the host's own Next.js app are
# written once here rather than three times.
#
# nginx picks the longest matching prefix among `^~` locations and an exact
# `=` location before any of them, which is what orders these: /images and
# /rpc/publira.v1. over /rpc/, and every one of them over /.

include /etc/nginx/templates/snippets/images.conf;

# The public API, reached with the path as it is, like /images. The prefix
# ends at the dot after v1, so that publira.v1.<Service>/<Method> is all it
# matches. A reader's icon upload, which the public API reads up to 15 MiB of
# with its base64 encoding, would be refused by nginx's 1m default.
location ^~ /rpc/publira.v1. {
    limit_req zone=publira_api burst=120 nodelay;
    client_max_body_size 15m;
    proxy_pass http://publira_api;
}

# The catalog search, which costs the database more than any other read, has
# an allowance of its own rather than the rest of the public API's. A longer
# prefix than the one above, so it wins.
location ^~ /rpc/publira.v1.CatalogService/SearchPublished {
    limit_req zone=publira_search_rpc burst=20 nodelay;
    client_max_body_size 15m;
    proxy_pass http://publira_api;
}

# The rest of /rpc is forwarded nowhere, and the edge answers it itself: what
# the server answers there is the consoles' APIs, which web-admin and
# web-platform call over the private network, so no host needs them. Both
# forms so that /rpcabc is not one of them.
location = /rpc {
    return 404;
}

location ^~ /rpc/ {
    return 404;
}

# The Route Handlers of the Next.js app, where an inbound email webhook to the
# public site carries a whole mail with its attachments, which nginx's 1m
# default would refuse. The bare path has a location of its own because nginx
# answers it with a redirect to /api/v1/ otherwise, instead of passing it on to
# the app as it does every other path.
location = /api/v1 {
    proxy_pass http://$publira_app;
}

location ^~ /api/v1/ {
    client_max_body_size 33m;
    proxy_pass http://$publira_app;
}

# The storefront's search page, with or without a locale prefix, which runs
# the same search on the server. A regular expression is matched ahead of the
# `/` prefix below, which no `^~` keeps it from. The quotes keep nginx from
# reading the braces as the start of a block.
location ~ "^(/[a-z]{2}(-[A-Za-z]{4})?)?/search/?$" {
    limit_req zone=publira_search_page burst=20 nodelay;
    client_max_body_size 11m;
    proxy_pass http://$publira_app;
}

# A Server Action posts to the path of its page, and the ones that carry an
# image would be refused by nginx's 1m default: web-storefront reads up to
# 11 MiB of a reader's icon of up to 10 MiB with its multipart framing, and
# web-admin as much of a console image upload of the same size.
location / {
    client_max_body_size 11m;
    proxy_pass http://$publira_app;
}
