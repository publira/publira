# The paths that resolve the same way on every host, included once per server
# block. `$publira_app` is the app that block set for itself, so the two
# locations that end at the host's own Next.js app are written once here
# rather than three times.
#
# nginx picks the longest matching prefix among `^~` locations and an exact
# `=` location before any of them, which is what orders these:
# /api/v1/ over /api/ over /.

# The Route Handlers of the Next.js app: /api/v1/revalidate on every app, plus
# the view beacon, the read beacon, and the Stripe webhook on the public site.
# Both forms so that /api/v1abc is not one of them.
location = /api/v1 {
    proxy_pass http://$publira_app;
}

location ^~ /api/v1/ {
    proxy_pass http://$publira_app;
}

# Everything else under /api is the public API, which is reached with the
# prefix removed. The trailing slash on proxy_pass is what removes it, so
# /api/readyz arrives as /readyz and a bare /api arrives as /.
location = /api {
    proxy_pass http://publira_api/;
}

location ^~ /api/ {
    proxy_pass http://publira_api/;
}

location / {
    proxy_pass http://$publira_app;
}
