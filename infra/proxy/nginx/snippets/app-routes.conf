# The paths that resolve the same way on every listed host, included once per
# app's server block. `$publira_app` is the app that block set for itself, so
# the two locations that end at the host's own Next.js app are written once
# here rather than three times.
#
# nginx picks the longest matching prefix among `^~` locations and an exact
# `=` location before any of them, which is what orders these:
# /images and /api/v1/ over /api/ over /.

# Image delivery, answered by the same process as the public API and reached
# with the path as it is: the server's own routes carry /images. No trailing
# slash on proxy_pass, so nothing is removed, here or under /rpc and /api.
location ^~ /images {
    proxy_pass http://publira_api;
}

# The public API, reached with the path as it is. Both forms so that /rpcabc is
# not one of them.
location = /rpc {
    proxy_pass http://publira_api;
}

# A reader's icon upload, which the public API reads up to 15 MiB of with its
# base64 encoding, would be refused by nginx's 1m default.
location ^~ /rpc/ {
    client_max_body_size 15m;
    proxy_pass http://publira_api;
}

# The Route Handlers of the Next.js app: /api/v1/revalidate on every app, plus
# the view beacon, the read beacon, and the payment and inbound email webhooks
# on the public site. Both forms so that /api/v1abc is not one of them.
location = /api/v1 {
    proxy_pass http://$publira_app;
}

# An inbound email webhook carries a whole mail with its attachments, which
# nginx's 1m default would refuse.
location ^~ /api/v1/ {
    client_max_body_size 33m;
    proxy_pass http://$publira_app;
}

# Everything else under /api is the public API under the prefix it had before
# /rpc, kept for the clients not yet on /rpc and removed in 0.2.0, with the
# same body limit as /rpc/.
location = /api {
    proxy_pass http://publira_api;
}

location ^~ /api/ {
    client_max_body_size 15m;
    proxy_pass http://publira_api;
}

location / {
    proxy_pass http://$publira_app;
}
