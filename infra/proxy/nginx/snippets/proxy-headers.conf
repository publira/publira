# Request headers every backend behind this edge is given, included once per
# server block.
#
# It has to be one snippet: nginx replaces the whole inherited set of
# proxy_set_header directives as soon as a lower level declares one of its
# own, so a location that set a single header here would silently drop the
# rest. Nothing below this file sets one.

# Verbatim, port included, the way the browser sent it. Tenant resolution
# reads it.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
# This edge's scheme, or the one a hop default.conf.template trusts named.
proxy_set_header X-Forwarded-Proto $publira_forwarded_proto;

# The client address travels in Forwarded (RFC 7239), set to the peer address
# alone rather than appended to: this is the trust boundary, and publira server
# finds the client IP an access token and an audit log entry record in this
# header. Appending would pass a forged value on in front of the real one.
# Behind a hop default.conf.template trusts, the peer address is the client
# address that hop named.
proxy_set_header Forwarded $publira_forwarded;
# publira server reads X-Forwarded-For when no Forwarded arrives, and this
# edge does not write it, so one that arrived is the caller's. An empty value
# means the header is not passed on.
proxy_set_header X-Forwarded-For "";

# W3C Trace Context ends here. An empty value means the header is not passed
# on at all, so each backend opens a fresh root span instead of adopting a
# trace the caller chose.
proxy_set_header traceparent "";
proxy_set_header tracestate "";
proxy_set_header baggage "";
