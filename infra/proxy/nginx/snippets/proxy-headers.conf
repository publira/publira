# Request headers every backend behind this edge is given, included once per
# server block.
#
# It has to be one snippet: nginx replaces the whole inherited set of
# proxy_set_header directives as soon as a lower level declares one of its
# own, so a location that set a single header here would silently drop the
# rest. Nothing below this file sets one.

# Verbatim, port included, the way the browser sent it. Tenant resolution
# reads it.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;

# The peer address, not $proxy_add_x_forwarded_for: this is the trust
# boundary, and the client IP an access token and an audit log entry record is
# the first address in this header. Appending would leave a forged value in
# front of the real one.
proxy_set_header X-Forwarded-For $remote_addr;

# W3C Trace Context ends here. An empty value means the header is not passed
# on at all, so each backend opens a fresh root span instead of adopting a
# trace the caller chose.
proxy_set_header traceparent "";
proxy_set_header tracestate "";
proxy_set_header baggage "";
