# Image delivery, included by every app's server block through app-routes.conf
# and by the image hosts' server block, which serves nothing else. It is
# answered by the same process as the public API and reached with the path as
# it is: the server's own routes carry /images. No trailing slash on
# proxy_pass, so nothing is removed.
location ^~ /images {
    limit_req zone=publira_images burst=600 nodelay;
    proxy_pass http://publira_api;
}
