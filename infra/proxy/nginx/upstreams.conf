# Backend addresses: the half of the configuration that changes per
# environment. publira.conf names these groups and nothing else, so replacing
# this file is all a deployment has to do.
#
# The addresses are the Dev Container's, where every backend is a process
# inside the one `app` container. Underscored names cannot be confused with a
# real host name, which matters because publira.conf reaches two of them
# through a variable.

upstream publira_web_host {
    server app:3000;
}

upstream publira_web_admin {
    server app:4000;
}

upstream publira_web_platform {
    server app:4100;
}

upstream publira_api {
    server app:8000;
}

upstream publira_image_server {
    server app:8200;
}

upstream publira_admin_image_server {
    server app:8201;
}
