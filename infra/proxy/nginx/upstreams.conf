# Backend addresses: the half of the configuration that changes per
# environment. default.conf.template names these groups and nothing else, so
# replacing this file is all a deployment does to its addresses.
#
# The addresses are the Dev Container's, where every backend is a process
# inside the one `app` container. Underscored names cannot be confused with a
# real host name, which matters because default.conf.template reaches the
# three apps through a variable.

upstream publira_web_host {
    server app:3000;
}

upstream publira_web_admin {
    server app:4000;
}

# Omitted on an install that runs no web-platform. The platform server block
# names it through a variable, which nginx looks up only for a request that
# block answers, and with PUBLIRA_EDGE_PLATFORM_HOSTS empty it answers none.
upstream publira_web_platform {
    server app:4100;
}

# The server's edge listener, which /api and /images reach as they are.
upstream publira_api {
    server app:8000;
}
