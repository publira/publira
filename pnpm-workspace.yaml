packages:
  - apps/*
  - packages/*
  - e2e

# npm reads devEngines.packageManager too, and refuses every command run at the
# repository root, `npx skills update` included, while the entry names pnpm and
# its onFail is not "ignore" or "warn". The entry therefore says "ignore", and
# this setting, which overrides it for pnpm alone, has pnpm switch to the pinned
# release anyway.
pmOnFail: download

allowBuilds:
  # react-email ships an esbuild binary for its preview CLI.
  esbuild: true
  lefthook: true
  sharp: true

catalog:
  "@base-ui/react": 1.9.0
  "@buf/googleapis_googleapis.bufbuild_es": 2.13.0-20261015202054-8ac61b9e5023.1
  "@next/playwright": 16.4.5
  "@next/third-parties": 16.4.5
  "@opentelemetry/api": 1.10.0
  "@opentelemetry/semantic-conventions": 1.44.0
  "@publira/comic-viewer": 1.0.0
  "@publira/next-cache-handlers": 1.1.1
  "@simplewebauthn/browser": 14.0.0
  "@tailwindcss/postcss": 4.3.4
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  fflate: 0.8.3
  jose: 6.2.15
  jsdom: 31.0.0
  lru-cache: 11.5.3
  next: 16.4.5
  oxlint: 1.92.0
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.4
  temporal-polyfill: 1.0.8
  tsdown: 0.23.7
  typescript: 7.0.2
  vitest: 5.1.0
  zod: 4.6.7

# These packages come from this organization, so there is no reason to wait out
# the window that guards against a freshly published release.
minimumReleaseAgeExclude:
  - "@publira/*"

# @typescript-eslint/typescript-estree and eslint-plugin-sonarjs still ask for
# minimatch ^10, and the globparts amplification in GHSA-g3hv-75wg-m249 is fixed
# only in 11.0.1. Both call only minimatch() and Minimatch#match, which 11.0
# keeps. Drop this once both accept ^11.
overrides:
  minimatch@10: 11.0.5
savePrefix: ""
