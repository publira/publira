packages:
  - apps/*
  - packages/*
  - e2e

allowBuilds:
  # react-email ships an esbuild binary for its preview CLI.
  esbuild: true
  lefthook: true
  sharp: true

catalog:
  "@base-ui/react": 1.9.0
  "@buf/googleapis_googleapis.bufbuild_es": 2.13.0-20261015202054-8ac61b9e5023.1
  "@next/playwright": 16.4.3
  "@next/third-parties": 16.4.3
  "@opentelemetry/api": 1.10.0
  "@opentelemetry/semantic-conventions": 1.43.0
  "@publira/comic-viewer": 1.0.0
  "@publira/next-cache-handlers": 1.1.0
  "@simplewebauthn/browser": 14.0.0
  "@tailwindcss/postcss": 4.3.3
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  jose: 6.2.13
  jsdom: 30.1.3
  lru-cache: 11.5.3
  next: 16.4.3
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.3
  temporal-polyfill: 1.0.6
  tsdown: 0.23.3
  typescript: 6.0.3
  vitest: 5.0.5
  zod: 4.6.7

# These packages come from this organization, so there is no reason to wait out
# the window that guards against a freshly published release.
minimumReleaseAgeExclude:
  - "@publira/*"
savePrefix: ""
