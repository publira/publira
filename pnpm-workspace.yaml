packages:
  - apps/*
  - packages/*
  - e2e

allowBuilds:
  # react-email ships an esbuild binary for its preview CLI.
  esbuild: true
  sharp: true

catalog:
  "@base-ui/react": 1.7.0
  "@buf/googleapis_googleapis.bufbuild_es": 2.13.0-20260414192239-c17df5b2beca.1
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/semantic-conventions": 1.43.0
  "@publira/comic-viewer": 0.7.0
  "@tailwindcss/postcss": 4.3.3
  "@testing-library/dom": 10.4.1
  "@testing-library/react": 16.3.3
  "@types/node": 24.13.3
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
  jose: 6.2.10
  jsdom: 30.0.1
  lru-cache: 11.5.2
  next: 16.3.4
  p-retry: 8.0.1
  react: 19.2.8
  react-dom: 19.2.8
  react-email: 6.9.3
  react-markdown: 10.1.0
  redis: 6.2.1
  tailwindcss: 4.3.3
  temporal-polyfill: 1.0.4
  tsdown: 0.22.14
  typescript: 6.0.3
  vitest: 4.1.11
  zod: 4.5.4

catalogMode: strict
# These packages come from this organization, so there is no reason to wait out
# the window that guards against a freshly published release.
minimumReleaseAgeExclude:
  - "@publira/*"
savePrefix: ""
