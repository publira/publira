# Dev Container overlay on the repository-root `compose.yaml`.
#
# `dockerComposeFile` in devcontainer.json passes both files, root first, so
# everything here merges onto the dependency stack defined there. This file
# owns only what the Dev Container adds: the `app` container the editor
# attaches to, the Traefik edge in front of it, and the volumes that keep
# agent logins and the pnpm store across rebuilds.
#
# Relative paths resolve against the project directory, which is the directory
# of the *first* compose file — the repository root, not `.devcontainer/`.

services:
  traefik:
    image: traefik:v3.7.13@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:3080"
      # Every request that reaches this entrypoint comes from outside, so it
      # loses its W3C Trace Context here. Entrypoint middlewares run before
      # the ones a router declares, and a new router inherits this one
      # without having to remember it.
      - "--entrypoints.web.http.middlewares=strip-trace-context@docker"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
    depends_on:
      - app

  app:
    init: true
    image: ghcr.io/publira/base-images/publira-dev:2026.09.06@sha256:42dd24e938c50a7f78aacd917a01190690a6dfe914f3688e78601e8efe2ef94a
    command: sleep infinity
    volumes:
      # Keep Claude Code login, configuration, and local state across rebuilds.
      - claude-data:/home/vscode/.claude
      # Keep Codex login, configuration, rules, and local state across rebuilds.
      - codex-data:/home/vscode/.codex
      # Keep Antigravity CLI login, configuration, and local state across rebuilds.
      - gemini-data:/home/vscode/.gemini
      - gh-config:/home/vscode/.config/gh
      - grok-config:/home/vscode/.grok
      # Reuse downloaded pnpm packages after rebuilding the container.
      - pnpm-store:/home/vscode/.local/share/pnpm/store
      - ..:/workspaces:cached
    depends_on:
      - db
      - jaeger
      - mailpit
      - redis
      - rustfs
    environment:
      # Credentials the AWS SDK / aws CLI read for the RustFS endpoint below
      AWS_ACCESS_KEY_ID: publira
      AWS_REGION: us-east-1
      AWS_SECRET_ACCESS_KEY: publirapass
      # .claude.json (OAuth account, project trust) lives outside ~/.claude by
      # default; point it at the persisted volume so rebuilds don't force
      # re-auth. https://code.claude.com/docs/en/devcontainer
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      # Where the Go servers and the Next.js apps send spans. The
      # OpenTelemetry SDK reads these names itself, so they keep the spelling
      # its documentation uses.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      # Key the Go APIs and image servers sign HS256 access tokens with.
      # Required — the servers refuse to start without it. Local development
      # only: it is published in this repository, so never reuse it elsewhere.
      PUBLIRA_AUTH_JWT_SECRET: publira-dev-only-insecure-access-token-secret
      # Key the Next.js apps seal their session cookie (JWE) with. Required —
      # `resolveAuthSecret()` has no fallback. Local development only: it is
      # published in this repository, so never reuse it outside a dev stack.
      PUBLIRA_AUTH_SECRET: publira-dev-only-insecure-web-session-secret
      # Shared Next.js server cache (cacheHandler / cacheHandlers)
      PUBLIRA_REDIS_URL: redis://redis:6379
      # The Go APIs call every web app directly for cache-tag revalidation.
      # These are private loopback endpoints inside the shared app container;
      # public browser URLs and Traefik are deliberately not part of this path.
      PUBLIRA_REVALIDATE_TOKEN: publira-dev-only-revalidate-token
      PUBLIRA_WEB_HOST_INTERNAL_URL: http://127.0.0.1:3000
      PUBLIRA_WEB_ADMIN_INTERNAL_URL: http://127.0.0.1:4000
      PUBLIRA_WEB_PLATFORM_INTERNAL_URL: http://127.0.0.1:4100
      # S3 / RustFS local object storage
      PUBLIRA_S3_BUCKET: publira
      PUBLIRA_S3_ENDPOINT: http://rustfs:9000
      PUBLIRA_S3_FORCE_PATH_STYLE: "true"
      # Tracing is off unless a deployment asks for it; the dev stack asks.
      PUBLIRA_TRACING_ENABLED: "true"
    labels:
      - "traefik.enable=true"

      # The trust boundary for W3C Trace Context. The Go servers adopt an
      # inbound `traceparent` as the parent span, so a caller who can set the
      # header picks the trace ID and the sampled flag: it could graft spans
      # onto someone else's trace, or force export past the production
      # sampling ratio. Dropping the three headers here leaves the servers a
      # request with no trace context, and they open a fresh root span.
      #
      # First-party server-to-server traffic keeps its trace context because
      # none of it passes through Traefik: the SSR clients dial the gRPC
      # ports directly and the Go APIs call the Next.js revalidate endpoints
      # over PUBLIRA_WEB_*_INTERNAL_URL.
      - "traefik.http.middlewares.strip-trace-context.headers.customrequestheaders.traceparent="
      - "traefik.http.middlewares.strip-trace-context.headers.customrequestheaders.tracestate="
      - "traefik.http.middlewares.strip-trace-context.headers.customrequestheaders.baggage="

      # web-host: the public tenant site (port 3000)
      - "traefik.http.routers.web-host.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web-host.entrypoints=web"
      - "traefik.http.routers.web-host.priority=1"
      - "traefik.http.routers.web-host.service=web-host"
      - "traefik.http.services.web-host.loadbalancer.server.port=3000"

      # web-admin on dedicated host: admin.*:3080
      - "traefik.http.routers.web-admin.rule=HostRegexp(`^admin\\d*\\..*$`)"
      - "traefik.http.routers.web-admin.entrypoints=web"
      - "traefik.http.routers.web-admin.priority=100"
      - "traefik.http.routers.web-admin.service=web-admin"
      - "traefik.http.services.web-admin.loadbalancer.server.port=4000"

      # web-platform on dedicated host: platform.*:3080
      - "traefik.http.routers.web-platform.rule=HostRegexp(`^platform\\..*$`)"
      - "traefik.http.routers.web-platform.entrypoints=web"
      - "traefik.http.routers.web-platform.priority=100"
      - "traefik.http.routers.web-platform.service=web-platform"
      - "traefik.http.services.web-platform.loadbalancer.server.port=4100"

      # api-server on /api -> app:8000 (strip /api before forwarding).
      # Priority 105 beats admin/platform hosts (100) so /api is host-agnostic;
      # /images (110) and admin /images (130) stay above it.
      - "traefik.http.routers.api.rule=PathRegexp(`^/api(/.*)?$`) && !PathRegexp(`^/api/v1/revalidate/?$`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=105"
      - "traefik.http.routers.api.middlewares=api-strip"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

      # public image-server on /images -> app:8200
      - "traefik.http.routers.image-server.rule=PathPrefix(`/images`)"
      - "traefik.http.routers.image-server.entrypoints=web"
      - "traefik.http.routers.image-server.priority=110"
      - "traefik.http.routers.image-server.service=image-server"
      - "traefik.http.services.image-server.loadbalancer.server.port=8200"

      # admin image-server on admin.* + /images -> app:8201
      - "traefik.http.routers.admin-image-server.rule=HostRegexp(`^admin\\d*\\..*$`) && PathPrefix(`/images`)"
      - "traefik.http.routers.admin-image-server.entrypoints=web"
      - "traefik.http.routers.admin-image-server.priority=130"
      - "traefik.http.routers.admin-image-server.service=admin-image-server"
      - "traefik.http.services.admin-image-server.loadbalancer.server.port=8201"

  # The dependency services come from the root compose file, which publishes
  # each of them on 127.0.0.1 for a host-side `task dev`. Inside the Dev
  # Container everything reaches them by service name (`db:5432`,
  # `redis:6379`, `rustfs:9000`), and the UIs a person opens are forwarded by
  # `forwardPorts` in devcontainer.json, so nothing here needs a host port.
  db:
    ports: !reset []

  jaeger:
    ports: !reset []

  mailpit:
    ports: !reset []

  redis:
    ports: !reset []

  rustfs:
    ports: !reset []

volumes:
  claude-data:
  codex-data:
  gemini-data:
  gh-config:
  grok-config:
  pnpm-store:
