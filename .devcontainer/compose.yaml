# Dev Container overlay on the repository-root `compose.yaml`.
#
# `dockerComposeFile` in devcontainer.json passes both files, root first, so
# everything here merges onto the dependency stack defined there. This file
# owns only what the Dev Container adds: the `app` container the editor
# attaches to, the Traefik edge in front of it, and the volumes that keep
# agent logins, the pnpm store, and the Android toolchain across rebuilds.
#
# Relative paths resolve against the project directory, which is the directory
# of the *first* compose file — the repository root, not `.devcontainer/`.

services:
  traefik:
    image: traefik:v3.7.14@sha256:e849695bc5c317da0cec22bfee4794fd9e15871fe554f864d31b625983e883ff
    restart: unless-stopped
    volumes:
      # The routing contract (routes.yaml) and this environment's backend
      # addresses (services.yaml), merged by the file provider. Read-only:
      # edits arrive through the `..:/workspaces` mount on `app`, so nothing
      # writes from this side.
      - ./infra/proxy/traefik/dynamic:/etc/traefik/dynamic:ro
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:3080"
      # Every request that reaches this entrypoint comes from outside, so it
      # loses its W3C Trace Context here. Entrypoint middlewares run before
      # the ones a router declares, and a new router inherits this one
      # without having to remember it.
      - "--entrypoints.web.http.middlewares=strip-trace-context@file,strip-forwarded@file"
      - "--providers.file.directory=/etc/traefik/dynamic"
      # An edit to either file takes effect without restarting the stack.
      - "--providers.file.watch=true"
    # The hosts routes.yaml serves are the root compose.yaml's, merged in.
    environment:
      PUBLIRA_EDGE_BACKEND_HOST: app
    # devcontainer.json forwards traefik:3080.
    ports: !reset []
    depends_on:
      - app

  app:
    init: true
    image: ghcr.io/publira/base-images/publira-dev:2026.10.08@sha256:4f334883dc44d76447dd78e6c5d7c64428385350ac0b339612105a05c8191605
    command: sleep infinity
    volumes:
      # Keep Claude Code login, configuration, and local state across rebuilds.
      - claude-data:/home/vscode/.claude
      # Keep Codex login, configuration, rules, and local state across rebuilds.
      - codex-data:/home/vscode/.codex
      # Keep Antigravity CLI login, configuration, and local state across rebuilds.
      - gemini-data:/home/vscode/.gemini
      - gh-config:/home/vscode/.config/gh
      - grok-config:/home/vscode/.grok
      # Reuse downloaded pnpm packages after rebuilding the container.
      - pnpm-store:/home/vscode/.local/share/pnpm/store
      # Keep what `task mobile:android-install` and the first Android build
      # download across rebuilds: the JDK and the SDK, the AVD, and Gradle's
      # distributions and caches, about 12 GB that would otherwise be fetched
      # again and the SDK license accepted again. What that task sets up
      # outside these paths is redone by the mobile tasks that need it.
      - android-sdk:/home/vscode/Android
      - android-user-home:/home/vscode/.android
      - gradle-user-home:/home/vscode/.gradle
      - ..:/workspaces:cached
      # The whole configuration of the inner Docker daemon: the
      # docker-in-docker feature starts `dockerd` with flags only and never
      # writes this file, so a new daemon option goes into daemon.json here.
      # Docker Hub pulls go to Google's cache first, so only an image missing
      # from it counts against the anonymous rate limit.
      # The build cache is capped at 10 GB: BuildKit's default limits are
      # sized from the host disk (hundreds of GB), and the daemon's volume
      # lives on the host's root filesystem and outlives rebuilds. A rule's
      # retention goes in an `unused-for=` filter, because dockerd silently
      # ignores a `keepDuration` key there. Old images are pruned by
      # post-start.sh, since Docker Engine never removes one by itself.
      - ./.devcontainer/daemon.json:/etc/docker/daemon.json:ro
    depends_on:
      - db
      - jaeger
      - mailpit
      - redis
      - rustfs
    environment:
      # Credentials the AWS SDK / aws CLI read for the RustFS endpoint below
      AWS_ACCESS_KEY_ID: publira
      AWS_REGION: us-east-1
      AWS_SECRET_ACCESS_KEY: publirapass
      # .claude.json (OAuth account, project trust) lives outside ~/.claude by
      # default; point it at the persisted volume so rebuilds don't force
      # re-auth. https://code.claude.com/docs/en/devcontainer
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      # Where the Go servers and the Next.js apps send spans. The
      # OpenTelemetry SDK reads these names itself, so they keep the spelling
      # its documentation uses.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      # Key publira server signs and verifies HS256 access tokens with, on the
      # image routes too. Required — it refuses to start without it. Local
      # development only: it is published in this repository, so never reuse it
      # elsewhere.
      PUBLIRA_AUTH_JWT_SECRET: publira-dev-only-insecure-access-token-secret
      # Key the Next.js apps seal their session cookie (JWE) with. Required —
      # `resolveAuthSecret()` has no fallback. Local development only: it is
      # published in this repository, so never reuse it outside a dev stack.
      PUBLIRA_AUTH_SECRET: publira-dev-only-insecure-web-session-secret
      # Redis the server and the web apps' shared Next.js cache
      # (@publira/next-cache-handlers) both use; the two names carry one value.
      PUBLIRA_REDIS_URL: redis://redis:6379
      PNCH_REDIS_URL: redis://redis:6379
      # publira server and worker call every web app directly for cache-tag
      # revalidation.
      # These are private loopback endpoints inside the shared app container;
      # public browser URLs and Traefik are deliberately not part of this path.
      PUBLIRA_REVALIDATE_TOKEN: publira-dev-only-revalidate-token
      PNCH_REVALIDATE_TOKEN: publira-dev-only-revalidate-token
      # The credential the consoles read tenant-level data with, which the
      # server admits to those reads alone.
      PUBLIRA_WEB_SERVICE_TOKEN: publira-dev-only-web-service-token
      PUBLIRA_WEB_HOST_INTERNAL_URL: http://127.0.0.1:3000
      PUBLIRA_WEB_ADMIN_INTERNAL_URL: http://127.0.0.1:4000
      PUBLIRA_WEB_PLATFORM_INTERNAL_URL: http://127.0.0.1:4100
      # This edge serves plain HTTP.
      PUBLIRA_TENANT_URL_SCHEME: http
      # S3 / RustFS local object storage
      PUBLIRA_S3_BUCKET: publira
      PUBLIRA_S3_ENDPOINT: http://rustfs:9000
      PUBLIRA_S3_FORCE_PATH_STYLE: "true"
      # Tracing is off unless a deployment asks for it; the dev stack asks.
      PUBLIRA_TRACING_ENABLED: "true"

  # The dependency services come from the root compose file, which publishes
  # each of them on 127.0.0.1 for a host-side `task dev`. Inside the Dev
  # Container everything reaches them by service name (`db:5432`,
  # `redis:6379`, `rustfs:9000`), and the UIs a person opens are forwarded by
  # `forwardPorts` in devcontainer.json, so nothing here needs a host port.
  db:
    ports: !reset []

  jaeger:
    ports: !reset []

  mailpit:
    ports: !reset []

  redis:
    ports: !reset []

  rustfs:
    ports: !reset []

volumes:
  android-sdk:
  android-user-home:
  claude-data:
  codex-data:
  gemini-data:
  gh-config:
  gradle-user-home:
  grok-config:
  pnpm-store:
