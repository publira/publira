version: "3.8"

services:
  traefik:
    image: traefik:3.6.10@sha256:c549d482c55d7a797398562064f35428cc53e748d84d7190997930e7b31bcc32
    restart: unless-stopped
    ports:
      - "3080:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:80"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    depends_on:
      - db
      - mailpit
    labels:
      # web-public fallback (port 3000)
      - "traefik.enable=true"
      - "traefik.http.routers.web-public.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web-public.entrypoints=web"
      - "traefik.http.routers.web-public.priority=1"
      - "traefik.http.routers.web-public.service=web-public"
      - "traefik.http.services.web-public.loadbalancer.server.port=3000"

      # web-catalog (port 3001)
      - "traefik.http.routers.web-catalog.rule=PathRegexp(`^/$|^/(authors|series|labels)(/.*)?$|^/web-catalog-assets(/.*)?$|^/api/catalog/revalidate/?$`)"
      - "traefik.http.routers.web-catalog.entrypoints=web"
      - "traefik.http.routers.web-catalog.priority=10"
      - "traefik.http.routers.web-catalog.service=web-catalog"
      - "traefik.http.services.web-catalog.loadbalancer.server.port=3001"

      # web-member (port 3002)
      - "traefik.http.routers.web-member.rule=PathRegexp(`^/my$|^/(notifications|settings)(/.*)?$|^/web-member-assets(/.*)?$`)"
      - "traefik.http.routers.web-member.entrypoints=web"
      - "traefik.http.routers.web-member.priority=10"
      - "traefik.http.routers.web-member.service=web-member"
      - "traefik.http.services.web-member.loadbalancer.server.port=3002"

      # web-auth (port 3003)
      - "traefik.http.routers.web-auth.rule=PathRegexp(`^/(login|logout|verify|confirm-email|confirm-password)$|^/(signup|reset-password)(/.*)?$|^/web-auth-assets(/.*)?$`)"
      - "traefik.http.routers.web-auth.entrypoints=web"
      - "traefik.http.routers.web-auth.priority=10"
      - "traefik.http.routers.web-auth.service=web-auth"
      - "traefik.http.services.web-auth.loadbalancer.server.port=3003"

      # web-admin on dedicated host: admin.*:3080
      - "traefik.http.routers.web-admin.rule=HostRegexp(`^admin\\d*\\..*$`)"
      - "traefik.http.routers.web-admin.entrypoints=web"
      - "traefik.http.routers.web-admin.priority=100"
      - "traefik.http.routers.web-admin.service=web-admin"
      - "traefik.http.services.web-admin.loadbalancer.server.port=4000"

      # web-platform on dedicated host: platform.*:3080
      - "traefik.http.routers.web-platform.rule=HostRegexp(`^platform\\..*$`)"
      - "traefik.http.routers.web-platform.entrypoints=web"
      - "traefik.http.routers.web-platform.priority=100"
      - "traefik.http.routers.web-platform.service=web-platform"
      - "traefik.http.services.web-platform.loadbalancer.server.port=4100"

      # api-server on /api -> app:8000 (strip /api before forwarding)
      - "traefik.http.routers.api.rule=PathRegexp(`^/api(/.*)?$`) && !PathRegexp(`^/api/revalidate/?$`) && !PathRegexp(`^/api/catalog/revalidate/?$`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.routers.api.middlewares=api-strip"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

      # public image-server on /images -> app:8200
      - "traefik.http.routers.image-server.rule=PathPrefix(`/images`)"
      - "traefik.http.routers.image-server.entrypoints=web"
      - "traefik.http.routers.image-server.priority=110"
      - "traefik.http.routers.image-server.service=image-server"
      - "traefik.http.services.image-server.loadbalancer.server.port=8200"

      # admin image-server on admin.* + /images -> app:8201
      - "traefik.http.routers.admin-image-server.rule=HostRegexp(`^admin\\d*\\..*$`) && PathPrefix(`/images`)"
      - "traefik.http.routers.admin-image-server.entrypoints=web"
      - "traefik.http.routers.admin-image-server.priority=130"
      - "traefik.http.routers.admin-image-server.service=admin-image-server"
      - "traefik.http.services.admin-image-server.loadbalancer.server.port=8201"

  db:
    image: postgres:18.3-alpine3.23@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: publira
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.29.6@sha256:0b5c5f7ffd3c93474baa7fd3869c1462e5a3d03256ed0933dfc0e7d81d794036
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  postgres-data:
