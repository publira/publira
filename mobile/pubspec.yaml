name: publira
description: "Publira mobile app for iOS, Android, and Web."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# Exact versions, as in every other manifest, so each upgrade is its own edit
# here; replace the caret `flutter pub add` writes.
dependencies:
  flutter:
    sdk: flutter

  # HMAC-SHA256 for the image-server page stream (see lib/api/image_cipher.dart).
  crypto: 3.0.7
  cupertino_icons: 1.0.9
  firebase_core: 4.14.0
  firebase_messaging: 16.7.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 10.3.1
  go_router: 18.0.0
  http: 1.6.0
  intl: 0.20.3
  path_provider: 2.1.6
  app_links: 7.2.1
  share_plus: 13.3.0
  timezone: 0.11.1
  url_launcher: 6.3.2
  flutter_markdown_plus: 1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: 6.0.0
  # Reads the app manifest (scripts/app_manifest/) before a build; never shipped.
  yaml: 3.1.4

flutter:
  # Builds without --flavor get the development app; store builds pass
  # `--flavor production`.
  default-flavor: dev

  uses-material-design: true
