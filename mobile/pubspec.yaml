name: publira
description: "Publira mobile app for iOS, Android, and Web."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# Exact versions, as in every other manifest, so each upgrade is its own edit
# here; replace the caret `flutter pub add` writes.
dependencies:
  flutter:
    sdk: flutter

  # HMAC-SHA256 for the page stream the image routes send
  # (see lib/api/image_cipher.dart).
  crypto: 3.0.7
  cupertino_icons: 2.0.0
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0
  # The Int64 the generated messages hold an int64 field in.
  fixnum: 1.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 10.3.4
  go_router: 18.1.0
  http: 1.6.0
  # Store in-app purchase: StoreKit 2 on iOS, Play Billing on Android.
  in_app_purchase_android: 0.5.4
  in_app_purchase_platform_interface: 1.4.1
  in_app_purchase_storekit: 0.4.14
  intl: 0.20.3
  path_provider: 2.1.6
  # The runtime of the API messages buf generates into lib/api/gen/ from
  # proto/; buf.gen.yaml pins the plugin that writes them.
  protobuf: 6.1.0
  app_links: 7.2.2
  share_plus: 13.3.1
  timezone: 0.11.2
  url_launcher: 6.3.3
  flutter_markdown_plus: 1.0.12
  # The Markdown syntax tree flutter_markdown_plus lays out.
  markdown: 7.3.1
  # Formats the catalog's MessageFormat 2 messages (see lib/l10n/message_format.dart).
  messageformat: 0.1.0
  sign_in_with_apple: 8.2.0
  google_sign_in_android: 7.2.18
  google_sign_in_ios: 6.3.8
  google_sign_in_platform_interface: 3.1.0
  package_info_plus: 10.2.2
  # The photo a reader picks for their account icon (see
  # lib/auth/account_icon_picker.dart).
  image_picker: 1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: 6.0.0
  # The platform a test stands the photo library picker in for.
  image_picker_platform_interface: 2.11.2
  # The platform a test stands Sign in with Apple's sheet or web flow in for.
  sign_in_with_apple_platform_interface: 2.0.0
  # Reads the app manifest (scripts/app_manifest/) before a build; never shipped.
  yaml: 3.1.4

flutter:
  # Builds without --flavor get the development app; store builds pass
  # `--flavor production`.
  default-flavor: dev

  uses-material-design: true
