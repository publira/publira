version: "3"

tasks:
  # Public tasks are alphabetized; internal tasks are at the bottom.
  analyze:
    desc: Run Flutter analyzer (info is treated as failure)
    cmds:
      - flutter analyze --fatal-infos

  android-install:
    desc: Install a JDK, the Android SDK, and an emulator into the Dev Container (asks you to accept the SDK license)
    interactive: true
    cmds:
      - bash scripts/android-install.sh

  check:
    desc: Run format, analyze, and unit tests (CI-equivalent gate)
    cmds:
      - task: format
      - task: analyze
      - task: test

  deps:
    desc: Install Flutter package dependencies and generate the build configuration from Publira's own app manifest
    cmds:
      - flutter pub get
      - dart run scripts/app_manifest.dart --generate

  emulator-start:
    desc: Boot the Android emulator android-install created, headless, and wait until it has booted
    cmds:
      - bash scripts/emulator.sh start

  emulator-stop:
    desc: Shut down the running Android emulators
    cmds:
      - bash scripts/emulator.sh stop

  format:
    desc: Check Dart formatting (fails if files would change)
    cmds:
      - dart format --output=none --set-exit-if-changed .

  run:
    desc: Run the app on a device against the selected development profile
    cmds:
      - bash scripts/run.sh {{.CLI_ARGS}}

  screenshot:
    desc: Photograph screens against the selected development profile (routes as arguments)
    cmds:
      - bash scripts/screenshot.sh {{.CLI_ARGS}}

  test:
    desc: Run Flutter unit and widget tests
    cmds:
      - flutter test

  test-integration:
    desc: Run Flutter integration tests (requires a device or emulator)
    cmds:
      - bash scripts/e2e-test.sh {{.CLI_ARGS}}

  e2e:
    desc: Start the public API stack, run integration tests, always tear down
    cmds:
      - bash scripts/e2e-run.sh {{.CLI_ARGS}}
