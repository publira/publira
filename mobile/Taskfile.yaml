version: "3"

tasks:
  # Public tasks are alphabetized; internal tasks are at the bottom.
  analyze:
    desc: Run Flutter analyzer (info is treated as failure)
    cmds:
      - flutter analyze --fatal-infos

  android-install:
    desc: Install a JDK, the Android SDK, and an emulator into the Dev Container (asks you to accept the SDK license)
    interactive: true
    cmds:
      - bash scripts/android-install.sh

  build:
    desc: Build the app a tenant publishes from its app manifest (task mobile:build -- <manifest> <apk|appbundle|ios|ipa> [flutter build arguments])
    # The manifest is named relative to where the task was started.
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - task: android-attach
      - dart run "{{.TASKFILE_DIR}}/scripts/build.dart" {{.CLI_ARGS}}

  check:
    desc: Run format, analyze, and unit tests (CI-equivalent gate)
    cmds:
      - task: format
      - task: analyze
      - task: test

  deps:
    desc: Install Flutter package dependencies and generate the build configuration from Publira's own app manifest
    cmds:
      - flutter pub get
      - dart run scripts/app_manifest.dart --generate

  emulator-start:
    desc: Boot the Android emulator android-install created, headless, and wait until it has booted
    cmds:
      - task: android-attach
      - bash scripts/emulator.sh start

  emulator-stop:
    desc: Shut down the running Android emulators
    cmds:
      - bash scripts/emulator.sh stop

  format:
    desc: Check Dart formatting (fails if files would change)
    cmds:
      - dart format --output=none --set-exit-if-changed .

  linux-install:
    desc: Install Xvfb and the Secret Service the Linux desktop build needs in the Dev Container (uses sudo)
    cmds:
      - bash scripts/linux-install.sh

  run:
    desc: Run the app on a device against the selected development profile
    cmds:
      - bash scripts/run.sh {{.CLI_ARGS}}

  screenshot:
    desc: Photograph screens against the selected development profile (routes as arguments)
    cmds:
      - bash scripts/screenshot.sh {{.CLI_ARGS}}

  test:
    desc: Run Flutter unit and widget tests
    cmds:
      - flutter test

  test-device-ports:
    desc: Check the address and port forwarding test-integration gives each kind of device, with adb and flutter stubbed (no device)
    cmds:
      - bash scripts/device-ports_test.sh

  test-integration:
    desc: Run Flutter integration tests (requires a device or emulator)
    cmds:
      - bash scripts/e2e-test.sh {{.CLI_ARGS}}

  test-ios-build:
    desc: Build both iOS flavors with Xcode and check the manifest's identity reached the built app (macOS)
    cmds:
      - bash scripts/ios-build-test.sh

  e2e:
    desc: Start the public API stack, run integration tests, always tear down
    cmds:
      - bash scripts/e2e-run.sh {{.CLI_ARGS}}

  e2e-linux:
    desc: Start the public API stack, run integration tests on the Linux desktop build under Xvfb, always tear down (no emulator)
    env:
      PUBLIRA_E2E_MOBILE_DEVICE: linux
    cmds:
      - bash scripts/e2e-run.sh {{.CLI_ARGS}}

  # A rebuilt Dev Container keeps the SDK in its volumes but loses the settings
  # that point at it. Run here rather than when the container is created, since
  # most work in it never touches Android.
  android-attach:
    internal: true
    platforms: [linux]
    cmds:
      - bash scripts/android-install.sh --attach
